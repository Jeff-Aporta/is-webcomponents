<!DOCTYPE html>
<html lang="es" class="theme-dark" data-theme="dark" data-palette="insoft">
<head>
  <meta charset="UTF-8" />
  <script src="../../scripts/preview-boot.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>is-resize-observer · IS Web Components</title>
  <link rel="stylesheet" href="../../styles/is-base.css" />
  <link rel="stylesheet" href="../../styles/palettes.css" />
  <link rel="stylesheet" href="../../styles/presentation.css" />
  <script type="module" src="../../dist/cdn/all.min.js"></script>
  <script src="../../scripts/highlight-pre.js" defer></script>
  <script src="../../scripts/demo-code.js" defer></script>
  <script src="../../scripts/docs-chrome.js" defer></script>
  <script type="module" src="../../scripts/preview-chrome.js"></script>
</head>
<body>
  <is-split-panel class="page" orientation="horizontal" position-in-pixels="220" primary="end" storage-key="docs-toc">
    <is-main class="main" slot="start" remember-scroll storage-key="docs-is-resize-observer">
      <section class="section" id="intro">
        <h2>&lt;is-resize-observer&gt;</h2>
        <p class="lede">Observa hijos directos y emite <code class="code">is-resize</code> con entries.</p>
        <is-resize-observer id="ro">
          <div id="roBox" style="resize:both;overflow:auto;min-width:120px;min-height:80px;max-width:100%;padding:1rem;background:var(--is-control-bg);border-radius:8px;border:1px dashed var(--is-control-border)">
            Arrastra la esquina para redimensionar
          </div>
        </is-resize-observer>
        <div class="log" id="roLog" aria-live="polite" style="margin-top:12px"><div class="row hint">Dimensiones al redimensionar.</div></div>
      </section>
      <section class="section" id="reference">
        <h2>Referencia</h2>
        <table class="ref">
          <thead><tr><th>Atributo / evento</th><th>Descripción</th></tr></thead>
          <tbody>
            <tr><td><code>disabled</code></td><td>Desactiva observer</td></tr>
            <tr><td><code>is-resize</code></td><td>detail: { entries }</td></tr>
          </tbody>
        </table>
      </section>
    </is-main>
    <aside class="sidebar" slot="end">
      <h1>is-resize-observer</h1>
      <is-scrollspy target="is-main"><a href="#intro">Introducción</a><a href="#reference">Referencia</a></is-scrollspy>
    </aside>
  </is-split-panel>
  <script>
    document.getElementById('ro').addEventListener('is-resize', (e) => {
      const entry = e.detail.entries[0];
      if (!entry) return;
      const log = document.getElementById('roLog');
      log.querySelector('.hint')?.closest('.row')?.remove();
      const { width, height } = entry.contentRect;
      log.insertAdjacentHTML('afterbegin', `<div class="row"><span class="e">${Math.round(width)}×${Math.round(height)} px</span></div>`);
    });
  </script>
</body>
</html>
