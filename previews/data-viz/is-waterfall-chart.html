<!DOCTYPE html>
<html lang="es" class="theme-dark" data-theme="dark" data-palette="insoft">
<head>
  <meta charset="UTF-8" />
  <script src="../../scripts/preview-boot.js"></script>
  <script type="module" src="../../dist/cdn/all.min.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>is-waterfall-chart · IS Web Components</title>
  <link rel="stylesheet" href="../../styles/is-base.css" />
  <link rel="stylesheet" href="../../styles/palettes.css" />
  <link rel="stylesheet" href="../../styles/presentation.css" />
  <script src="../../scripts/highlight-pre.js" defer></script>
  <script src="../../scripts/demo-code.js" defer></script>
  <script src="../../scripts/docs-chrome.js" defer></script>
  <script type="module" src="../../scripts/preview-chrome.js"></script>

<body>
  <is-split-panel class="page" orientation="horizontal" position-in-pixels="220" primary="end" storage-key="docs-toc">
    <is-main class="main" slot="start" remember-scroll storage-key="docs-is-waterfall-chart">
      <section class="section" id="intro">
        <h2>&lt;is-waterfall-chart&gt;</h2>
        <p class="lede">Cascada para explicar cómo un saldo inicial llega a un saldo final.</p>
        <is-demo class="demo" style="height:16rem">
          <is-waterfall-chart>
            <script type="application/json">
              {
                "data": {
                  "labels": ["Saldo inicial", "Ventas", "Costos", "Impuestos", "Saldo final"],
                  "datasets": [{ "label": "Flujo", "data": [1200, 850, -420, -180, null], "totals": [0, 4] }]
                }
              }
            </script>
          </is-waterfall-chart>
        </is-demo>
      </section>
    </is-main>
    <aside class="sidebar" slot="end">
      <h1>is-waterfall-chart</h1>
      <is-scrollspy target="is-main"><a href="#intro">Introducción</a></is-scrollspy>
    </aside>
  </is-split-panel>

</body>
</html>
