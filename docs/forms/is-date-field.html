  <article class="docs-page" data-tag="is-date-field" data-category="forms">
    <h1>Date Field</h1>
    <section id="intro">
<p class="lede">Campo editable por secciones (DateField de MUI X). Cada sección es un spinbutton: flechas, dígitos, izquierda/derecha, Retroceso. El orden lo decide el locale.</p>
<div class="demo"><is-date-field id="df" label="Fecha" value="2026-07-30" locale="es" clearable></is-date-field>
          <is-date-field label="Date" value="2026-07-30" locale="en-US" clearable></is-date-field></div>
<div class="demo"><p class="lede" id="log" style="font-family:var(--is-mono);font-size:.85em"></p></div>
</section>
<section id="time">
<div class="demo"><is-time-field label="Hora 24 h" value="14:05" hour24 locale="es"></is-time-field>
          <is-time-field label="Time" value="14:05" ampm locale="en-US"></is-time-field>
          <is-time-field label="Con segundos" value="14:05:30" hour24 seconds locale="es"></is-time-field></div>
</section>
<section id="datetime">
<div class="demo"><is-date-time-field id="dtf" label="Fecha y hora" value="2026-07-30T09:30" locale="es" clearable></is-date-time-field></div>
</section>
<section id="validation">
<h2>Validación</h2>
<div class="demo"><is-date-field label="Requerido" required locale="es"></is-date-field>
          <is-date-field label="Min 2026-08-01" value="2026-07-15" min="2026-08-01" locale="es"></is-date-field>
          <is-date-field label="Solo lectura" value="2026-07-30" readonly locale="es"></is-date-field></div>
</section>
<section id="reference">
