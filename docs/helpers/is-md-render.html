<!DOCTYPE html>
<html lang="es" class="theme-dark" data-theme="dark" data-palette="contapyme">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Render Markdown · IS Web Components</title>
  <meta name="description" content="Documentación de is-md-render.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://jeff-aporta.github.io/is-webcomponents/docs/helpers/is-md-render.html">
  <link rel="stylesheet" href="../../src/styles/is-base.css">
  <link rel="stylesheet" href="../../src/styles/palettes.css">
  <link rel="stylesheet" href="../../src/styles/presentation.css">
  <script type="module" src="../../dist/cdn/loader.min.js"></script>
  <script type="module">
    const L = globalThis.ISWebComponentsLoader;
    L.configure({ preferSelf: true, mirrors: ['jsdelivr', 'pages'] });
    await L.load("is-md-editor", "is-md-render");
  </script>
</head>
<body>
  <article class="docs-page" data-tag="is-md-render" data-category="helpers">
    <h1>Render Markdown</h1>
    <section id="intro">
<p class="lede">Render inline de MD/HTML + chips <code class="code">{{variable}}</code>. Sin toolbar ni diálogo.</p>
<div class="demo"><is-md-render>
  <script type="text/markdown">
# Resumen

Eres un asistente en **español**.

- Usa `{{tono}}` como guía
- No inventes cifras

> Solo hechos verificables.
  </script>
</is-md-render></div>
</section>
<section id="editable">
<h2>Editable in-place</h2>
<p class="lede">Con <code class="code">can-edit</code>: contenteditable inline. <code class="code">is-change</code> al blur; <code class="code">is-persist</code> con Ctrl/Cmd+S.</p>
<div class="demo"><is-md-render can-edit placeholder="Escribe…">
  <script type="text/markdown">
Hola {{nombre}}, gracias por confiar en {{empresa}}.
  </script>
</is-md-render></div>
</section>
<section id="vs-editor">
<h2>vs </h2>
</section>
  </article>
</body>
</html>
