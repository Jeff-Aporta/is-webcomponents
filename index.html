<!DOCTYPE html>
<html lang="es" class="theme-dark" data-theme="dark" data-palette="contapyme">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IS Web Components</title>
  <meta name="description" content="Galería de Web Components ContaPyme / InSoft.">
  <meta name="author" content="Jeff-Aporta">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://jeff-aporta.github.io/is-webcomponents/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="IS Web Components">
  <meta property="og:locale" content="es_ES">
  <meta property="og:url" content="https://jeff-aporta.github.io/is-webcomponents/">
  <meta property="og:title" content="IS Web Components">
  <meta property="og:description" content="Galería de Web Components ContaPyme / InSoft.">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "IS Web Components",
    "applicationCategory": "DeveloperApplication",
    "operatingSystem": "Cualquiera con navegador moderno",
    "url": "https://jeff-aporta.github.io/is-webcomponents/",
    "description": "Galería de Web Components vanilla de InSoft (is-*): catálogo, previews y consumo por CDN.",
    "author": { "@type": "Person", "name": "Jeff-Aporta" },
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
  }
  </script>
  <script>
    /* Locale por defecto: sistema → es (misma regla que resolveLocale del kit). */
    (function () {
      var sys = (navigator.language || (navigator.languages && navigator.languages[0]) || '').trim();
      document.documentElement.lang = sys || 'es';
    })();
  </script>
  <!-- CSS estático: evita FOUC. El loader JS NO debe ser el primer paint de estilos. -->
  <style>
    /* Crítico mínimo antes de que lleguen los <link> (Live Server lento). */
    html.theme-dark, html.theme-dark body { background: #0f1520; color: #e7eef8; }
    html.theme-light, html.theme-light body { background: #f4f7fb; color: #142033; }
  </style>
  <link rel="stylesheet" href="src/styles/is-base.css">
  <link rel="stylesheet" href="src/styles/palettes.css">
  <link rel="stylesheet" href="src/styles/shell.css">
  <link rel="stylesheet" href="src/styles/presentation.css">
  <link rel="stylesheet" href="src/components/layout/preview-component.css">
  <style>
    /* Chrome del shell: no mostrar tags crudos mientras upgradan. */
    .shell-bar is-button:not(:defined),
    .shell-bar is-icon:not(:defined),
    .shell-bar is-theme-toggle:not(:defined) {
      visibility: hidden;
    }
  </style>
  <link rel="icon" href="dist/assets/favicon.svg" type="image/svg+xml">
  <script src="scripts/preview-boot.js"></script>
  <script type="module">
    import { ISWebComponentsLoader as L } from './dist/cdn/core/loader.min.js';
    // Galería local: self (dist/cdn) primero; espejos CDN como fallback.
    L.configure({ preferSelf: true, mirrors: ['jsdelivr', 'pages'] });

    // Shell mínimo (tags puntuales). Evita:
    //  - loadCSS* vía JS → FOUC blanco (CSS ya está en <link>)
    //  - await load('all') → 6–10s de tags crudos
    //  - await page modules (cdn-panel/md-editor) en el path crítico
    // preview-component NO está en el catálogo → dist/cdn directo (no src/).
    try {
      await Promise.all([
        L.load(
          'is-split-panel',
          'is-main',
          'is-drawer',
          'is-demo',
          'is-scrollspy',
          'is-button',
          'is-icon',
          'is-theme-toggle',
          'is-code',
        ),
        import('./dist/cdn/layout/preview-component.min.js'),
      ]);
      document.documentElement.dataset.kitShell = '1';
      window.dispatchEvent(new Event('is-gallery-shell-ready'));
    } catch (err) {
      console.error('[gallery] shell boot', err);
    }

    // Chrome de docs + categorías útiles + resto del kit: no bloquean paint.
    L.loadPageModules([
      'scripts/highlight-pre.js',
      'scripts/demo-code.js',
      'scripts/docs-chrome.js',
      'scripts/cdn-panel.js',
      'scripts/view-sources.js',
      'scripts/demo-file-meta.js',
    ]).catch((err) => console.warn('[gallery] page modules', err));
  </script>
</head>
<body>
  <header class="shell-bar">
    <is-button class="shell-menu-btn" id="navToggle" color="neutral" variant="plain" pill type="button"
            aria-expanded="false" aria-controls="navDrawer"
            aria-label="Abrir el catálogo de componentes" title="Catálogo de componentes" hidden>
      <is-icon slot="start" icon="mdi:menu"></is-icon>
    </is-button>

    <div class="brand-wrap" id="brandWrap">
      <button type="button" class="brand" id="brand" aria-haspopup="listbox" aria-expanded="false" aria-controls="brandMenu" aria-label="ContaPyme — elegir paleta" title="Elegir paleta">
        <span id="brandLead">conta</span><span class="brand__accent" id="brandAccent">pyme</span><span id="brandTail"></span>
      </button>
      <ul class="brand-menu" id="brandMenu" role="listbox" hidden aria-label="Paleta de marca">
        <li role="option" tabindex="-1" data-palette="contapyme" aria-selected="true">
          <span class="brand-menu__swatch" aria-hidden="true"></span>
          <span class="brand-menu__label">ContaPyme</span>
          <is-icon class="brand-menu__check" icon="mdi:check" aria-hidden="true"></is-icon>
        </li>
        <li role="option" tabindex="-1" data-palette="insoft" aria-selected="false">
          <span class="brand-menu__swatch" aria-hidden="true"></span>
          <span class="brand-menu__label">InSoft</span>
          <is-icon class="brand-menu__check" icon="mdi:check" aria-hidden="true"></is-icon>
        </li>
        <li role="option" tabindex="-1" data-palette="agrowin" aria-selected="false">
          <span class="brand-menu__swatch" aria-hidden="true"></span>
          <span class="brand-menu__label">AgroWin</span>
          <is-icon class="brand-menu__check" icon="mdi:check" aria-hidden="true"></is-icon>
        </li>
      </ul>
    </div>

    <is-button class="shell-icon-btn" id="fullscreenBtn" color="neutral" variant="plain" pill type="button" aria-label="Abrir preview en pantalla completa" title="Abrir preview en pantalla completa">
      <is-icon slot="start" icon="mdi:open-in-new"></is-icon>
    </is-button>

    <is-theme-toggle id="themeToggle" dark="true"></is-theme-toggle>
  </header>

  <is-split-panel id="mainSplit" class="main-split" orientation="horizontal" position-in-pixels="200" primary="start" storage-key="gallery-nav">
    <nav class="shell-nav" slot="start" id="shellNav" aria-label="Componentes"></nav>
    <div class="preview-stage" slot="end">
      <is-preview-component class="preview-host" id="previewHost" hidden></is-preview-component>
      <iframe class="preview-frame" id="previewFrame" title="Vista del componente"></iframe>
    </div>
  </is-split-panel>

  <!-- En pantallas pequeñas el nav se muda aquí (ver syncNavLayout). -->
  <is-drawer id="navDrawer" class="shell-nav-drawer" placement="start" light-dismiss
             label="Componentes"></is-drawer>

  <script type="module">
    import components from './src/manifest.js';
    import { hasControlledPreview, hasCachedPreview, loadPreview } from './src/previews/registry.ts';
    import { collectIsTags, GALLERY_CHROME_TAGS } from './src/cdn/collect-is-tags.ts';

    const root = document.documentElement;
    const themeToggle = document.getElementById('themeToggle');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const shellNav = document.getElementById('shellNav');
    const frame = document.getElementById('previewFrame');
    const previewHost = document.getElementById('previewHost');
    const brand = document.getElementById('brand');
    const brandMenu = document.getElementById('brandMenu');
    const brandWrap = document.getElementById('brandWrap');
    const brandLead = document.getElementById('brandLead');
    const brandAccent = document.getElementById('brandAccent');
    const brandTail = document.getElementById('brandTail');
    const params = new URLSearchParams(location.search);
    const themes = new Set(['light', 'dark']);
    const palettes = new Set(['contapyme', 'insoft', 'agrowin']);
    const brands = {
      contapyme: { lead: 'conta', accent: 'pyme', tail: '',    label: 'ContaPyme', leadColor: '#000', accentColor: '#fff'    },
      // El logo de InSoft lleva la S en mayuscula y en rojo: in + Soft.
      insoft:    { lead: 'in',    accent: 'Soft', tail: '',    label: 'InSoft',    leadColor: '#000', accentColor: '#d71920' },
      agrowin:   { lead: 'agro',  accent: 'win',  tail: '',    label: 'AgroWin',   leadColor: '#000', accentColor: '#fff'    }
    };

    const setMenuOpen = (open) => {
      brand.setAttribute('aria-expanded', open ? 'true' : 'false');
      brandMenu.hidden = !open;
      brandWrap.classList.toggle('is-open', open);
    };

    // --- b64url helpers (inline; pattern from isa-patyia-paws router.ts) ---
    const b64urlEncode = (input) => {
      const bytes = new TextEncoder().encode(input);
      let bin = '';
      bytes.forEach((b) => { bin += String.fromCharCode(b); });
      return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    };
    const b64urlDecode = (input) => {
      let pad = String(input).replace(/-/g, '+').replace(/_/g, '/');
      while (pad.length % 4) pad += '=';
      const bin = atob(pad);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return new TextDecoder().decode(bytes);
    };

    const readStateParam = () => {
      const raw = params.get('s');
      if (!raw) return null;
      try { return JSON.parse(b64urlDecode(raw)); } catch { return null; }
    };

    // --- home + catalog (home no está en manifest) ---
    const HOME = { tag: 'home', title: 'Home', page: 'home.json' };
    // Igual que Inicio, no es un componente del catálogo sino una página
    // suelta en previews/ raíz: el taller para armarse una paleta propia.
    const THEMING = { tag: 'theming', title: 'Personalización', page: 'theming.json' };
    const ECOSYSTEM = { tag: 'ecosystem', title: 'Ecosistema JS', page: 'ecosystem.json' };
    const catalog = [HOME, THEMING, ECOSYSTEM, ...components];

    // --- build nav (Home + agrupado por categoría) ---
    // Sin filtro: el nav lista el catálogo completo del manifest.
    const navSkip = new Set();
    const categoryMeta = {
      // El orden de estas claves ES el orden del nav (categoryOrder las lee
      // con Object.keys), así que isp va al final a propósito: son las
      // primitivas portadas, no el catálogo propio.
      actions: { id: 'actions', label: 'Acciones' },
      media: { id: 'media', label: 'Media' },
      feedback: { id: 'feedback', label: 'Feedback' },
      layout: { id: 'layout', label: 'Layout' },
      navigation: { id: 'navigation', label: 'Navegación' },
      forms: { id: 'forms', label: 'Formularios' },
      code: { id: 'code', label: 'Código' },
      data: { id: 'data', label: 'Datos' },
      'data-viz': { id: 'data-viz', label: 'Gráficos' },
      diagrams: { id: 'diagrams', label: 'Diagramas' },
      overlays: { id: 'overlays', label: 'Overlays' },
      helpers: { id: 'helpers', label: 'Utilerías' },
      isp: { id: 'isp', label: 'ISP-SvelteComponents' },
    };
    const categoryOrder = Object.keys(categoryMeta);

    {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'shell-nav__item shell-nav__item--home';
      btn.dataset.tag = HOME.tag;
      btn.setAttribute('aria-label', 'Inicio — home');
      // El item "Inicio" del home reusa el styling de los items regulares
      // (vertical title, mismo highlight en aria-current) y deja solo el
      // titulo "Inicio" — sin `<home>` tag, porque la pagina inicial no
      // es un componente del catalogo, es un atajo a la portada.
      const title = document.createElement('span');
      title.className = 'shell-nav__title';
      title.textContent = 'Inicio';
      btn.append(title);
      btn.addEventListener('click', () => selectComponent(HOME.tag));
      shellNav.appendChild(btn);
    }

    {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'shell-nav__item shell-nav__item--home';
      btn.dataset.tag = THEMING.tag;
      btn.setAttribute('aria-label', 'Personalización — theming');
      const title = document.createElement('span');
      title.className = 'shell-nav__title';
      title.textContent = THEMING.title;
      btn.append(title);
      btn.addEventListener('click', () => selectComponent(THEMING.tag));
      shellNav.appendChild(btn);
    }

    {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'shell-nav__item shell-nav__item--home';
      btn.dataset.tag = ECOSYSTEM.tag;
      btn.setAttribute('aria-label', 'Ecosistema JS — utilidades compartidas');
      const title = document.createElement('span');
      title.className = 'shell-nav__title';
      title.textContent = ECOSYSTEM.title;
      btn.append(title);
      btn.addEventListener('click', () => selectComponent(ECOSYSTEM.tag));
      shellNav.appendChild(btn);
    }

    const navItems = components.filter((c) => !navSkip.has(c.tag) && c.page);
    const byCategory = new Map();
    for (const c of navItems) {
      const key = categoryMeta[c.category] ? c.category : 'helpers';
      if (!byCategory.has(key)) byCategory.set(key, []);
      byCategory.get(key).push(c);
    }
    for (const list of byCategory.values()) {
      list.sort((a, b) => a.title.localeCompare(b.title, 'es', { sensitivity: 'base' }));
    }
    for (const key of categoryOrder) {
      const list = byCategory.get(key);
      if (!list?.length) continue;
      const meta = categoryMeta[key];
      const group = document.createElement('div');
      group.className = 'shell-nav__group';
      group.setAttribute('role', 'group');
      group.setAttribute('aria-labelledby', `nav-cat-${meta.id}`);

      const heading = document.createElement('div');
      heading.className = 'shell-nav__heading';
      heading.id = `nav-cat-${meta.id}`;
      heading.textContent = meta.label;
      group.appendChild(heading);

      for (const component of list) {
        const item = document.createElement('button');
        item.type = 'button';
        item.className = 'shell-nav__item';
        item.dataset.tag = component.tag;
        item.setAttribute('aria-label', `${component.title} ${component.tag}`);
        const title = document.createElement('span');
        title.className = 'shell-nav__title';
        // Dot sutil: origen ISP-SvelteComponents (aunque viva en otra categoría).
        if (component.origin === 'isp' || component.category === 'isp') {
          const dot = document.createElement('span');
          dot.className = 'shell-nav__isp-dot';
          dot.setAttribute('aria-hidden', 'true');
          dot.title = 'Origen ISP-SvelteComponents';
          title.append(dot, document.createTextNode(component.title));
        } else {
          title.textContent = component.title;
        }
        const tag = document.createElement('span');
        tag.className = 'shell-nav__tag';
        tag.textContent = `<${component.tag}>`;
        item.append(title, tag);
        item.addEventListener('click', () => selectComponent(component.tag));
        group.appendChild(item);
      }
      shellNav.appendChild(group);
    }

    // --- initial state ---
    const stateFromUrl = readStateParam();
    let theme = themes.has(stateFromUrl?.theme)
      ? stateFromUrl.theme
      : (themes.has(localStorage.getItem('is-theme')) ? localStorage.getItem('is-theme') : 'dark');
    let palette = palettes.has(stateFromUrl?.palette)
      ? stateFromUrl.palette
      : (palettes.has(localStorage.getItem('is-palette')) ? localStorage.getItem('is-palette') : 'contapyme');
    let component = catalog.find(item => item.tag === (stateFromUrl && stateFromUrl.component)) ?? HOME;

    function encodeState(obj) {
      return b64urlEncode(JSON.stringify(obj));
    }

    /** Preview URL legado (solo si faltara en catalog — no debería ocurrir). */
    function previewSrc(page) {
      return `src/previews/${page}?s=${encodeState({ embed: true, theme, palette })}`;
    }

    function controlledShellSrc(tag) {
      return `src/previews/_shell.html?tag=${encodeURIComponent(tag)}&s=${encodeState({ embed: true, theme, palette })}`;
    }

    /**
     * Asigna `.preview` al host ya upgraded. Importante: el módulo del body
     * puede correr mientras el `<head>` aún carga el shell (TLA no bloquea
     * siblings). Si asignamos antes del upgrade, queda una own property que
     * tapa el setter de `<is-preview-component>` y el main nunca se pinta.
     */
    function setHostPreview(value) {
      if (Object.prototype.hasOwnProperty.call(previewHost, 'preview')) {
        delete previewHost.preview;
      }
      previewHost.preview = value;
    }

    /**
     * Tags del preview + chrome de demos (dropdown/copy/code/cdn-snippet…).
     * Sin all.min.js: cada vista pide solo lo que pinta.
     */
    async function ensurePreviewDeps(tag, preview) {
      await customElements.whenDefined('is-preview-component');
      const L = globalThis.ISWebComponentsLoader;
      if (!L) return;
      const tags = [...new Set([...GALLERY_CHROME_TAGS, ...collectIsTags(preview.definition ?? preview)])];
      if (tags.length) await L.load(...tags);
      if (tag.startsWith('is-') && !customElements.get(tag)) {
        await customElements.whenDefined(tag);
      }
    }

    async function showPreview() {
      const tag = component.tag;

      if (hasControlledPreview(tag)) {
        frame.hidden = true;
        frame.removeAttribute('src');
        previewHost.hidden = false;
        if (!hasCachedPreview(tag)) setHostPreview(null);
        const preview = await loadPreview(tag);
        if (component.tag !== tag) return;
        await ensurePreviewDeps(tag, preview);
        await customElements.whenDefined('is-preview-component');
        setHostPreview(preview);
        return;
      }

      console.warn(`[gallery] sin JSON de preview para ${tag}`);
      previewHost.hidden = true;
      if (customElements.get('is-preview-component')) setHostPreview(null);
      else if (Object.prototype.hasOwnProperty.call(previewHost, 'preview')) {
        delete previewHost.preview;
      }
      frame.hidden = false;
      frame.removeAttribute('src');
    }

    function sendContext() {
      if (!frame.hidden) {
        frame.contentWindow?.postMessage({ type: 'is-context', theme, palette }, location.origin);
      }
    }

    function updateUrl() {
      // Gallery: `?s=` es el único state URL. theme/palette no van en la URL live;
      // sí se conservan otras keys de nav (docs, cdnTab, …) escritas por url-nav.
      const prev = readStateParam() || {};
      const next = { ...prev, component: component.tag };
      delete next.theme;
      delete next.palette;
      delete next.embed;
      const encoded = encodeState(next);
      const dest = new URL(location.href);
      dest.search = '?s=' + encoded;
      history.replaceState(null, '', dest);
    }

    function renderContext({ navSmooth = false } = {}) {
      root.classList.toggle('theme-light', theme === 'light');
      root.classList.toggle('theme-dark', theme === 'dark');
      root.dataset.theme = theme;
      root.dataset.palette = palette;
      themeToggle.dark = theme === 'dark';
      for (const node of shellNav.querySelectorAll('.shell-nav__item')) {
        node.setAttribute('aria-current', node.dataset.tag === component.tag ? 'true' : 'false');
      }
      scheduleScrollNavToCurrent({ smooth: navSmooth });
      for (const opt of brandMenu.querySelectorAll('[role="option"]')) {
        opt.setAttribute('aria-selected', opt.dataset.palette === palette ? 'true' : 'false');
      }
      const brandData = brands[palette];
      brandLead.textContent = brandData.lead;
      brandTail.textContent = brandData.tail || '';
      brandTail.style.color = brandData.leadColor;
      brandAccent.textContent = brandData.accent;
      brandLead.style.color = brandData.leadColor;
      brandAccent.style.color = brandData.accentColor;
      brand.setAttribute('aria-label', `${brandData.label} — elegir paleta`);
      document.title = `${component.title} | ${brandData.label}`;
      localStorage.setItem('is-theme', theme);
      localStorage.setItem('is-palette', palette);
      updateUrl();
      sendContext();
    }

    /** Centra el ítem activo en el viewport del nav (sin scrollear la página). */
    function scrollNavToCurrent({ smooth = false } = {}) {
      const current = shellNav.querySelector('.shell-nav__item[aria-current="true"]');
      if (!current) return;
      // Esperar a que el panel tenga tamaño (tras F5 el split aún no midió).
      if (shellNav.clientHeight < 8 && shellNav.clientWidth < 8) return;

      const horizontal = getComputedStyle(shellNav).flexDirection === 'row';
      const behavior = smooth ? 'smooth' : 'auto';
      if (horizontal) {
        const delta =
          current.getBoundingClientRect().left -
          shellNav.getBoundingClientRect().left -
          (shellNav.clientWidth - current.offsetWidth) / 2;
        shellNav.scrollTo({ left: shellNav.scrollLeft + delta, behavior });
      } else {
        const delta =
          current.getBoundingClientRect().top -
          shellNav.getBoundingClientRect().top -
          (shellNav.clientHeight - current.offsetHeight) / 2;
        shellNav.scrollTo({ top: shellNav.scrollTop + delta, behavior });
      }
    }

    let scrollNavRaf = 0;
    /** Reintenta tras el próximo layout (F5 / split / resize). */
    function scheduleScrollNavToCurrent(opts = {}) {
      const run = () => scrollNavToCurrent(opts);
      run();
      cancelAnimationFrame(scrollNavRaf);
      scrollNavRaf = requestAnimationFrame(() => {
        run();
        requestAnimationFrame(run);
      });
    }

    /** Extra passes tras boot — el split restaura tamaño async desde storage. */
    function bootScrollNavToCurrent() {
      scheduleScrollNavToCurrent();
      setTimeout(() => scrollNavToCurrent(), 0);
      setTimeout(() => scrollNavToCurrent(), 100);
      setTimeout(() => scrollNavToCurrent(), 300);
    }

    function selectComponent(tag) {
      const next = catalog.find(item => item.tag === tag) ?? HOME;
      // Elegir componente cierra el catálogo: en compacto tapa el contenido.
      document.getElementById('navDrawer')?.hide?.();
      if (next === component) return;
      component = next;
      showPreview();
      renderContext({ navSmooth: true });
    }

    window.addEventListener('message', (e) => {
      if (e.origin !== location.origin) return;
      if (e.data?.type === 'is-select' && typeof e.data.tag === 'string') {
        selectComponent(e.data.tag);
      }
    });

    frame.addEventListener('load', () => {
      sendContext();
      // clic dentro del iframe no burbujea al parent → cerrar menú ahí
      try {
        frame.contentDocument?.addEventListener('pointerdown', () => setMenuOpen(false), { capture: true });
      } catch { /* cross-origin */ }
    });
    brand.addEventListener('click', (e) => {
      e.stopPropagation();
      setMenuOpen(brandMenu.hidden);
    });
    brandMenu.addEventListener('click', (e) => {
      const opt = e.target.closest('[data-palette]');
      if (!opt) return;
      palette = opt.dataset.palette;
      if (!palettes.has(palette)) palette = 'contapyme';
      setMenuOpen(false);
      renderContext();
    });
    document.addEventListener('pointerdown', (e) => {
      if (!brandWrap.contains(e.target)) setMenuOpen(false);
    }, true);
    // focus al iframe (o blur de la ventana) también cierra
    window.addEventListener('blur', () => {
      queueMicrotask(() => {
        if (document.activeElement === frame) setMenuOpen(false);
      });
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') setMenuOpen(false);
    });
    themeToggle.addEventListener('is-theme-change', (e) => {
      // El toggle ya cambió el contenedor (html); sincronizar estado de la galería
      theme = e.detail?.theme === 'light' ? 'light' : 'dark';
      renderContext();
    });
    fullscreenBtn.addEventListener('click', () => {
      const url = controlledShellSrc(component.tag);
      window.open(url, '_blank', 'noopener');
    });

    showPreview();
    renderContext();
    bootScrollNavToCurrent();

    // --- split-panel nav: clamp + persist vía storage-key="gallery-nav" ---
    const mainSplit = document.getElementById('mainSplit');
    const NAV_MIN = 140;
    const NAV_MAX = 280;
    const clampNav = (n) => Math.min(NAV_MAX, Math.max(NAV_MIN, Math.round(n)));
    mainSplit?.addEventListener('reposition', () => {
      const px = clampNav(mainSplit.positionInPixels);
      if (px !== Math.round(mainSplit.positionInPixels)) mainSplit.positionInPixels = px;
      scheduleScrollNavToCurrent();
    });

    customElements.whenDefined('is-split-panel').then(() => bootScrollNavToCurrent());
    window.addEventListener('load', () => bootScrollNavToCurrent());
    if (typeof ResizeObserver !== 'undefined') {
      let roT = 0;
      new ResizeObserver(() => {
        clearTimeout(roT);
        roT = setTimeout(() => scrollNavToCurrent(), 40);
      }).observe(shellNav);
    }

    // --- mobile: el catálogo se muda a un drawer izquierdo ---
    const navDrawer = document.getElementById('navDrawer');
    const navToggle = document.getElementById('navToggle');
    const compactNav = window.matchMedia('(max-width: 640px)');

    const syncNavLayout = () => {
      if (!mainSplit || !navDrawer || !navToggle) return;
      const compact = compactNav.matches;
      navToggle.hidden = !compact;
      document.body.dataset.navLayout = compact ? 'drawer' : 'split';

      if (compact) {
        if (shellNav.parentElement !== navDrawer) {
          // Dentro del drawer no hay slot "start" al que engancharse.
          shellNav.removeAttribute('slot');
          navDrawer.append(shellNav);
        }
        mainSplit.setAttribute('collapse', 'start');
      } else {
        if (shellNav.parentElement !== mainSplit) {
          navDrawer.hide?.();
          shellNav.setAttribute('slot', 'start');
          mainSplit.prepend(shellNav);
        }
        mainSplit.removeAttribute('collapse');
      }
      scheduleScrollNavToCurrent();
    };

    compactNav.addEventListener?.('change', syncNavLayout);
    navToggle?.addEventListener('click', () => navDrawer.show?.());
    navDrawer?.addEventListener('is-show', () => {
      navToggle.setAttribute('aria-expanded', 'true');
      // El nav acaba de ganar tamaño: centrar el ítem activo.
      scheduleScrollNavToCurrent();
    });
    navDrawer?.addEventListener('is-after-show', () => scrollNavToCurrent());
    navDrawer?.addEventListener('is-after-hide', () => {
      navToggle.setAttribute('aria-expanded', 'false');
    });
    syncNavLayout();
  </script>
</body>
</html>
