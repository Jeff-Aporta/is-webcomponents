<!DOCTYPE html>
<html lang="es" class="theme-dark" data-theme="dark" data-palette="contapyme">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IS Web Components</title>
  <meta name="description" content="Galería de Web Components ContaPyme / InSoft.">
  <meta name="author" content="Jeff-Aporta">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://jeff-aporta.github.io/is-webcomponents/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="IS Web Components">
  <meta property="og:locale" content="es_ES">
  <meta property="og:url" content="https://jeff-aporta.github.io/is-webcomponents/">
  <meta property="og:title" content="IS Web Components">
  <meta property="og:description" content="Galería de Web Components ContaPyme / InSoft.">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "IS Web Components",
    "applicationCategory": "DeveloperApplication",
    "operatingSystem": "Cualquiera con navegador moderno",
    "url": "https://jeff-aporta.github.io/is-webcomponents/",
    "description": "Galería de Web Components vanilla de InSoft (is-*): catálogo, previews y consumo por CDN.",
    "author": { "@type": "Person", "name": "Jeff-Aporta" },
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
  }
  </script>
  <script>
    /* Locale por defecto: sistema → es (misma regla que resolveLocale del kit). */
    (function () {
      var sys = (navigator.language || (navigator.languages && navigator.languages[0]) || '').trim();
      document.documentElement.lang = sys || 'es';
    })();
  </script>
  <!-- CSS estático: evita FOUC. El loader JS NO debe ser el primer paint de estilos. -->
  <style>
    /* Crítico mínimo antes de que lleguen los <link> (Live Server lento). */
    html.theme-dark, html.theme-dark body { background: #0f1520; color: #e7eef8; }
    html.theme-light, html.theme-light body { background: #f4f7fb; color: #142033; }
  </style>
  <!-- Kit: siempre dist/cdn (transpilado). Shell de galería: CSS local. -->
  <link rel="stylesheet" href="dist/cdn/is-base.min.css">
  <link rel="stylesheet" href="dist/cdn/palettes.min.css">
  <link rel="stylesheet" href="src/styles/shell.css">
  <link rel="stylesheet" href="src/styles/presentation.css">
  <link rel="stylesheet" href="dist/cdn/preview/preview-component.min.css">
  <style>
    /* Chrome del shell: no mostrar tags crudos mientras upgradan. */
    .shell-bar is-button:not(:defined),
    .shell-bar is-icon:not(:defined),
    .shell-bar is-theme-toggle:not(:defined) {
      visibility: hidden;
    }
  </style>
  <link rel="icon" href="dist/assets/favicon.svg" type="image/svg+xml">
  <script src="scripts/preview-boot.js"></script>
  <script type="module">
    import { ISWebComponentsLoader as L } from './dist/cdn/core/loader.min.js';
    // Galería local: self (dist/cdn) primero; espejos CDN como fallback.
    L.configure({ preferSelf: true, mirrors: ['jsdelivr', 'pages'] });

    // Shell mínimo (tags puntuales). Evita:
    //  - loadCSS* vía JS → FOUC blanco (CSS ya está en <link>)
    //  - await load('all') → 6–10s de tags crudos
    //  - await page modules (cdn-panel/md-editor) en el path crítico
    // preview-component NO está en el catálogo → dist/cdn directo (no src/).
    try {
      await Promise.all([
        L.load(
          'is-split-panel',
          'is-main',
          'is-drawer',
          'is-demo',
          'is-scrollspy',
          'is-button',
          'is-icon',
          'is-theme-toggle',
          'is-code',
        ),
        import('./dist/cdn/preview/preview-component.min.js'),
      ]);
      document.documentElement.dataset.kitShell = '1';
      window.dispatchEvent(new Event('is-gallery-shell-ready'));
    } catch (err) {
      console.error('[gallery] shell boot', err);
    }

    // Chrome de docs + categorías útiles + resto del kit: no bloquean paint.
    L.loadPageModules([
      'scripts/highlight-pre.js',
      'scripts/demo-code.js',
      'scripts/docs-chrome.js',
      'scripts/cdn-panel.js',
      'scripts/view-sources.js',
      'scripts/demo-file-meta.js',
    ]).catch((err) => console.warn('[gallery] page modules', err));
  </script>
</head>
<body>
  <header class="shell-bar">
    <is-button class="shell-menu-btn" id="navToggle" color="neutral" variant="plain" pill type="button"
            aria-expanded="false" aria-controls="navDrawer"
            aria-label="Abrir el catálogo de componentes" title="Catálogo de componentes" hidden>
      <is-icon slot="start" icon="mdi:menu"></is-icon>
    </is-button>

    <div class="brand-wrap" id="brandWrap">
      <button type="button" class="brand" id="brand" aria-haspopup="listbox" aria-expanded="false" aria-controls="brandMenu" aria-label="ContaPyme — elegir paleta" title="Elegir paleta">
        <span id="brandLead">conta</span><span class="brand__accent" id="brandAccent">pyme</span><span id="brandTail"></span>
      </button>
      <ul class="brand-menu" id="brandMenu" role="listbox" hidden aria-label="Paleta de marca">
        <li role="option" tabindex="-1" data-palette="contapyme" aria-selected="true">
          <span class="brand-menu__swatch" aria-hidden="true"></span>
          <span class="brand-menu__label">ContaPyme</span>
          <is-icon class="brand-menu__check" icon="mdi:check" aria-hidden="true"></is-icon>
        </li>
        <li role="option" tabindex="-1" data-palette="insoft" aria-selected="false">
          <span class="brand-menu__swatch" aria-hidden="true"></span>
          <span class="brand-menu__label">InSoft</span>
          <is-icon class="brand-menu__check" icon="mdi:check" aria-hidden="true"></is-icon>
        </li>
        <li role="option" tabindex="-1" data-palette="agrowin" aria-selected="false">
          <span class="brand-menu__swatch" aria-hidden="true"></span>
          <span class="brand-menu__label">AgroWin</span>
          <is-icon class="brand-menu__check" icon="mdi:check" aria-hidden="true"></is-icon>
        </li>
      </ul>
    </div>

    <is-button class="shell-icon-btn" id="fullscreenBtn" color="neutral" variant="plain" pill type="button" aria-label="Abrir preview en pantalla completa" title="Abrir preview en pantalla completa">
      <is-icon slot="start" icon="mdi:open-in-new"></is-icon>
    </is-button>

    <is-theme-toggle id="themeToggle" dark="true"></is-theme-toggle>
  </header>

  <is-split-panel id="mainSplit" class="main-split" orientation="horizontal" position-in-pixels="200" primary="start" storage-key="gallery-nav">
    <nav class="shell-nav" slot="start" id="shellNav" aria-label="Componentes"></nav>
    <div class="preview-stage" slot="end">
      <is-preview-component class="preview-host" id="previewHost" hidden></is-preview-component>
      <iframe class="preview-frame" id="previewFrame" title="Vista del componente"></iframe>
    </div>
  </is-split-panel>

  <!-- En pantallas pequeñas el nav se muda aquí (ver syncNavLayout). -->
  <is-drawer id="navDrawer" class="shell-nav-drawer" placement="start" light-dismiss
             label="Componentes"></is-drawer>

  <!-- Gallery SPA: dist/gallery-app.min.js (from src/gallery/app.ts). -->
  <script type="module" src="./dist/gallery-app.min.js"></script>
</body>
</html>
