<!DOCTYPE html>
<html lang="es" data-theme="dark" data-palette="contapyme">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ISWC</title>
  <meta name="description" content="Galería de Web Components open source (iswc-*).">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://jeff-aporta.github.io/is-webcomponents/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ISWC">
  <meta property="og:locale" content="es_ES">
  <meta property="og:url" content="https://jeff-aporta.github.io/is-webcomponents/">
  <meta property="og:title" content="ISWC">
  <meta property="og:description" content="Galería de Web Components open source (iswc-*).">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "ISWC",
    "applicationCategory": "DeveloperApplication",
    "operatingSystem": "Cualquiera con navegador moderno",
    "url": "https://jeff-aporta.github.io/is-webcomponents/",
    "description": "Galería de Web Components vanilla open source (iswc-*): catálogo, previews y consumo por CDN o local."
  }
  </script>
  <link rel="icon" href="dist/assets/favicon.svg" type="image/svg+xml">
  <script type="module">
    import { ISWebComponentsLoader as L } from './dist/cdn/core/loader.min.js?h=tg6647';
    // Alias en fuente; register por si el dist aún no lo trae.
    if (!L.getPageModules()['iswc-gallery-app']) {
      L.registerPageModule('iswc-gallery-app', 'dist/gallery-app.min.js');
    }
    // Host (boot + iswc-doc-demo) → SPA. Sin ?h= quemado: el loader enruta.
    await L.loadPageModules(['iswc-doc-demo-host']);
    await L.loadPageModules(['iswc-gallery-app']);
  </script>
</head>
<body>
  <iswc-doc-demo
    brand="ISWC"
    brand-icon="mdi:apps-box"
    brand-href="./"
    local
    dev
    sheets-cache="iswc-gallery-sheets"
    storage-key-nav="gallery-nav"
    palette-storage-key="iswc-palette"
  ></iswc-doc-demo>
</body>
</html>
