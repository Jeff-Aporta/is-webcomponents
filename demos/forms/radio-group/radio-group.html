<!doctype html>
<html lang="es" class="theme-dark" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Demo de <iswc-radio-group> · iswc-root</title>
<meta name="description" content="Grupo form-associated de radios con orientación, required, error, label y navegación con flechas." />
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #0c1118; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { display: grid; place-items: start center; padding: 32px 20px; }
  main { max-width: 760px; width: 100%; display: grid; gap: 18px; }
  header h1 { font-size: 18px; font-weight: 700; margin: 0 0 4px; }
  header p { font-size: 13px; color: #94a3b8; margin: 0; }
  section { background: #131a24; border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 16px; display: grid; gap: 10px; }
  section h2 { font-size: 13px; margin: 0; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.04em; }
  button { font: inherit; padding: 6px 12px; background: #1f2937; color: #e2e8f0; border: 1px solid rgba(255,255,255,0.16); border-radius: 6px; cursor: pointer; }
  code { background: rgba(255,255,255,0.06); padding: 1px 5px; border-radius: 3px; font: 12px ui-monospace, Menlo, Consolas, monospace; }
  output { font: 12px ui-monospace, Menlo, Consolas, monospace; color: #94a3b8; white-space: pre-wrap; }
  /* Anti-FOUC */
  iswc-radio-group:not(:defined) { visibility: hidden; }
  iswc-radio:not(:defined) { visibility: hidden; }
</style>
<script type="module">
  // El bundle del grupo importa automáticamente <iswc-radio>.
  await import('../../../dist/cdn/forms/radio-group.min.js?h=09c4wu');

  await customElements.whenDefined('iswc-radio-group');

  const group = document.getElementById('group');
  const out = document.getElementById('out');

  const render = () => {
    out.textContent = JSON.stringify({
      value: group.value,
      required: group.required,
      disabled: group.disabled,
      readonly: group.readonly,
      orientation: group.orientation,
      radios: group.radios.map((r) => ({
        value: r.value,
        checked: r.checked,
        disabled: r.disabled,
        tabindex: r.getAttribute('tabindex'),
      })),
    }, null, 2);
  };
  group.addEventListener('iswc-change', (e) => {
    console.log('[radio-group] change', e.detail);
    render();
  });

  document.getElementById('btn-set').addEventListener('click', () => {
    group.value = 'dos';
    render();
  });
  document.getElementById('btn-clear').addEventListener('click', () => {
    group.value = '';
    render();
  });

  render();
  document.documentElement.dataset.radioGroupReady = '1';
</script>
</head>
<body>
<main>
  <header>
    <h1>Demo de <code>&lt;iswc-radio-group&gt;</code></h1>
    <p>Grupo form-associated de radios. Dueño del valor: el grupo. Navega con flechas o Home/End; activa con Espacio.</p>
  </header>

  <section>
    <h2>Básico (vertical)</h2>
    <iswc-radio-group id="group" name="answer" label="Elige una opción" hint="Usa las flechas para navegar" value="uno" required>
      <iswc-radio title="Uno" value="uno">Uno</iswc-radio>
      <iswc-radio title="Dos" value="dos">Dos</iswc-radio>
      <iswc-radio title="Tres" value="tres">Tres</iswc-radio>
      <iswc-radio title="Cuatro (deshabilitado)" value="cuatro" disabled>Cuatro (deshabilitado)</iswc-radio>
    </iswc-radio-group>
    <div>
      <button title="Set &quot;dos&quot;" id="btn-set" type="button">Set "dos"</button>
      <button title="Clear" id="btn-clear" type="button">Clear</button>
    </div>
    <output id="out"></output>
  </section>

  <section>
    <h2>Horizontal</h2>
    <iswc-radio-group id="group-h" name="orientation" label="Orientación" value="h">
      <iswc-radio title="Vertical" value="v">Vertical</iswc-radio>
      <iswc-radio title="Horizontal" value="h">Horizontal</iswc-radio>
      <iswc-radio title="Both" value="b">Both</iswc-radio>
    </iswc-radio-group>
  </section>

  <section>
    <h2>Con error</h2>
    <iswc-radio-group id="group-err" name="confirm" label="¿Confirmas?" error error-text="Debes elegir una opción" required>
      <iswc-radio title="Sí" value="yes">Sí</iswc-radio>
      <iswc-radio title="No" value="no">No</iswc-radio>
    </iswc-radio-group>
  </section>

  <section>
    <h2>Disabled</h2>
    <iswc-radio-group id="group-dis" name="disabled" label="Grupo deshabilitado" disabled value="a">
      <iswc-radio title="A" value="a">A</iswc-radio>
      <iswc-radio title="B" value="b">B</iswc-radio>
    </iswc-radio-group>
  </section>
</main>
<script>
/* iswc-auto-rereload v2: backoff — polling client agnóstico del static server
 * W17: backoff exponencial + readyState wait + giveup tras MAX_FAILS fallos
 * consecutivos. Evita el loop infinito de reload-pin que vimos con Live
 * Server 5505 cuando el endpoint no responde. */
(function () {
  var tries = [
    'dist/cdn/reload-pin',
    '../dist/cdn/reload-pin',
    '../../dist/cdn/reload-pin',
    '../../../dist/cdn/reload-pin',
    '../../../../dist/cdn/reload-pin'
  ];
  var pinUrl = null;
  var last = null;
  var interval = 1500;          // arranca en 1.5s
  var MAX_INTERVAL = 30000;     // tope: 30s
  var MAX_FAILS = 6;            // tras 6 fallos consecutivos sin dev-server, dar up
  var fails = 0;
  var timer = 0;

  function poll() {
    if (!pinUrl) return;
    fetch(pinUrl, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw 0;
        return r.text();
      })
      .then(function (h) {
        h = h.trim();
        fails = 0;
        if (interval !== 1500) interval = 1500; // reset a 1.5s en éxito
        if (last !== null && last !== h) {
          location.reload();
          return;
        }
        last = h;
        schedule();
      })
      .catch(function () {
        fails++;
        if (fails >= MAX_FAILS) {
          // Sin dev-server o server muerto: dejar de gastar batería.
          if (timer) clearTimeout(timer);
          return;
        }
        // Backoff exponencial: 1.5s → 3s → 6s → 12s → 24s → 30s.
        interval = Math.min(interval * 2, MAX_INTERVAL);
        schedule();
      });
  }
  function schedule() {
    if (timer) clearTimeout(timer);
    timer = setTimeout(poll, interval);
  }
  function probe(i) {
    if (i >= tries.length) return; // sin dev-server activo, no hacer nada
    fetch(tries[i], { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw 0;
        pinUrl = tries[i];
        last = null;
        schedule();
      })
      .catch(function () { probe(i + 1); });
  }
  // Esperar a que la página esté lista antes de empezar (no quemar el
  // primer frame de CPU + red en una página que aún no pintó).
  function start() {
    if (document.readyState === 'complete') probe(0);
    else window.addEventListener('load', function () { probe(0); }, { once: true });
  }
  start();
})();
</script>
</body>
</html>
