<!doctype html>
<html lang="es" class="theme-dark" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Demo de <iswc-textarea> · is-webcomponents</title>
<meta name="description" content="Área de texto multi-línea form-associated con autosize, rows, resize, label, hint, error y show-count." />
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #0c1118; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { display: grid; place-items: start center; padding: 32px 20px; }
  main { max-width: 760px; width: 100%; display: grid; gap: 18px; }
  header h1 { font-size: 18px; font-weight: 700; margin: 0 0 4px; }
  header p { font-size: 13px; color: #94a3b8; margin: 0; }
  section { background: #131a24; border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 16px; display: grid; gap: 10px; }
  section h2 { font-size: 13px; margin: 0; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.04em; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  code { background: rgba(255,255,255,0.06); padding: 1px 5px; border-radius: 3px; font: 12px ui-monospace, Menlo, Consolas, monospace; }
  output { font: 12px ui-monospace, Menlo, Consolas, monospace; color: #94a3b8; white-space: pre-wrap; }
  /* Anti-FOUC */
  iswc-textarea:not(:defined) { visibility: hidden; }
</style>
<script type="module">
  await import('../../../dist/cdn/forms/textarea.min.js?h=xgckjz');

  await customElements.whenDefined('iswc-textarea');

  const demo = document.getElementById('demo');
  const out = document.getElementById('out');

  const render = () => {
    out.textContent = JSON.stringify({
      value: demo.value,
      length: demo.value.length,
      rows: demo.rows,
      autosize: demo.autosize,
      resize: demo.resize,
      disabled: demo.disabled,
      required: demo.required,
      readonly: demo.readonly,
    }, null, 2);
  };
  demo.addEventListener('iswc-input', () => render());
  demo.addEventListener('iswc-change', () => render());

  document.getElementById('btn-set').addEventListener('click', () => {
    demo.value = 'Línea 1\nLínea 2\nLínea 3\nLínea 4';
    render();
  });
  document.getElementById('btn-clear').addEventListener('click', () => {
    demo.value = '';
    render();
  });

  render();
  document.documentElement.dataset.textareaReady = '1';
</script>
</head>
<body>
<main>
  <header>
    <h1>Demo de <code>&lt;iswc-textarea&gt;</code></h1>
    <p>Área de texto multi-línea form-associated con autosize, rows, resize y validación.</p>
  </header>

  <section>
    <h2>Básico (autosize)</h2>
    <iswc-textarea id="demo" name="message" label="Mensaje" hint="Cuéntanos algo" autosize placeholder="Escribe aquí..."></iswc-textarea>
    <div class="grid2">
      <button id="btn-set" type="button">Set 4 líneas</button>
      <button id="btn-clear" type="button">Clear</button>
    </div>
    <output id="out"></output>
  </section>

  <section>
    <h2>Variantes</h2>
    <div class="grid2">
      <iswc-textarea name="fixed" label="Filas fijas" rows="4" resize="vertical" placeholder="4 filas"></iswc-textarea>
      <iswc-textarea name="neversize" label="Sin resize" rows="3" resize="none" placeholder="no resize"></iswc-textarea>
      <iswc-textarea name="both" label="Resize both" rows="2" resize="both" placeholder="both"></iswc-textarea>
      <iswc-textarea name="auto-bounded" label="Autosize acotado" autosize min-rows="2" max-rows="6" placeholder="2 a 6 filas"></iswc-textarea>
    </div>
  </section>

  <section>
    <h2>Estados</h2>
    <div class="grid2">
      <iswc-textarea name="rq" label="Required" required hint="Obligatorio"></iswc-textarea>
      <iswc-textarea name="ro" label="Readonly" readonly value="sólo lectura"></iswc-textarea>
      <iswc-textarea name="count" label="Con contador" maxlength="50" show-count placeholder="máx 50"></iswc-textarea>
      <iswc-textarea name="err" label="Con error" error error-text="Demasiado corto" value="x"></iswc-textarea>
      <iswc-textarea name="dis" label="Disabled" disabled value="deshabilitado"></iswc-textarea>
    </div>
  </section>
</main>
<script>
/* iswc-auto-rereload v2: backoff — polling client agnóstico del static server
 * W17: backoff exponencial + readyState wait + giveup tras MAX_FAILS fallos
 * consecutivos. Evita el loop infinito de reload-pin que vimos con Live
 * Server 5505 cuando el endpoint no responde. */
(function () {
  var tries = [
    'dist/cdn/reload-pin',
    '../dist/cdn/reload-pin',
    '../../dist/cdn/reload-pin',
    '../../../dist/cdn/reload-pin',
    '../../../../dist/cdn/reload-pin'
  ];
  var pinUrl = null;
  var last = null;
  var interval = 1500;          // arranca en 1.5s
  var MAX_INTERVAL = 30000;     // tope: 30s
  var MAX_FAILS = 6;            // tras 6 fallos consecutivos sin dev-server, dar up
  var fails = 0;
  var timer = 0;

  function poll() {
    if (!pinUrl) return;
    fetch(pinUrl, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw 0;
        return r.text();
      })
      .then(function (h) {
        h = h.trim();
        fails = 0;
        if (interval !== 1500) interval = 1500; // reset a 1.5s en éxito
        if (last !== null && last !== h) {
          location.reload();
          return;
        }
        last = h;
        schedule();
      })
      .catch(function () {
        fails++;
        if (fails >= MAX_FAILS) {
          // Sin dev-server o server muerto: dejar de gastar batería.
          if (timer) clearTimeout(timer);
          return;
        }
        // Backoff exponencial: 1.5s → 3s → 6s → 12s → 24s → 30s.
        interval = Math.min(interval * 2, MAX_INTERVAL);
        schedule();
      });
  }
  function schedule() {
    if (timer) clearTimeout(timer);
    timer = setTimeout(poll, interval);
  }
  function probe(i) {
    if (i >= tries.length) return; // sin dev-server activo, no hacer nada
    fetch(tries[i], { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw 0;
        pinUrl = tries[i];
        last = null;
        schedule();
      })
      .catch(function () { probe(i + 1); });
  }
  // Esperar a que la página esté lista antes de empezar (no quemar el
  // primer frame de CPU + red en una página que aún no pintó).
  function start() {
    if (document.readyState === 'complete') probe(0);
    else window.addEventListener('load', function () { probe(0); }, { once: true });
  }
  start();
})();
</script>
</body>
</html>
