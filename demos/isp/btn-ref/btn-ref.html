<!doctype html>
<html lang="es" class="theme-dark" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>&lt;iswc-btn-ref&gt; · iswc-root</title>
<meta name="description" content="Input + botón filtro que abre un <iswc-catalogo-gen> en modo selección para FKs de catálogo." />
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #0c1118; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; min-height: 100vh; }
  header {
    padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.1);
    display: flex; align-items: center; gap: 14px; background: #0f1620;
  }
  header h1 { font-size: 16px; font-weight: 700; margin: 0; }
  header p { font-size: 12px; color: #94a3b8; margin: 0; }
  header .spacer { flex: 1; }
  main { display: grid; gap: 20px; padding: 20px; max-width: 700px; margin: 0 auto; width: 100%; box-sizing: border-box; }
  section h2 { font-size: 14px; font-weight: 600; margin: 0 0 8px; color: #94a3b8; }
  .row { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; }
  .log { font: 12px ui-monospace, Menlo, Consolas, monospace; background: rgba(0,0,0,0.3); padding: 8px; border-radius: 4px; min-height: 100px; white-space: pre-wrap; }
  iswc-btn-ref { width: 22rem; max-width: 100%; }
  iswc-btn-ref:not(:defined) { visibility: hidden; }
</style>
<script type="module">
  // Cargar bundles necesarios para <iswc-btn-ref> y sus dependencias transitivas.
  await import('../../../dist/cdn/forms/input.min.js?h=x2bga0');
  await import('../../../dist/cdn/actions/button.min.js?h=8txda4');
  await import('../../../dist/cdn/media/icon.min.js?h=8yrsf7');
  await import('../../../dist/cdn/layout/dialog.min.js?h=hwvmct');
  await import('../../../dist/cdn/isp/catalogo-gen.min.js?h=tt2539');
  await import('../../../dist/cdn/isp/btn-ref.min.js?h=cqp7yq');
  await customElements.whenDefined('iswc-btn-ref');

  // ── Controller con datos fake ────────────────────────────────────────
  const PRODUCTOS = [
    { app: 'CP', descripcion: 'ContaPyme' },
    { app: 'AW', descripcion: 'AgroWin' },
    { app: 'NS', descripcion: 'NominaSoft' },
    { app: 'IM', descripcion: 'InventarioMax' },
  ];
  const ctrlApp = {
    entrie: 'Aplicación',
    primaryKeys: ['app'],
    ColumnsBtnRef: ['app', 'descripcion'],
    columns: [
      { field: 'app', header: 'App' },
      { field: 'descripcion', header: 'Descripción' },
    ],
    async Lista({ pagina = 1, qregistros = 50, filtro = null } = {}) {
      const all = filtro?.sql
        ? PRODUCTOS.filter((p) => p.app.toLowerCase() === filtro.sql.replace(/.*=\s*'([^']+)'.*/, '$1').toLowerCase())
        : PRODUCTOS;
      return { datos: all.slice((pagina - 1) * qregistros, pagina * qregistros), total: all.length };
    },
  };

  // ── Asignar controller y listener ────────────────────────────────────
  const ref = document.getElementById('ref-app');
  ref.controller = ctrlApp;
  const eventLog = document.getElementById('event-log');
  const log = (m) => { eventLog.textContent += new Date().toISOString().slice(11, 19) + ' ' + m + '\n'; };

  ref.addEventListener('iswc-change', (e) => log(`iswc-change: value="${e.detail.value}"`));
  ref.addEventListener('iswc-input', (e) => log(`iswc-input: value="${e.detail.value}"`));
  ref.addEventListener('iswc-selected-record', (e) => log(`iswc-selected-record: value="${e.detail.value}" label="${e.detail.label}"`));

  // ── Botón para abrir el modal manualmente ────────────────────────────
  document.getElementById('open-modal').addEventListener('click', () => {
    ref.open?.();
  });

  // ── Botón para asignar valor programáticamente ────────────────────────
  document.getElementById('set-value').addEventListener('click', () => {
    ref.value = 'NS';
  });

  document.documentElement.dataset.btnRefReady = '1';
</script>
</head>
<body>
<header>
  <div>
    <h1>&lt;iswc-btn-ref&gt; — selector de FK con modal</h1>
    <p>Escribe la clave a mano o pulsa el botón filtro para abrir el catálogo.</p>
  </div>
  <div class="spacer"></div>
  <code>iswc-btn-ref</code>
</header>
<main>
  <section>
    <h2>Ejemplo</h2>
    <div class="row">
      <iswc-btn-ref id="ref-app" label="Aplicación" name="aplicacion" required maxlength="6"></iswc-btn-ref>
      <button title="Abrir catálogo" id="open-modal" type="button" style="padding: 8px 14px; background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-radius: 4px; cursor: pointer;">Abrir catálogo</button>
      <button title="Set value = NS" id="set-value" type="button" style="padding: 8px 14px; background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-radius: 4px; cursor: pointer;">Set value = NS</button>
    </div>
  </section>

  <section>
    <h2>Eventos</h2>
    <pre id="event-log" class="log"></pre>
  </section>
</main>
<script>
/* iswc-auto-rereload v2: backoff — polling client agnóstico del static server
 * W17: backoff exponencial + readyState wait + giveup tras MAX_FAILS fallos
 * consecutivos. Evita el loop infinito de reload-pin que vimos con Live
 * Server 5505 cuando el endpoint no responde. */
(function () {
  var tries = [
    'dist/cdn/reload-pin',
    '../dist/cdn/reload-pin',
    '../../dist/cdn/reload-pin',
    '../../../dist/cdn/reload-pin',
    '../../../../dist/cdn/reload-pin'
  ];
  var pinUrl = null;
  var last = null;
  var interval = 1500;          // arranca en 1.5s
  var MAX_INTERVAL = 30000;     // tope: 30s
  var MAX_FAILS = 6;            // tras 6 fallos consecutivos sin dev-server, dar up
  var fails = 0;
  var timer = 0;

  function poll() {
    if (!pinUrl) return;
    fetch(pinUrl, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw 0;
        return r.text();
      })
      .then(function (h) {
        h = h.trim();
        fails = 0;
        if (interval !== 1500) interval = 1500; // reset a 1.5s en éxito
        if (last !== null && last !== h) {
          location.reload();
          return;
        }
        last = h;
        schedule();
      })
      .catch(function () {
        fails++;
        if (fails >= MAX_FAILS) {
          // Sin dev-server o server muerto: dejar de gastar batería.
          if (timer) clearTimeout(timer);
          return;
        }
        // Backoff exponencial: 1.5s → 3s → 6s → 12s → 24s → 30s.
        interval = Math.min(interval * 2, MAX_INTERVAL);
        schedule();
      });
  }
  function schedule() {
    if (timer) clearTimeout(timer);
    timer = setTimeout(poll, interval);
  }
  function probe(i) {
    if (i >= tries.length) return; // sin dev-server activo, no hacer nada
    fetch(tries[i], { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw 0;
        pinUrl = tries[i];
        last = null;
        schedule();
      })
      .catch(function () { probe(i + 1); });
  }
  // Esperar a que la página esté lista antes de empezar (no quemar el
  // primer frame de CPU + red en una página que aún no pintó).
  function start() {
    if (document.readyState === 'complete') probe(0);
    else window.addEventListener('load', function () { probe(0); }, { once: true });
  }
  start();
})();
</script>
</body>
</html>
