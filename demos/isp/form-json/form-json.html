<!doctype html>
<html lang="es" class="theme-dark" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>&lt;form-json&gt; helpers · is-webcomponents</title>
<meta name="description" content="Helpers de lectura/escritura de valores de controles con name (getValues/setValues/listControls)." />
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #0c1118; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; min-height: 100vh; }
  header {
    padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.1);
    display: flex; align-items: center; gap: 14px; background: #0f1620;
  }
  header h1 { font-size: 16px; font-weight: 700; margin: 0; }
  header p { font-size: 12px; color: #94a3b8; margin: 0; }
  header .spacer { flex: 1; }
  main { display: grid; gap: 24px; padding: 20px; max-width: 1000px; margin: 0 auto; width: 100%; box-sizing: border-box; }
  section h2 { font-size: 14px; font-weight: 600; margin: 0 0 8px; color: #94a3b8; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .panel { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 12px; }
  .panel h3 { font-size: 12px; margin: 0 0 8px; color: #94a3b8; }
  form-fieldset { display: grid; gap: 8px; }
  pre.out { font: 12px ui-monospace, Menlo, Consolas, monospace; background: rgba(0,0,0,0.4); padding: 8px; border-radius: 4px; max-height: 240px; overflow: auto; }
  button.btn { padding: 6px 12px; background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-radius: 4px; cursor: pointer; margin-right: 6px; }
  iswc-input, iswc-switch, iswc-select, iswc-checkbox { min-width: 12rem; }
  iswc-input:not(:defined), iswc-switch:not(:defined), iswc-select:not(:defined), iswc-checkbox:not(:defined) { visibility: hidden; }
</style>
<script type="module">
  // Dependencias: los controles que vamos a leer/escribir.
  await import('../../../dist/cdn/forms/input.min.js?h=166kn8');
  await import('../../../dist/cdn/forms/select.min.js?h=xanert');
  await import('../../../dist/cdn/forms/option.min.js?h=yu7rb2');
  await import('../../../dist/cdn/forms/checkbox.min.js?h=dstg8z');
  await import('../../../dist/cdn/forms/switch.js');
  // Cargar también el form (lo usa como contenedor del helper).
  await import('../../../dist/cdn/isp/form-json.min.js?h=pv616a');

  // ── form-json es un módulo helper, NO un custom element ────────────
  // Expone: getValues, setValues, listControls, getControlValue, setControlValue.

  const out = document.getElementById('out');
  const form = document.getElementById('demo-form');

  const showJson = (label, obj) => {
    out.textContent = `// ${label}\n` + JSON.stringify(obj, null, 2);
  };

  // Helper para invocar los exports del módulo.
  async function loadHelpers() {
    return await import('../../../dist/cdn/isp/form-json.min.js?h=pv616a');
  }

  document.getElementById('btn-get').addEventListener('click', async () => {
    const { getValues } = await loadHelpers();
    showJson('getValues(form)', getValues(form));
  });

  document.getElementById('btn-set').addEventListener('click', async () => {
    const { setValues } = await loadHelpers();
    setValues(form, {
      cliente: 'CL-009',
      correo: 'demo@contapyme.co',
      cantidad: 42,
      activo: true,
      tipo: 'factura',
      envio: ['email'],
    });
  });

  document.getElementById('btn-list').addEventListener('click', async () => {
    const { listControls } = await loadHelpers();
    const controls = listControls(form);
    showJson('listControls(form)', controls.map((c) => ({ tag: c.localName, name: c.getAttribute('name') })));
  });

  document.getElementById('btn-clear').addEventListener('click', async () => {
    const { setValues } = await loadHelpers();
    setValues(form, {});
  });

  document.documentElement.dataset.formJsonReady = '1';
</script>
</head>
<body>
<header>
  <div>
    <h1>&lt;form-json&gt; — helpers de form serialization</h1>
    <p>Expone <code>getValues / setValues / listControls / getControlValue / setControlValue</code> sobre cualquier host.</p>
  </div>
  <div class="spacer"></div>
  <code>form-json</code>
</header>
<main>
  <section>
    <h2>Demo: leer/escribir controles con <code>name</code></h2>
    <div class="grid-2">
      <div class="panel">
        <h3>Controles</h3>
        <form id="demo-form" style="display: grid; gap: 8px;">
          <iswc-input name="cliente" label="Cliente"></iswc-input>
          <iswc-input name="correo" label="Correo" type="email"></iswc-input>
          <iswc-input name="cantidad" label="Cantidad" type="number"></iswc-input>
          <iswc-switch name="activo">Activo</iswc-switch>
          <iswc-select name="tipo" label="Tipo">
            <iswc-option value="factura">Factura</iswc-option>
            <iswc-option value="nota">Nota</iswc-option>
          </iswc-select>
          <iswc-checkbox name="envio" value="email">Email</iswc-checkbox>
          <iswc-checkbox name="envio" value="sms">SMS</iswc-checkbox>
        </form>
        <div style="margin-top: 12px;">
          <button id="btn-get" type="button" class="btn">getValues()</button>
          <button id="btn-set" type="button" class="btn">setValues({...})</button>
          <button id="btn-list" type="button" class="btn">listControls()</button>
          <button id="btn-clear" type="button" class="btn">Limpiar</button>
        </div>
      </div>
      <div class="panel">
        <h3>Output</h3>
        <pre id="out" class="out">Pulsa un botón para ver el JSON.</pre>
      </div>
    </div>
  </section>
</main>
<script>
/* iswc-auto-rereload v2: backoff — polling client agnóstico del static server
 * W17: backoff exponencial + readyState wait + giveup tras MAX_FAILS fallos
 * consecutivos. Evita el loop infinito de reload-pin que vimos con Live
 * Server 5505 cuando el endpoint no responde. */
(function () {
  var tries = [
    'dist/cdn/reload-pin',
    '../dist/cdn/reload-pin',
    '../../dist/cdn/reload-pin',
    '../../../dist/cdn/reload-pin',
    '../../../../dist/cdn/reload-pin'
  ];
  var pinUrl = null;
  var last = null;
  var interval = 1500;          // arranca en 1.5s
  var MAX_INTERVAL = 30000;     // tope: 30s
  var MAX_FAILS = 6;            // tras 6 fallos consecutivos sin dev-server, dar up
  var fails = 0;
  var timer = 0;

  function poll() {
    if (!pinUrl) return;
    fetch(pinUrl, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw 0;
        return r.text();
      })
      .then(function (h) {
        h = h.trim();
        fails = 0;
        if (interval !== 1500) interval = 1500; // reset a 1.5s en éxito
        if (last !== null && last !== h) {
          location.reload();
          return;
        }
        last = h;
        schedule();
      })
      .catch(function () {
        fails++;
        if (fails >= MAX_FAILS) {
          // Sin dev-server o server muerto: dejar de gastar batería.
          if (timer) clearTimeout(timer);
          return;
        }
        // Backoff exponencial: 1.5s → 3s → 6s → 12s → 24s → 30s.
        interval = Math.min(interval * 2, MAX_INTERVAL);
        schedule();
      });
  }
  function schedule() {
    if (timer) clearTimeout(timer);
    timer = setTimeout(poll, interval);
  }
  function probe(i) {
    if (i >= tries.length) return; // sin dev-server activo, no hacer nada
    fetch(tries[i], { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw 0;
        pinUrl = tries[i];
        last = null;
        schedule();
      })
      .catch(function () { probe(i + 1); });
  }
  // Esperar a que la página esté lista antes de empezar (no quemar el
  // primer frame de CPU + red en una página que aún no pintó).
  function start() {
    if (document.readyState === 'complete') probe(0);
    else window.addEventListener('load', function () { probe(0); }, { once: true });
  }
  start();
})();
</script>
</body>
</html>
