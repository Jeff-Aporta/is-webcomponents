<!doctype html>
<html lang="es" class="theme-dark" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>&lt;iswc-confirm-delete&gt; · is-webcomponents</title>
<meta name="description" content="Modal de confirmación destructiva que requiere re-escribir la clave del registro antes de habilitar el botón Eliminar." />
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #0c1118; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; min-height: 100vh; }
  header {
    padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.1);
    display: flex; align-items: center; gap: 14px; background: #0f1620;
  }
  header h1 { font-size: 16px; font-weight: 700; margin: 0; }
  header p { font-size: 12px; color: #94a3b8; margin: 0; }
  header .spacer { flex: 1; }
  main { display: grid; place-items: center; gap: 20px; padding: 20px; }
  .toolbar { display: flex; gap: 12px; }
  .log { font: 12px ui-monospace, Menlo, Consolas, monospace; background: rgba(0,0,0,0.3); padding: 8px; border-radius: 4px; min-height: 60px; white-space: pre-wrap; }
  iswc-confirm-delete:not(:defined) { visibility: hidden; }
</style>
<script type="module">
  // Dependencias de <iswc-confirm-delete>.
  await import('../../../dist/cdn/actions/button.min.js?h=gi9oba');
  await import('../../../dist/cdn/forms/input.min.js?h=166kn8');
  await import('../../../dist/cdn/media/icon.min.js?h=sljpx6');
  await import('../../../dist/cdn/layout/dialog.min.js?h=8y6y2z');
  await import('../../../dist/cdn/isp/confirm-delete.min.js?h=mgi8r1');
  await customElements.whenDefined('iswc-confirm-delete');

  const cd = document.getElementById('cd');
  const eventLog = document.getElementById('event-log');
  const log = (m) => { eventLog.textContent += new Date().toISOString().slice(11, 19) + ' ' + m + '\n'; };
  for (const evt of ['iswc-show', 'iswc-after-show', 'iswc-hide', 'iswc-after-hide', 'iswc-confirm-delete', 'iswc-cancel-delete']) {
    cd.addEventListener(evt, (e) => log(`${evt}: ${JSON.stringify(e.detail || {}).slice(0, 120)}`));
  }

  // Configuración inicial: trigger button para abrir el modal.
  document.getElementById('btn-delete').addEventListener('click', () => {
    cd.entity = 'tercero';
    cd.pkLabel = 'NIT';
    cd.confirmValue = '900123456';
    cd.show();
  });

  // Loading simulado (para demostrar el candado durante un borrado).
  document.getElementById('btn-loading').addEventListener('click', () => {
    cd.loading = true;
    setTimeout(() => { cd.loading = false; cd.hide(); }, 800);
  });

  document.documentElement.dataset.confirmDeleteReady = '1';
</script>
</head>
<body>
<header>
  <div>
    <h1>&lt;iswc-confirm-delete&gt; — "escribe para confirmar"</h1>
    <p>El botón Eliminar se habilita sólo cuando lo escrito coincide con <code>confirm-value</code>.</p>
  </div>
  <div class="spacer"></div>
  <code>iswc-confirm-delete</code>
</header>
<main>
  <div class="toolbar">
    <iswc-button id="btn-delete" color="danger">Eliminar tercero</iswc-button>
    <iswc-button id="btn-loading" variant="outlined">Simular loading</iswc-button>
  </div>
  <iswc-confirm-delete id="cd" entity="tercero" pk-label="NIT" confirm-value="900123456"></iswc-confirm-delete>
  <pre id="event-log" class="log"></pre>
</main>
<script>
/* iswc-auto-rereload v2: backoff — polling client agnóstico del static server
 * W17: backoff exponencial + readyState wait + giveup tras MAX_FAILS fallos
 * consecutivos. Evita el loop infinito de reload-pin que vimos con Live
 * Server 5505 cuando el endpoint no responde. */
(function () {
  var tries = [
    'dist/cdn/reload-pin',
    '../dist/cdn/reload-pin',
    '../../dist/cdn/reload-pin',
    '../../../dist/cdn/reload-pin',
    '../../../../dist/cdn/reload-pin'
  ];
  var pinUrl = null;
  var last = null;
  var interval = 1500;          // arranca en 1.5s
  var MAX_INTERVAL = 30000;     // tope: 30s
  var MAX_FAILS = 6;            // tras 6 fallos consecutivos sin dev-server, dar up
  var fails = 0;
  var timer = 0;

  function poll() {
    if (!pinUrl) return;
    fetch(pinUrl, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw 0;
        return r.text();
      })
      .then(function (h) {
        h = h.trim();
        fails = 0;
        if (interval !== 1500) interval = 1500; // reset a 1.5s en éxito
        if (last !== null && last !== h) {
          location.reload();
          return;
        }
        last = h;
        schedule();
      })
      .catch(function () {
        fails++;
        if (fails >= MAX_FAILS) {
          // Sin dev-server o server muerto: dejar de gastar batería.
          if (timer) clearTimeout(timer);
          return;
        }
        // Backoff exponencial: 1.5s → 3s → 6s → 12s → 24s → 30s.
        interval = Math.min(interval * 2, MAX_INTERVAL);
        schedule();
      });
  }
  function schedule() {
    if (timer) clearTimeout(timer);
    timer = setTimeout(poll, interval);
  }
  function probe(i) {
    if (i >= tries.length) return; // sin dev-server activo, no hacer nada
    fetch(tries[i], { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw 0;
        pinUrl = tries[i];
        last = null;
        schedule();
      })
      .catch(function () { probe(i + 1); });
  }
  // Esperar a que la página esté lista antes de empezar (no quemar el
  // primer frame de CPU + red en una página que aún no pintó).
  function start() {
    if (document.readyState === 'complete') probe(0);
    else window.addEventListener('load', function () { probe(0); }, { once: true });
  }
  start();
})();
</script>
</body>
</html>
