<!doctype html>
<html lang="es" class="theme-dark" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>&lt;iswc-loading-overlay&gt; · iswc-root</title>
<meta name="description" content="Capa de bloqueo a pantalla completa con spinner y mensaje. No dismissable por Escape / backdrop." />
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #0c1118; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; min-height: 100vh; }
  header {
    padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.1);
    display: flex; align-items: center; gap: 14px; background: #0f1620;
  }
  header h1 { font-size: 16px; font-weight: 700; margin: 0; }
  header p { font-size: 12px; color: #94a3b8; margin: 0; }
  header .spacer { flex: 1; }
  main { display: grid; gap: 18px; padding: 20px; max-width: 800px; margin: 0 auto; width: 100%; box-sizing: border-box; align-content: start; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
  button.btn { padding: 8px 14px; background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-radius: 4px; cursor: pointer; }
  .log { font: 12px ui-monospace, Menlo, Consolas, monospace; background: rgba(0,0,0,0.3); padding: 8px; border-radius: 4px; min-height: 60px; white-space: pre-wrap; }
  iswc-loading-overlay:not(:defined) { visibility: hidden; }
</style>
<script type="module">
  await import('../../../dist/cdn/feedback/spinner.min.js?h=y9b5s9');
  await import('../../../dist/cdn/isp/loading-overlay.min.js?h=60cesu');
  await customElements.whenDefined('iswc-loading-overlay');

  const overlay = document.getElementById('overlay');
  const eventLog = document.getElementById('event-log');
  const log = (m) => { eventLog.textContent += new Date().toISOString().slice(11, 19) + ' ' + m + '\n'; };
  for (const evt of ['iswc-show', 'iswc-hide']) {
    overlay.addEventListener(evt, () => log(evt));
  }

  // Botones: mostrar/ocultar/programar.
  document.getElementById('btn-show').addEventListener('click', () => {
    overlay.message = 'Guardando cambios...';
    overlay.show();
  });
  document.getElementById('btn-hide').addEventListener('click', () => overlay.hide());
  document.getElementById('btn-toggle').addEventListener('click', () => overlay.toggle());

  // Auto ciclo: mostrar durante 1s y luego ocultar.
  document.getElementById('btn-cycle').addEventListener('click', () => {
    overlay.message = 'Procesando...';
    overlay.show();
    setTimeout(() => overlay.hide(), 1000);
  });

  document.documentElement.dataset.loadingReady = '1';
</script>
</head>
<body>
<header>
  <div>
    <h1>&lt;iswc-loading-overlay&gt; — bloqueo no dismissable</h1>
    <p>Spinner + mensaje a pantalla completa. No cierra con Escape ni backdrop; sólo el código que lo abrió.</p>
  </div>
  <div class="spacer"></div>
  <code>iswc-loading-overlay</code>
</header>
<main>
  <div class="toolbar">
    <button title="show()" id="btn-show" type="button" class="btn">show()</button>
    <button title="hide()" id="btn-hide" type="button" class="btn">hide()</button>
    <button title="toggle()" id="btn-toggle" type="button" class="btn">toggle()</button>
    <button title="Ciclo 1s" id="btn-cycle" type="button" class="btn">Ciclo 1s</button>
  </div>

  <iswc-loading-overlay id="overlay" message="Cargando..."></iswc-loading-overlay>

  <pre id="event-log" class="log"></pre>
</main>
<script>
/* iswc-auto-rereload v2: backoff — polling client agnóstico del static server
 * W17: backoff exponencial + readyState wait + giveup tras MAX_FAILS fallos
 * consecutivos. Evita el loop infinito de reload-pin que vimos con Live
 * Server 5505 cuando el endpoint no responde. */
(function () {
  var tries = [
    'dist/cdn/reload-pin',
    '../dist/cdn/reload-pin',
    '../../dist/cdn/reload-pin',
    '../../../dist/cdn/reload-pin',
    '../../../../dist/cdn/reload-pin'
  ];
  var pinUrl = null;
  var last = null;
  var interval = 1500;          // arranca en 1.5s
  var MAX_INTERVAL = 30000;     // tope: 30s
  var MAX_FAILS = 6;            // tras 6 fallos consecutivos sin dev-server, dar up
  var fails = 0;
  var timer = 0;

  function poll() {
    if (!pinUrl) return;
    fetch(pinUrl, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw 0;
        return r.text();
      })
      .then(function (h) {
        h = h.trim();
        fails = 0;
        if (interval !== 1500) interval = 1500; // reset a 1.5s en éxito
        if (last !== null && last !== h) {
          location.reload();
          return;
        }
        last = h;
        schedule();
      })
      .catch(function () {
        fails++;
        if (fails >= MAX_FAILS) {
          // Sin dev-server o server muerto: dejar de gastar batería.
          if (timer) clearTimeout(timer);
          return;
        }
        // Backoff exponencial: 1.5s → 3s → 6s → 12s → 24s → 30s.
        interval = Math.min(interval * 2, MAX_INTERVAL);
        schedule();
      });
  }
  function schedule() {
    if (timer) clearTimeout(timer);
    timer = setTimeout(poll, interval);
  }
  function probe(i) {
    if (i >= tries.length) return; // sin dev-server activo, no hacer nada
    fetch(tries[i], { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw 0;
        pinUrl = tries[i];
        last = null;
        schedule();
      })
      .catch(function () { probe(i + 1); });
  }
  // Esperar a que la página esté lista antes de empezar (no quemar el
  // primer frame de CPU + red en una página que aún no pintó).
  function start() {
    if (document.readyState === 'complete') probe(0);
    else window.addEventListener('load', function () { probe(0); }, { once: true });
  }
  start();
})();
</script>
</body>
</html>
