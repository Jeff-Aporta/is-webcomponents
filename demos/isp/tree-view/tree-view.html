<!doctype html>
<html lang="es" class="theme-dark" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>&lt;iswc-tree-view&gt; · is-webcomponents</title>
<meta name="description" content="Árbol jerárquico editable con drag, historial undo/redo, drawer de ficha y confirm-delete." />
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #0c1118; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; min-height: 100vh; }
  header {
    padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.1);
    display: flex; align-items: center; gap: 14px; background: #0f1620;
  }
  header h1 { font-size: 16px; font-weight: 700; margin: 0; }
  header p { font-size: 12px; color: #94a3b8; margin: 0; }
  header .spacer { flex: 1; }
  main { display: grid; grid-template-columns: 1fr 320px; gap: 18px; padding: 20px; max-width: 1200px; margin: 0 auto; width: 100%; box-sizing: border-box; min-height: 0; }
  .log { font: 12px ui-monospace, Menlo, Consolas, monospace; background: rgba(0,0,0,0.3); padding: 8px; border-radius: 4px; min-height: 80px; white-space: pre-wrap; }
  iswc-tree-view { display: block; height: 70vh; border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; overflow: hidden; }
  iswc-tree-view:not(:defined) { visibility: hidden; }
</style>
<script type="module">
  // Cargar todas las dependencias transitivas de tree-view.
  await import('../../../dist/cdn/actions/button.min.js?h=h1k7pi');
  await import('../../../dist/cdn/actions/button-group.min.js?h=8tc3e8');
  await import('../../../dist/cdn/actions/check-icon-button.min.js?h=jlfekv');
  await import('../../../dist/cdn/actions/dropdown.min.js?h=ym1iff');
  await import('../../../dist/cdn/actions/dropdown-item.min.js?h=7aa9sq');
  await import('../../../dist/cdn/media/icon.min.js?h=nfimcf');
  await import('../../../dist/cdn/layout/drawer.min.js?h=f3bpvc');
  await import('../../../dist/cdn/layout/dialog.min.js?h=peol06');
  await import('../../../dist/cdn/layout/divider.min.js?h=s9msqu');
  await import('../../../dist/cdn/isp/confirm-delete.min.js?h=te0cfe');
  await import('../../../dist/cdn/isp/flex-options.min.js?h=d97c6n');
  await import('../../../dist/cdn/isp/float-card.min.js?h=cl773s');
  await import('../../../dist/cdn/isp/tree-view.min.js?h=0szs5r');

  await customElements.whenDefined('iswc-tree-view');
  const { TreeCustomsBase } = await import('../../../dist/cdn/isp/tree-view.min.js?h=0szs5r');

  // ── Customs para un plan de estudios ─────────────────────────────────
  class PlanCustoms extends TreeCustomsBase {
    entrie = 'contenido';
    entries = 'Plan de contenidos';
    getFlatPath = (r) => String(r.iplan ?? '').trim();
    setFlatPath = (r, fp) => { r.iplan = fp; };
    levelName = ({ depth }) => depth === 0 ? 'Módulo' : 'Lección';
    updateNode = (node, isNew) => {
      const depth = Number(node.depth ?? 0);
      node.topology = depth >= 1 ? 'atom' : 'group';
      if (depth < 1) node.containment = 'hermetic';
      if (!isNew) return;
      if (!node.titulo) node.titulo = node.isAtom ? 'Nueva lección' : 'Nuevo módulo';
    };
    rowActions = (node, tree) => [
      { icon: 'mdi:arrow-up', title: 'Subir', onClick: () => tree.move?.(node, 'up') },
      { icon: 'mdi:arrow-down', title: 'Bajar', onClick: () => tree.move?.(node, 'down') },
    ];
    topMenuActions = (tree) => [
      { icon: 'mdi:plus-circle-outline', title: 'Agregar', onClick: () => tree.addRoot?.() },
      { icon: 'mdi:plus', title: 'Hijo', onClick: () => tree.addChild?.() },
      { icon: 'mdi:undo', title: 'Deshacer', onClick: () => tree.historyUndo?.() },
      { icon: 'mdi:redo', title: 'Rehacer', onClick: () => tree.historyRedo?.() },
    ];
  }

  const tv = document.getElementById('tree');
  tv.customs = new PlanCustoms();
  tv.bAllowed = { Crear: true, Modificar: true, Eliminar: true, Visualizar: true };
  tv.list = [
    { iplan: '1', titulo: 'Módulo 1: Introducción' },
    { iplan: '1.1', titulo: 'Bienvenida' },
    { iplan: '1.2', titulo: 'Conceptos básicos' },
    { iplan: '2', titulo: 'Módulo 2: Avanzado' },
    { iplan: '2.1', titulo: 'Patrones avanzados' },
    { iplan: '2.1.1', titulo: 'Singleton' },
    { iplan: '2.1.2', titulo: 'Factory' },
    { iplan: '2.2', titulo: 'Arquitectura' },
  ];

  const eventLog = document.getElementById('event-log');
  const log = (m) => { eventLog.textContent += new Date().toISOString().slice(11, 19) + ' ' + m + '\n'; };

  for (const evt of ['iswc-select', 'iswc-frm-open', 'iswc-frm-close', 'iswc-error']) {
    tv.addEventListener(evt, (e) => {
      const detail = JSON.stringify(e.detail || {}).slice(0, 200);
      log(`${evt}: ${detail}`);
    });
  }

  // Botón "showDelete" programático (demo de confirm-delete anidado).
  document.getElementById('btn-show-delete').addEventListener('click', () => {
    const first = tv.treeController?.record;
    if (first) tv.showDelete(first);
  });

  document.documentElement.dataset.treeViewReady = '1';
</script>
</head>
<body>
<header>
  <div>
    <h1>&lt;iswc-tree-view&gt; — árbol jerárquico editable</h1>
    <p>Drag &amp; drop, historial undo/redo, drawer de ficha, confirm-delete por re-escritura.</p>
  </div>
  <div class="spacer"></div>
  <code>iswc-tree-view</code>
</header>
<main>
  <div style="display: grid; gap: 12px; min-height: 0;">
    <iswc-tree-view id="tree" label-field="titulo" style="height: 100%;"></iswc-tree-view>
    <button title="Abrir confirm-delete del nodo actual" id="btn-show-delete" type="button" style="padding: 8px 14px; background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-radius: 4px; cursor: pointer;">Abrir confirm-delete del nodo actual</button>
  </div>
  <div style="display: grid; gap: 12px;">
    <h2 style="font-size: 14px; font-weight: 600; color: #94a3b8; margin: 0;">Eventos</h2>
    <pre id="event-log" class="log"></pre>
  </div>
</main>
<script>
/* iswc-auto-rereload v2: backoff — polling client agnóstico del static server
 * W17: backoff exponencial + readyState wait + giveup tras MAX_FAILS fallos
 * consecutivos. Evita el loop infinito de reload-pin que vimos con Live
 * Server 5505 cuando el endpoint no responde. */
(function () {
  var tries = [
    'dist/cdn/reload-pin',
    '../dist/cdn/reload-pin',
    '../../dist/cdn/reload-pin',
    '../../../dist/cdn/reload-pin',
    '../../../../dist/cdn/reload-pin'
  ];
  var pinUrl = null;
  var last = null;
  var interval = 1500;          // arranca en 1.5s
  var MAX_INTERVAL = 30000;     // tope: 30s
  var MAX_FAILS = 6;            // tras 6 fallos consecutivos sin dev-server, dar up
  var fails = 0;
  var timer = 0;

  function poll() {
    if (!pinUrl) return;
    fetch(pinUrl, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw 0;
        return r.text();
      })
      .then(function (h) {
        h = h.trim();
        fails = 0;
        if (interval !== 1500) interval = 1500; // reset a 1.5s en éxito
        if (last !== null && last !== h) {
          location.reload();
          return;
        }
        last = h;
        schedule();
      })
      .catch(function () {
        fails++;
        if (fails >= MAX_FAILS) {
          // Sin dev-server o server muerto: dejar de gastar batería.
          if (timer) clearTimeout(timer);
          return;
        }
        // Backoff exponencial: 1.5s → 3s → 6s → 12s → 24s → 30s.
        interval = Math.min(interval * 2, MAX_INTERVAL);
        schedule();
      });
  }
  function schedule() {
    if (timer) clearTimeout(timer);
    timer = setTimeout(poll, interval);
  }
  function probe(i) {
    if (i >= tries.length) return; // sin dev-server activo, no hacer nada
    fetch(tries[i], { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw 0;
        pinUrl = tries[i];
        last = null;
        schedule();
      })
      .catch(function () { probe(i + 1); });
  }
  // Esperar a que la página esté lista antes de empezar (no quemar el
  // primer frame de CPU + red en una página que aún no pintó).
  function start() {
    if (document.readyState === 'complete') probe(0);
    else window.addEventListener('load', function () { probe(0); }, { once: true });
  }
  start();
})();
</script>
</body>
</html>
