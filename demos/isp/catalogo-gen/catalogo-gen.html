<!doctype html>
<html lang="es" class="theme-dark" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>&lt;iswc-catalogo-gen&gt; · is-webcomponents</title>
<meta name="description" content="Catálogo CRUD genérico: toolbar + ag-grid + drawer de ficha + modal verificación + confirm-delete + recodificar." />
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #0c1118; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; min-height: 100vh; }
  header {
    padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.1);
    display: flex; align-items: center; gap: 14px; background: #0f1620;
  }
  header h1 { font-size: 16px; font-weight: 700; margin: 0; }
  header p { font-size: 12px; color: #94a3b8; margin: 0; }
  header .spacer { flex: 1; }
  main { display: grid; padding: 20px; max-width: 1200px; margin: 0 auto; width: 100%; box-sizing: border-box; min-height: 0; }
  .log { font: 12px ui-monospace, Menlo, Consolas, monospace; background: rgba(0,0,0,0.3); padding: 8px; border-radius: 4px; min-height: 60px; white-space: pre-wrap; margin-top: 12px; }
  iswc-catalogo-gen { height: 70vh; display: block; border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; overflow: hidden; }
  iswc-catalogo-gen:not(:defined) { visibility: hidden; }
</style>
<script type="module">
  // Dependencias transitivas de <iswc-catalogo-gen>.
  await import('../../../dist/cdn/actions/button.min.js?h=h7i2nj');
  await import('../../../dist/cdn/forms/input.min.js?h=r5wcsk');
  await import('../../../dist/cdn/media/icon.min.js?h=cjurkr');
  await import('../../../dist/cdn/data/ag-grid.min.js?h=iz87lu');
  await import('../../../dist/cdn/layout/drawer.min.js?h=zqsb7h');
  await import('../../../dist/cdn/layout/dialog.min.js?h=6iyovb');
  await import('../../../dist/cdn/isp/text.min.js?h=lfyxjw');
  await import('../../../dist/cdn/isp/heading.min.js?h=wane3i');
  await import('../../../dist/cdn/isp/confirm-delete.min.js?h=jf4i34');
  await import('../../../dist/cdn/isp/modal-verificacion.min.js?h=u7x7zp');
  await import('../../../dist/cdn/isp/form.min.js?h=3ow7hv');
  await import('../../../dist/cdn/isp/controller-from-config.min.js?h=4k9cqt');
  await import('../../../dist/cdn/isp/catalogo-gen.min.js?h=8enlyr');
  await customElements.whenDefined('iswc-catalogo-gen');

  // ── Datos fake en memoria ────────────────────────────────────────────
  const PRODUCTOS = [
    { app: 'CP', descripcion: 'ContaPyme', activo: true },
    { app: 'AW', descripcion: 'AgroWin', activo: true },
    { app: 'NS', descripcion: 'NominaSoft', activo: false },
    { app: 'IM', descripcion: 'InventarioMax', activo: true },
  ];

  const ctrl = {
    entrie: 'Aplicación',
    primaryKeys: ['app'],
    columns: [
      { field: 'app', header: 'App', width: 100 },
      { field: 'descripcion', header: 'Descripción' },
      { field: 'activo', header: 'Activo', width: 100 },
    ],
    async Lista({ pagina = 1, qregistros = 50, filtro = null, sort = [] } = {}) {
      let rows = PRODUCTOS.slice();
      if (filtro?.sql) rows = rows.filter((r) => r.app.toLowerCase().includes(filtro.sql.replace(/.*LIKE\s*'([^']+)'.*/i, '$1').toLowerCase()));
      return { datos: rows, total: rows.length };
    },
    async Crear(rec) {
      PRODUCTOS.push(rec);
      return rec;
    },
    async Modificar(rec) {
      const idx = PRODUCTOS.findIndex((r) => r.app === rec.app);
      if (idx >= 0) PRODUCTOS[idx] = rec;
      return rec;
    },
    async Eliminar(rec) {
      const idx = PRODUCTOS.findIndex((r) => r.app === rec.app);
      if (idx >= 0) PRODUCTOS.splice(idx, 1);
      return rec;
    },
    async actVerificar(rec) {
      return {
        mensajes: [
          { itdmensaje: 'info', mensaje: `Código ${rec.app} válido.` },
          { itdmensaje: 'success', mensaje: 'Sin problemas.' },
        ],
      };
    },
  };

  const cat = document.getElementById('cat');
  cat.controller = ctrl;
  cat.bAllowed = { Crear: true, Modificar: true, Visualizar: true, Eliminar: true, Verificar: true };

  const eventLog = document.getElementById('event-log');
  const log = (m) => { eventLog.textContent += new Date().toISOString().slice(11, 19) + ' ' + m + '\n'; };
  for (const evt of ['iswc-selection-change', 'iswc-double-click', 'iswc-action', 'iswc-error', 'iswc-frm-open', 'iswc-frm-close']) {
    cat.addEventListener(evt, (e) => log(`${evt}: ${JSON.stringify(e.detail || {}).slice(0, 140)}`));
  }

  // Form slot
  cat.innerHTML = `
    <iswc-form slot="frm" id="frm">
      <h3 slot="header">Aplicación</h3>
      <div slot="content" style="padding: 12px; display: grid; gap: 8px;">
        <iswc-input name="app" label="Código" required></iswc-input>
        <iswc-input name="descripcion" label="Descripción" required></iswc-input>
        <iswc-switch name="activo">Activo</iswc-switch>
      </div>
    </iswc-form>
  `;

  document.documentElement.dataset.catalogoReady = '1';
</script>
</head>
<body>
<header>
  <div>
    <h1>&lt;iswc-catalogo-gen&gt; — catálogo CRUD genérico</h1>
    <p>Toolbar + ag-grid + drawer de ficha + modales de verificación y borrado.</p>
  </div>
  <div class="spacer"></div>
  <code>iswc-catalogo-gen</code>
</header>
<main>
  <iswc-catalogo-gen id="cat" show-header></iswc-catalogo-gen>
  <pre id="event-log" class="log"></pre>
</main>
<script>
/* iswc-auto-rereload v2: backoff — polling client agnóstico del static server
 * W17: backoff exponencial + readyState wait + giveup tras MAX_FAILS fallos
 * consecutivos. Evita el loop infinito de reload-pin que vimos con Live
 * Server 5505 cuando el endpoint no responde. */
(function () {
  var tries = [
    'dist/cdn/reload-pin',
    '../dist/cdn/reload-pin',
    '../../dist/cdn/reload-pin',
    '../../../dist/cdn/reload-pin',
    '../../../../dist/cdn/reload-pin'
  ];
  var pinUrl = null;
  var last = null;
  var interval = 1500;          // arranca en 1.5s
  var MAX_INTERVAL = 30000;     // tope: 30s
  var MAX_FAILS = 6;            // tras 6 fallos consecutivos sin dev-server, dar up
  var fails = 0;
  var timer = 0;

  function poll() {
    if (!pinUrl) return;
    fetch(pinUrl, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw 0;
        return r.text();
      })
      .then(function (h) {
        h = h.trim();
        fails = 0;
        if (interval !== 1500) interval = 1500; // reset a 1.5s en éxito
        if (last !== null && last !== h) {
          location.reload();
          return;
        }
        last = h;
        schedule();
      })
      .catch(function () {
        fails++;
        if (fails >= MAX_FAILS) {
          // Sin dev-server o server muerto: dejar de gastar batería.
          if (timer) clearTimeout(timer);
          return;
        }
        // Backoff exponencial: 1.5s → 3s → 6s → 12s → 24s → 30s.
        interval = Math.min(interval * 2, MAX_INTERVAL);
        schedule();
      });
  }
  function schedule() {
    if (timer) clearTimeout(timer);
    timer = setTimeout(poll, interval);
  }
  function probe(i) {
    if (i >= tries.length) return; // sin dev-server activo, no hacer nada
    fetch(tries[i], { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw 0;
        pinUrl = tries[i];
        last = null;
        schedule();
      })
      .catch(function () { probe(i + 1); });
  }
  // Esperar a que la página esté lista antes de empezar (no quemar el
  // primer frame de CPU + red en una página que aún no pintó).
  function start() {
    if (document.readyState === 'complete') probe(0);
    else window.addEventListener('load', function () { probe(0); }, { once: true });
  }
  start();
})();
</script>
</body>
</html>
