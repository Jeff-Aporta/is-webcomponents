<!doctype html>
<html lang="es" class="theme-dark" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>&lt;iswc-form&gt; · is-webcomponents</title>
<meta name="description" content="Ficha declarativa con header/content/footer, cuerpo en JSON compacto y eventos iswc-submit / iswc-cancel." />
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #0c1118; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; min-height: 100vh; }
  header {
    padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.1);
    display: flex; align-items: center; gap: 14px; background: #0f1620;
  }
  header h1 { font-size: 16px; font-weight: 700; margin: 0; }
  header p { font-size: 12px; color: #94a3b8; margin: 0; }
  header .spacer { flex: 1; }
  main { display: grid; gap: 24px; padding: 20px; max-width: 900px; margin: 0 auto; width: 100%; box-sizing: border-box; }
  section h2 { font-size: 14px; font-weight: 600; margin: 0 0 8px; color: #94a3b8; }
  .log { font: 12px ui-monospace, Menlo, Consolas, monospace; background: rgba(0,0,0,0.3); padding: 8px; border-radius: 4px; min-height: 60px; white-space: pre-wrap; }
  button.btn { padding: 6px 12px; background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-radius: 4px; cursor: pointer; margin-right: 6px; }
  iswc-form { border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; overflow: hidden; }
  iswc-form:not(:defined) { visibility: hidden; }
</style>
<script type="module">
  // Dependencias de <iswc-form>.
  await import('../../../dist/cdn/actions/button.min.js?h=mlndvw');
  await import('../../../dist/cdn/forms/input.min.js?h=zw7kcn');
  await import('../../../dist/cdn/forms/textarea.min.js?h=q3ic4p');
  await import('../../../dist/cdn/forms/select.min.js?h=3j4loa');
  await import('../../../dist/cdn/forms/option.min.js?h=s4r15d');
  await import('../../../dist/cdn/forms/checkbox.min.js?h=pc3l22');
  await import('../../../dist/cdn/forms/switch.js');
  await import('../../../dist/cdn/forms/radio.min.js?h=q17mhi');
  await import('../../../dist/cdn/isp/form.min.js?h=vmq26k');
  await customElements.whenDefined('iswc-form');

  const eventLog = document.getElementById('event-log');
  const log = (m) => { eventLog.textContent += new Date().toISOString().slice(11, 19) + ' ' + m + '\n'; };

  // ── Demo 1: declarativo (light DOM) ─────────────────────────────────
  const formA = document.getElementById('form-a');
  formA.addEventListener('iswc-submit', (e) => log(`formA submit values=${JSON.stringify(e.detail.values)}`));
  formA.addEventListener('iswc-cancel', (e) => log(`formA cancel`));

  // ── Demo 2: declarado vía fromJSON (codec compacto) ────────────────
  const formB = document.getElementById('form-b');
  formB.fromJSON({
    mode: 'edit',
    submitLabel: 'Guardar',
    body: [
      ['h3', { slot: 'header' }, 'Tercero (desde JSON)'],
      ['div', { slot: 'content', style: 'padding: 12px; display: grid; gap: 8px;' },
        ['iswc-input', { name: 'nit', label: 'NIT', required: true }],
        ['iswc-input', { name: 'razon', label: 'Razón social', required: true }],
        ['iswc-switch', { name: 'activo' }, 'Activo'],
      ],
    ],
    values: { nit: '900123456', razon: 'Demo S.A.S', activo: true },
  });
  formB.addEventListener('iswc-submit', (e) => log(`formB submit values=${JSON.stringify(e.detail.values)}`));

  // ── Botones de utilidad ──────────────────────────────────────────────
  document.getElementById('btn-mode').addEventListener('click', () => {
    const f = document.getElementById('form-b');
    f.mode = f.mode === 'edit' ? 'view' : 'edit';
    log(`formB mode → ${f.mode}`);
  });
  document.getElementById('btn-serialize').addEventListener('click', () => {
    const f = document.getElementById('form-b');
    console.log('toJSON:', JSON.stringify(f.toJSON(), null, 2));
    log(`formB toJSON() serializado en consola`);
  });
  document.getElementById('btn-load-edit').addEventListener('click', () => {
    const f = document.getElementById('form-b');
    f.fromJSON({
      mode: 'edit',
      body: [
        ['h3', { slot: 'header' }, 'Tercero'],
        ['div', { slot: 'content', style: 'padding: 12px; display: grid; gap: 8px;' },
          ['iswc-input', { name: 'nit', label: 'NIT' }],
          ['iswc-input', { name: 'email', label: 'Email' }],
        ],
      ],
      values: { nit: '800111222', email: 'ops@empresa.co' },
    });
  });

  // ── Demo 3: inline JSON via <script> ─────────────────────────────────
  // El script tag se procesa automáticamente en connectedCallback.

  document.documentElement.dataset.formReady = '1';
</script>
</head>
<body>
<header>
  <div>
    <h1>&lt;iswc-form&gt; — ficha declarativa</h1>
    <p>Header / content / footer. Cuerpo en JSON compacto (mismo codec que <iswc-block-layout>).</p>
  </div>
  <div class="spacer"></div>
  <code>iswc-form</code>
</header>
<main>
  <section>
    <h2>Demo A — declarativo en light DOM</h2>
    <iswc-form id="form-a" submit-label="Guardar">
      <h3 slot="header">Curso</h3>
      <div slot="content" style="padding: 12px; display: grid; gap: 8px;">
        <iswc-input title="Código" name="icurso" label="Código" required></iswc-input>
        <iswc-input title="Título" name="titulo" label="Título" required></iswc-input>
        <iswc-switch title="Activo" name="activo">Activo</iswc-switch>
      </div>
    </iswc-form>
  </section>

  <section>
    <h2>Demo B — desde <code>fromJSON()</code> + botones de utilidad</h2>
    <iswc-form id="form-b"></iswc-form>
    <div style="margin-top: 12px;">
      <button title="Toggle mode (edit/view)" id="btn-mode" type="button" class="btn">Toggle mode (edit/view)</button>
      <button title="toJSON() en consola" id="btn-serialize" type="button" class="btn">toJSON() en consola</button>
      <button title="Recargar fromJSON" id="btn-load-edit" type="button" class="btn">Recargar fromJSON</button>
    </div>
  </section>

  <section>
    <h2>Demo C — inline JSON via <code>&lt;script type="application/json"&gt;</code></h2>
    <iswc-form id="form-c" submit-label="Crear">
      <script type="application/json">
        {
          "mode": "edit",
          "submitLabel": "Crear",
          "body": [
            ["h3", { "slot": "header" }, "Nuevo item"],
            ["div", { "slot": "content", "style": "padding: 12px; display: grid; gap: 8px;" },
              ["iswc-input", { "name": "codigo", "label": "Código", "required": true }],
              ["iswc-input", { "name": "descripcion", "label": "Descripción", "required": true }]
            ]
          ],
          "values": { "codigo": "AUTO", "descripcion": "Cargado desde <script>" }
        }
      </script>
    </iswc-form>
  </section>

  <section>
    <h2>Eventos</h2>
    <pre id="event-log" class="log"></pre>
  </section>
</main>
<script>
/* iswc-auto-rereload v2: backoff — polling client agnóstico del static server
 * W17: backoff exponencial + readyState wait + giveup tras MAX_FAILS fallos
 * consecutivos. Evita el loop infinito de reload-pin que vimos con Live
 * Server 5505 cuando el endpoint no responde. */
(function () {
  var tries = [
    'dist/cdn/reload-pin',
    '../dist/cdn/reload-pin',
    '../../dist/cdn/reload-pin',
    '../../../dist/cdn/reload-pin',
    '../../../../dist/cdn/reload-pin'
  ];
  var pinUrl = null;
  var last = null;
  var interval = 1500;          // arranca en 1.5s
  var MAX_INTERVAL = 30000;     // tope: 30s
  var MAX_FAILS = 6;            // tras 6 fallos consecutivos sin dev-server, dar up
  var fails = 0;
  var timer = 0;

  function poll() {
    if (!pinUrl) return;
    fetch(pinUrl, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw 0;
        return r.text();
      })
      .then(function (h) {
        h = h.trim();
        fails = 0;
        if (interval !== 1500) interval = 1500; // reset a 1.5s en éxito
        if (last !== null && last !== h) {
          location.reload();
          return;
        }
        last = h;
        schedule();
      })
      .catch(function () {
        fails++;
        if (fails >= MAX_FAILS) {
          // Sin dev-server o server muerto: dejar de gastar batería.
          if (timer) clearTimeout(timer);
          return;
        }
        // Backoff exponencial: 1.5s → 3s → 6s → 12s → 24s → 30s.
        interval = Math.min(interval * 2, MAX_INTERVAL);
        schedule();
      });
  }
  function schedule() {
    if (timer) clearTimeout(timer);
    timer = setTimeout(poll, interval);
  }
  function probe(i) {
    if (i >= tries.length) return; // sin dev-server activo, no hacer nada
    fetch(tries[i], { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw 0;
        pinUrl = tries[i];
        last = null;
        schedule();
      })
      .catch(function () { probe(i + 1); });
  }
  // Esperar a que la página esté lista antes de empezar (no quemar el
  // primer frame de CPU + red en una página que aún no pintó).
  function start() {
    if (document.readyState === 'complete') probe(0);
    else window.addEventListener('load', function () { probe(0); }, { once: true });
  }
  start();
})();
</script>
</body>
</html>
