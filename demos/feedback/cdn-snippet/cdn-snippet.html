<!doctype html>
<html lang="es" class="theme-dark" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Demo <is-cdn-snippet> · is-webcomponents</title>
<meta name="description" content="Demo de <is-cdn-snippet>: panel de copy-paste con loader.min.js, deps y prompt LLM." />
<style>
  html, body { margin: 0; padding: 0; background: #0c1118; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { padding: 24px; display: grid; gap: 24px; }
  header h1 { font-size: 18px; margin: 0 0 4px; }
  header p  { font-size: 13px; color: #94a3b8; margin: 0; }
  is-cdn-snippet:not(:defined) { visibility: hidden; }
</style>
<script type="module">
  await import('../../../dist/cdn/feedback/cdn-snippet.min.js');

  await customElements.whenDefined('is-cdn-snippet');
  document.documentElement.dataset.cdnSnippetReady = '1';
</script>
</head>
<body>
<header>
  <h1>is-cdn-snippet</h1>
  <p>Panel de copy-paste con loader.min.js (sin npm). Radio de alcance (tag | category | all), deps opcionales, prompt LLM embebido.</p>
</header>

<is-cdn-snippet
  tag="is-cdn-snippet-demo"
  category="feedback"
  title="Consumo por CDN · cdn-snippet demo"
  url-key="cdn-snippet-demo"
>
  <script type="application/json" slot="deps">
    [
      { "name": "is-code",   "version": "^1", "js": "https://cdn.jsdelivr.net/npm/@insoft/is-webcomponents@main/dist/cdn/code/code.min.js" },
      { "name": "is-button", "version": "^1", "js": "https://cdn.jsdelivr.net/npm/@insoft/is-webcomponents@main/dist/cdn/actions/button.min.js" }
    ]
  </script>
</is-cdn-snippet>
</body>
</html>
