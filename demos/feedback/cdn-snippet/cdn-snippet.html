<!doctype html>
<html lang="es" class="theme-dark" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Demo <iswc-cdn-snippet> · is-webcomponents</title>
<meta name="description" content="Demo de <iswc-cdn-snippet>: panel de copy-paste con loader.min.js, deps y prompt LLM." />
<style>
  html, body { margin: 0; padding: 0; background: #0c1118; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { padding: 24px; display: grid; gap: 24px; }
  header h1 { font-size: 18px; margin: 0 0 4px; }
  header p  { font-size: 13px; color: #94a3b8; margin: 0; }
  iswc-cdn-snippet:not(:defined) { visibility: hidden; }
</style>
<script type="module">
  await import('../../../dist/cdn/feedback/cdn-snippet.min.js?h=ojcv3o');

  await customElements.whenDefined('iswc-cdn-snippet');
  document.documentElement.dataset.cdnSnippetReady = '1';
</script>
</head>
<body>
<header>
  <h1>iswc-cdn-snippet</h1>
  <p>Panel de copy-paste con loader.min.js (sin npm). Radio de alcance (tag | category | all), deps opcionales, prompt LLM embebido.</p>
</header>

<iswc-cdn-snippet
  tag="iswc-cdn-snippet-demo"
  category="feedback"
  title="Consumo por CDN · cdn-snippet demo"
  url-key="cdn-snippet-demo"
>
  <script type="application/json" slot="deps">
    [
      { "name": "iswc-code",   "version": "^1", "js": "https://cdn.jsdelivr.net/npm/@insoft/is-webcomponents@main/dist/cdn/code/code.min.js" },
      { "name": "iswc-button", "version": "^1", "js": "https://cdn.jsdelivr.net/npm/@insoft/is-webcomponents@main/dist/cdn/actions/button.min.js" }
    ]
  </script>
</iswc-cdn-snippet>
<script>
/* iswc-auto-reload: do not remove — polling client agnóstico del static server */
(function () {
  var tries = [
    'dist/cdn/reload-pin',
    '../dist/cdn/reload-pin',
    '../../dist/cdn/reload-pin',
    '../../../dist/cdn/reload-pin',
    '../../../../dist/cdn/reload-pin'
  ];
  var pinUrl = null;
  var last = null;
  function poll() {
    if (!pinUrl) return;
    fetch(pinUrl, { cache: 'no-store' })
      .then(function (r) { return r.text(); })
      .then(function (h) {
        h = h.trim();
        if (last !== null && last !== h) location.reload();
        last = h;
      })
      .catch(function () {});
  }
  function probe(i) {
    if (i >= tries.length) return; // sin dev-server activo, no hacer nada
    fetch(tries[i], { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw 0;
        pinUrl = tries[i];
        setInterval(poll, 1500);
      })
      .catch(function () { probe(i + 1); });
  }
  probe(0);
})();
</script>
</body>
</html>
