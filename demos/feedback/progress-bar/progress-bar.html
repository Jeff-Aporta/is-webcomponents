<!doctype html>
<html lang="es" class="theme-dark" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Demo <iswc-progress-bar> · is-webcomponents</title>
<meta name="description" content="Demo de <iswc-progress-bar>: barra de progreso con role=progressbar, aria-valuenow, indeterminate." />
<style>
  html, body { margin: 0; padding: 0; background: #0c1118; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { padding: 24px; display: grid; gap: 24px; }
  header h1 { font-size: 18px; margin: 0 0 4px; }
  header p  { font-size: 13px; color: #94a3b8; margin: 0; }
  section { background: #0f1620; border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 18px; }
  section h2 { font-size: 14px; margin: 0 0 12px; color: #94a3b8; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
  iswc-progress-bar:not(:defined) { visibility: hidden; }
</style>
<script type="module">
  await import('../../../dist/cdn/feedback/progress-bar.min.js?h=2clg1c');

  await customElements.whenDefined('iswc-progress-bar');
  document.documentElement.dataset.progressBarReady = '1';
</script>
</head>
<body>
<header>
  <h1>iswc-progress-bar</h1>
  <p>Barra de progreso lineal con role=progressbar, aria-valuemin/max/now. Soporta estado indeterminate.</p>
</header>

<section>
  <h2>Valores fijos</h2>
  <p><code>value="0"</code></p>
  <iswc-progress-bar value="0" label="Inicio"></iswc-progress-bar>

  <p><code>value="33"</code></p>
  <iswc-progress-bar value="33" label="Cargando"></iswc-progress-bar>

  <p><code>value="66"</code></p>
  <iswc-progress-bar value="66" label="Cargando"></iswc-progress-bar>

  <p><code>value="100"</code></p>
  <iswc-progress-bar value="100" label="Completo"></iswc-progress-bar>
</section>

<section>
  <h2>Indeterminate</h2>
  <iswc-progress-bar indeterminate label="Cargando"></iswc-progress-bar>
</section>

<section>
  <h2>Personalización (color / track-height)</h2>
  <iswc-progress-bar value="50" color="#7c3aed" track-height="14" label="Custom"></iswc-progress-bar>
</section>
</body>
</html>
