<!doctype html>
<html lang="es" class="theme-dark" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Demo <iswc-spinner> · iswc-root</title>
<meta name="description" content="Demo de <iswc-spinner>: anillo de carga animado, role=status, customizable color/size/speed." />
<style>
  html, body { margin: 0; padding: 0; background: #0c1118; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { padding: 24px; display: grid; gap: 24px; }
  header h1 { font-size: 18px; margin: 0 0 4px; }
  header p  { font-size: 13px; color: #94a3b8; margin: 0; }
  section { background: #0f1620; border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 18px; }
  section h2 { font-size: 14px; margin: 0 0 12px; color: #94a3b8; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
  .row { display: flex; flex-wrap: wrap; gap: 24px; align-items: center; }
  iswc-spinner:not(:defined) { visibility: hidden; }
</style>
<script type="module">
  await import('../../../dist/cdn/feedback/spinner.min.js?h=y9b5s9');

  await customElements.whenDefined('iswc-spinner');
  document.documentElement.dataset.spinnerReady = '1';
</script>
</head>
<body>
<header>
  <h1>iswc-spinner</h1>
  <p>Anillo de carga animado. role=status + aria-live=polite + aria-label="Cargando". Personalizable: color, track-color, track-width, speed.</p>
</header>

<section>
  <h2>Default</h2>
  <div class="row">
    <iswc-spinner></iswc-spinner>
    <span>Cargando…</span>
  </div>
</section>

<section>
  <h2>Tamaños (vía style width/height)</h2>
  <div class="row">
    <iswc-spinner style="width:16px;height:16px;"></iswc-spinner>
    <iswc-spinner style="width:32px;height:32px;"></iswc-spinner>
    <iswc-spinner style="width:64px;height:64px;"></iswc-spinner>
  </div>
</section>

<section>
  <h2>Colores custom</h2>
  <div class="row">
    <iswc-spinner color="#7c3aed"></iswc-spinner>
    <iswc-spinner color="#10b981"></iswc-spinner>
    <iswc-spinner color="#f59e0b"></iswc-spinner>
    <iswc-spinner color="#ef4444"></iswc-spinner>
  </div>
</section>

<section>
  <h2>Velocidad lenta</h2>
  <iswc-spinner speed="3s"></iswc-spinner>
</section>
<script>
/* iswc-auto-rereload v2: backoff — polling client agnóstico del static server
 * W17: backoff exponencial + readyState wait + giveup tras MAX_FAILS fallos
 * consecutivos. Evita el loop infinito de reload-pin que vimos con Live
 * Server 5505 cuando el endpoint no responde. */
(function () {
  var tries = [
    'dist/cdn/reload-pin',
    '../dist/cdn/reload-pin',
    '../../dist/cdn/reload-pin',
    '../../../dist/cdn/reload-pin',
    '../../../../dist/cdn/reload-pin'
  ];
  var pinUrl = null;
  var last = null;
  var interval = 1500;          // arranca en 1.5s
  var MAX_INTERVAL = 30000;     // tope: 30s
  var MAX_FAILS = 6;            // tras 6 fallos consecutivos sin dev-server, dar up
  var fails = 0;
  var timer = 0;

  function poll() {
    if (!pinUrl) return;
    fetch(pinUrl, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw 0;
        return r.text();
      })
      .then(function (h) {
        h = h.trim();
        fails = 0;
        if (interval !== 1500) interval = 1500; // reset a 1.5s en éxito
        if (last !== null && last !== h) {
          location.reload();
          return;
        }
        last = h;
        schedule();
      })
      .catch(function () {
        fails++;
        if (fails >= MAX_FAILS) {
          // Sin dev-server o server muerto: dejar de gastar batería.
          if (timer) clearTimeout(timer);
          return;
        }
        // Backoff exponencial: 1.5s → 3s → 6s → 12s → 24s → 30s.
        interval = Math.min(interval * 2, MAX_INTERVAL);
        schedule();
      });
  }
  function schedule() {
    if (timer) clearTimeout(timer);
    timer = setTimeout(poll, interval);
  }
  function probe(i) {
    if (i >= tries.length) return; // sin dev-server activo, no hacer nada
    fetch(tries[i], { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw 0;
        pinUrl = tries[i];
        last = null;
        schedule();
      })
      .catch(function () { probe(i + 1); });
  }
  // Esperar a que la página esté lista antes de empezar (no quemar el
  // primer frame de CPU + red en una página que aún no pintó).
  function start() {
    if (document.readyState === 'complete') probe(0);
    else window.addEventListener('load', function () { probe(0); }, { once: true });
  }
  start();
})();
</script>
</body>
</html>
