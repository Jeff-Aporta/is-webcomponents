<!doctype html>
<html lang="es" class="theme-dark" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Demo <iswc-skeleton> · is-webcomponents</title>
<meta name="description" content="Demo de <iswc-skeleton>: placeholder con efectos sheen, pulse, none." />
<style>
  html, body { margin: 0; padding: 0; background: #0c1118; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { padding: 24px; display: grid; gap: 24px; }
  header h1 { font-size: 18px; margin: 0 0 4px; }
  header p  { font-size: 13px; color: #94a3b8; margin: 0; }
  section { background: #0f1620; border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 18px; }
  section h2 { font-size: 14px; margin: 0 0 12px; color: #94a3b8; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
  .row { display: flex; flex-direction: column; gap: 12px; max-width: 420px; }
  .text-row { display: flex; gap: 8px; align-items: center; }
  iswc-skeleton:not(:defined) { visibility: hidden; }
</style>
<script type="module">
  await import('../../../dist/cdn/feedback/skeleton.min.js?h=bzxy9w');

  await customElements.whenDefined('iswc-skeleton');
  document.documentElement.dataset.skeletonReady = '1';
</script>
</head>
<body>
<header>
  <h1>iswc-skeleton</h1>
  <p>Placeholder de carga. Efectos: <code>sheen</code> (default, gradiente deslizante), <code>pulse</code> (respiración), <code>none</code> (estático).</p>
</header>

<section>
  <h2>Efectos</h2>
  <div class="row">
    <h3 style="margin:0;font-size:14px;">sheen (default)</h3>
    <iswc-skeleton style="height:18px;width:100%;"></iswc-skeleton>
    <iswc-skeleton style="height:18px;width:80%;"></iswc-skeleton>
    <iswc-skeleton style="height:18px;width:60%;"></iswc-skeleton>
  </div>
</section>

<section>
  <h2>pulse</h2>
  <div class="row">
    <iswc-skeleton effect="pulse" style="height:60px;width:100%;border-radius:8px;"></iswc-skeleton>
    <iswc-skeleton effect="pulse" style="height:60px;width:60%;border-radius:8px;"></iswc-skeleton>
  </div>
</section>

<section>
  <h2>none (estático)</h2>
  <div class="row">
    <iswc-skeleton effect="none" style="height:14px;width:100%;"></iswc-skeleton>
  </div>
</section>

<section>
  <h2>Tarjeta con varios skeletons</h2>
  <div class="row" style="border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:16px;gap:12px;">
    <div class="text-row">
      <iswc-skeleton style="height:48px;width:48px;border-radius:50%;display:inline-block;"></iswc-skeleton>
      <div style="flex:1;display:flex;flex-direction:column;gap:6px;">
        <iswc-skeleton style="height:14px;width:40%;"></iswc-skeleton>
        <iswc-skeleton style="height:14px;width:70%;"></iswc-skeleton>
      </div>
    </div>
    <iswc-skeleton style="height:120px;width:100%;border-radius:6px;"></iswc-skeleton>
  </div>
</section>
<script>
/* iswc-auto-rereload v2: backoff — polling client agnóstico del static server
 * W17: backoff exponencial + readyState wait + giveup tras MAX_FAILS fallos
 * consecutivos. Evita el loop infinito de reload-pin que vimos con Live
 * Server 5505 cuando el endpoint no responde. */
(function () {
  var tries = [
    'dist/cdn/reload-pin',
    '../dist/cdn/reload-pin',
    '../../dist/cdn/reload-pin',
    '../../../dist/cdn/reload-pin',
    '../../../../dist/cdn/reload-pin'
  ];
  var pinUrl = null;
  var last = null;
  var interval = 1500;          // arranca en 1.5s
  var MAX_INTERVAL = 30000;     // tope: 30s
  var MAX_FAILS = 6;            // tras 6 fallos consecutivos sin dev-server, dar up
  var fails = 0;
  var timer = 0;

  function poll() {
    if (!pinUrl) return;
    fetch(pinUrl, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw 0;
        return r.text();
      })
      .then(function (h) {
        h = h.trim();
        fails = 0;
        if (interval !== 1500) interval = 1500; // reset a 1.5s en éxito
        if (last !== null && last !== h) {
          location.reload();
          return;
        }
        last = h;
        schedule();
      })
      .catch(function () {
        fails++;
        if (fails >= MAX_FAILS) {
          // Sin dev-server o server muerto: dejar de gastar batería.
          if (timer) clearTimeout(timer);
          return;
        }
        // Backoff exponencial: 1.5s → 3s → 6s → 12s → 24s → 30s.
        interval = Math.min(interval * 2, MAX_INTERVAL);
        schedule();
      });
  }
  function schedule() {
    if (timer) clearTimeout(timer);
    timer = setTimeout(poll, interval);
  }
  function probe(i) {
    if (i >= tries.length) return; // sin dev-server activo, no hacer nada
    fetch(tries[i], { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw 0;
        pinUrl = tries[i];
        last = null;
        schedule();
      })
      .catch(function () { probe(i + 1); });
  }
  // Esperar a que la página esté lista antes de empezar (no quemar el
  // primer frame de CPU + red en una página que aún no pintó).
  function start() {
    if (document.readyState === 'complete') probe(0);
    else window.addEventListener('load', function () { probe(0); }, { once: true });
  }
  start();
})();
</script>
</body>
</html>
