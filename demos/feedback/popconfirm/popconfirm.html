<!doctype html>
<html lang="es" class="theme-dark" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Demo <iswc-popconfirm> · iswc-root</title>
<meta name="description" content="Demo de <iswc-popconfirm>: confirmación emergente anclada, sin backdrop modal." />
<style>
  html, body { margin: 0; padding: 0; background: #0c1118; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { padding: 24px; display: grid; gap: 24px; }
  header h1 { font-size: 18px; margin: 0 0 4px; }
  header p  { font-size: 13px; color: #94a3b8; margin: 0; }
  section { background: #0f1620; border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 18px; display: grid; gap: 12px; }
  section h2 { font-size: 14px; margin: 0; color: #94a3b8; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
  button { background: #1a2532; color: #e2e8f0; border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 8px 12px; cursor: pointer; font: inherit; }
  button:hover { background: #25303f; }
  iswc-popconfirm:not(:defined) { visibility: hidden; }
</style>
<script type="module">
  await import('../../../dist/cdn/feedback/popconfirm.min.js?v=5w45lb');

  await customElements.whenDefined('iswc-popconfirm');
  document.documentElement.dataset.popconfirmReady = '1';
</script>
</head>
<body>
<header>
  <h1>iswc-popconfirm</h1>
  <p>Confirmación emergente anclada a un disparador. Sin modal de fondo. Cierre por Escape, click fuera (excluyendo el trigger), o botón cancel/confirm.</p>
</header>

<section>
  <h2>Popconfirm básico</h2>
  <button title="Borrar" id="trig-1" type="button">Borrar</button>
  <iswc-popconfirm for="trig-1" message="¿Seguro que quieres borrar este elemento?"></iswc-popconfirm>
</section>

<section>
  <h2>Placement top-end + slots custom</h2>
  <button title="Publicar" id="trig-2" type="button">Publicar</button>
  <iswc-popconfirm for="trig-2" placement="top-end" message="Confirmar publicación">
    <button title="Atrás" slot="cancel" type="button">Atrás</button>
    <button title="Confirmar" slot="confirm" type="button">Confirmar</button>
  </iswc-popconfirm>
</section>

<section>
  <h2>Apertura programática (<code>el.show()</code>)</h2>
  <button title="Lanzar" id="trig-3" type="button">Lanzar</button>
  <iswc-popconfirm id="pop-3" placement="bottom-end" message="Modal programático" hide-arrow>
    <span slot="confirm" role="button" tabindex="0">OK</span>
  </iswc-popconfirm>
  <script type="module">
    document.getElementById('trig-3').addEventListener('click', () => {
      document.getElementById('pop-3').show();
    });
  </script>
</section>
<script>
/* iswc-auto-rereload v2: backoff — polling client agnóstico del static server
 * W17: backoff exponencial + readyState wait + giveup tras MAX_FAILS fallos
 * consecutivos. Evita el loop infinito de reload-pin que vimos con Live
 * Server 5505 cuando el endpoint no responde. */
(function () {
  var tries = [
    'dist/cdn/reload-pin',
    '../dist/cdn/reload-pin',
    '../../dist/cdn/reload-pin',
    '../../../dist/cdn/reload-pin',
    '../../../../dist/cdn/reload-pin'
  ];
  var pinUrl = null;
  var last = null;
  var interval = 1500;          // arranca en 1.5s
  var MAX_INTERVAL = 30000;     // tope: 30s
  var MAX_FAILS = 6;            // tras 6 fallos consecutivos sin dev-server, dar up
  var fails = 0;
  var timer = 0;

  function poll() {
    if (!pinUrl) return;
    fetch(pinUrl, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw 0;
        return r.text();
      })
      .then(function (h) {
        h = h.trim();
        fails = 0;
        if (interval !== 1500) interval = 1500; // reset a 1.5s en éxito
        if (last !== null && last !== h) {
          location.reload();
          return;
        }
        last = h;
        schedule();
      })
      .catch(function () {
        fails++;
        if (fails >= MAX_FAILS) {
          // Sin dev-server o server muerto: dejar de gastar batería.
          if (timer) clearTimeout(timer);
          return;
        }
        // Backoff exponencial: 1.5s → 3s → 6s → 12s → 24s → 30s.
        interval = Math.min(interval * 2, MAX_INTERVAL);
        schedule();
      });
  }
  function schedule() {
    if (timer) clearTimeout(timer);
    timer = setTimeout(poll, interval);
  }
  function probe(i) {
    if (i >= tries.length) return; // sin dev-server activo, no hacer nada
    fetch(tries[i], { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw 0;
        pinUrl = tries[i];
        last = null;
        schedule();
      })
      .catch(function () { probe(i + 1); });
  }
  // Esperar a que la página esté lista antes de empezar (no quemar el
  // primer frame de CPU + red en una página que aún no pintó).
  function start() {
    if (document.readyState === 'complete') probe(0);
    else window.addEventListener('load', function () { probe(0); }, { once: true });
  }
  start();
})();
</script>
</body>
</html>
