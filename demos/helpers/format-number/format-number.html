<!doctype html>
<html lang="es" class="theme-dark" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title><iswc-format-number> · is-webcomponents</title>
<meta name="description" content="Demo del helper <iswc-format-number>: Intl.NumberFormat con decimal/currency/percent/unit + pad-start." />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0c1118; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; }
  header {
    padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.1);
    background: #0f1620;
  }
  header h1 { font-size: 16px; font-weight: 700; margin: 0; }
  header p { font-size: 12px; color: #94a3b8; margin: 6px 0 0; }
  header code { background: rgba(255,255,255,0.06); padding: 2px 6px; border-radius: 4px; font: 12px ui-monospace, Menlo, Consolas, monospace; }
  main { padding: 16px 20px; display: grid; gap: 8px; align-content: start; }
  .row { display: grid; grid-template-columns: 360px 1fr; gap: 12px; align-items: baseline; }
  .row code { color: #94a3b8; font-size: 12px; }
  iswc-format-number:not(:defined) { visibility: hidden; }
</style>
<script type="module">
  await import('../../../dist/cdn/helpers/format-number.min.js?h=hdone3');
  await customElements.whenDefined('iswc-format-number');

  const cases = [
    { value: '1234.5' },
    { value: '1234567.89' },
    { value: '1234567', 'minimum-fraction-digits': '2', 'maximum-fraction-digits': '2' },
    { value: '0.42', type: 'percent' },
    { value: '99.5', type: 'currency', currency: 'USD' },
    { value: '99.5', type: 'currency', currency: 'EUR', locale: 'es-ES' },
    { value: '99.5', type: 'currency', currency: 'COP', locale: 'es-CO' },
    { value: '42', type: 'unit', unit: 'celsius' },
    { value: '7', 'pad-length': '4' },
    { value: '42', 'pad-length': '6', 'pad-start': '0' },
    { value: '1234', locale: 'es-CO' },
    { value: '1234', locale: 'en-US' },
  ];
  const main = document.querySelector('main');
  for (const c of cases) {
    const row = document.createElement('div');
    row.className = 'row';
    const label = document.createElement('code');
    const attrs = Object.entries(c).map(([k, v]) => `${k}=${JSON.stringify(v)}`).join(' ');
    label.textContent = `<iswc-format-number ${attrs}>`;
    const el = document.createElement('iswc-format-number');
    for (const [k, v] of Object.entries(c)) el.setAttribute(k, String(v));
    row.append(label, el);
    main.appendChild(row);
  }

  document.documentElement.dataset.formatNumberReady = '1';
</script>
</head>
<body>
<header>
  <h1><iswc-format-number> — Intl.NumberFormat + presets</h1>
  <p>Atributos: <code>value</code> <code>type</code> <code>currency</code> <code>locale</code> <code>minimum-fraction-digits</code> <code>maximum-fraction-digits</code> <code>pad-start</code> <code>pad-length</code></p>
</header>
<main></main>
<script>
/* iswc-auto-rereload v2: backoff — polling client agnóstico del static server
 * W17: backoff exponencial + readyState wait + giveup tras MAX_FAILS fallos
 * consecutivos. Evita el loop infinito de reload-pin que vimos con Live
 * Server 5505 cuando el endpoint no responde. */
(function () {
  var tries = [
    'dist/cdn/reload-pin',
    '../dist/cdn/reload-pin',
    '../../dist/cdn/reload-pin',
    '../../../dist/cdn/reload-pin',
    '../../../../dist/cdn/reload-pin'
  ];
  var pinUrl = null;
  var last = null;
  var interval = 1500;          // arranca en 1.5s
  var MAX_INTERVAL = 30000;     // tope: 30s
  var MAX_FAILS = 6;            // tras 6 fallos consecutivos sin dev-server, dar up
  var fails = 0;
  var timer = 0;

  function poll() {
    if (!pinUrl) return;
    fetch(pinUrl, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw 0;
        return r.text();
      })
      .then(function (h) {
        h = h.trim();
        fails = 0;
        if (interval !== 1500) interval = 1500; // reset a 1.5s en éxito
        if (last !== null && last !== h) {
          location.reload();
          return;
        }
        last = h;
        schedule();
      })
      .catch(function () {
        fails++;
        if (fails >= MAX_FAILS) {
          // Sin dev-server o server muerto: dejar de gastar batería.
          if (timer) clearTimeout(timer);
          return;
        }
        // Backoff exponencial: 1.5s → 3s → 6s → 12s → 24s → 30s.
        interval = Math.min(interval * 2, MAX_INTERVAL);
        schedule();
      });
  }
  function schedule() {
    if (timer) clearTimeout(timer);
    timer = setTimeout(poll, interval);
  }
  function probe(i) {
    if (i >= tries.length) return; // sin dev-server activo, no hacer nada
    fetch(tries[i], { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw 0;
        pinUrl = tries[i];
        last = null;
        schedule();
      })
      .catch(function () { probe(i + 1); });
  }
  // Esperar a que la página esté lista antes de empezar (no quemar el
  // primer frame de CPU + red en una página que aún no pintó).
  function start() {
    if (document.readyState === 'complete') probe(0);
    else window.addEventListener('load', function () { probe(0); }, { once: true });
  }
  start();
})();
</script>
</body>
</html>
