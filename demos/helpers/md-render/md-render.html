<!doctype html>
<html lang="es" class="theme-dark" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title><iswc-md-render> · is-webcomponents</title>
<meta name="description" content="Demo del helper <iswc-md-render>: render inline de markdown/HTML + chips {{var}}. Con can-edit edita in-place." />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0c1118; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; }
  header {
    padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.1);
    background: #0f1620;
  }
  header h1 { font-size: 16px; font-weight: 700; margin: 0; }
  header p { font-size: 12px; color: #94a3b8; margin: 6px 0 0; }
  header code { background: rgba(255,255,255,0.06); padding: 2px 6px; border-radius: 4px; font: 12px ui-monospace, Menlo, Consolas, monospace; }
  main { padding: 16px 20px; display: grid; gap: 14px; align-content: start; }
  section { display: grid; gap: 6px; }
  section h2 { font-size: 13px; font-weight: 600; color: #94a3b8; margin: 0; text-transform: uppercase; letter-spacing: 0.04em; }
  section .desc { color: #94a3b8; font-size: 12px; }
  iswc-md-render:not(:defined) { visibility: hidden; }
  iswc-md-render { display: block; padding: 10px 12px; background: #0f1620; border: 1px solid rgba(255,255,255,0.06); border-radius: 6px; }
</style>
<script type="module">
  await import('../../../dist/cdn/helpers/md-render.min.js?h=qqzptm');
  await customElements.whenDefined('iswc-md-render');

  const main = document.querySelector('main');

  function addSection(title, desc, builder) {
    const sec = document.createElement('section');
    const h2 = document.createElement('h2');
    h2.textContent = title;
    sec.appendChild(h2);
    if (desc) {
      const d = document.createElement('span');
      d.className = 'desc';
      d.textContent = desc;
      sec.appendChild(d);
    }
    builder(sec);
    main.appendChild(sec);
  }

  // 1) Solo lectura con value markdown
  addSection('Solo lectura · markdown', 'value con markdown → HTML renderizado', (sec) => {
    const el = document.createElement('iswc-md-render');
    el.value = '# Título\n\nHola **mundo** y *cursiva* con `código`.';
    sec.appendChild(el);
  });

  // 2) Solo lectura con chips de variables {{var}}
  addSection('Solo lectura · chips {{var}}', '{{nombre}} se renderiza como chip', (sec) => {
    const el = document.createElement('iswc-md-render');
    el.value = 'Hola {{nombre}}, tu **pedido #{{id}}** está listo.';
    sec.appendChild(el);
  });

  // 3) Vacío (placeholder)
  addSection('Solo lectura · vacío', 'value="" muestra placeholder', (sec) => {
    const el = document.createElement('iswc-md-render');
    el.placeholder = 'Sin contenido aún';
    sec.appendChild(el);
  });

  // 4) Hidratado desde <script type="text/markdown">
  addSection('Hidratado · <script type="text/markdown">', 'value implícito desde hijo', (sec) => {
    const el = document.createElement('iswc-md-render');
    const s = document.createElement('script');
    s.type = 'text/markdown';
    s.textContent = 'Lista:\n\n- item A\n- item B\n- item C';
    el.appendChild(s);
    sec.appendChild(el);
  });

  // 5) can-edit: editable in-place
  addSection('can-edit · editable', 'contenteditable, eventos iswc-input / iswc-change', (sec) => {
    const el = document.createElement('iswc-md-render');
    el.setAttribute('can-edit', '');
    el.value = 'Edita este texto y verás eventos **iswc-input**.';
    sec.appendChild(el);
    el.addEventListener('iswc-input', (e) => console.log('[md-render] iswc-input', e.detail?.value?.slice(0, 40)));
    el.addEventListener('iswc-change', (e) => console.log('[md-render] iswc-change', e.detail?.value?.slice(0, 40)));
  });

  // 6) readonly: combina con can-edit, gana readonly
  addSection('readonly · bloquea edición', 'can-edit + readonly → readonly gana', (sec) => {
    const el = document.createElement('iswc-md-render');
    el.setAttribute('can-edit', '');
    el.setAttribute('readonly', '');
    el.value = 'Esto NO debe ser editable.';
    sec.appendChild(el);
  });

  document.documentElement.dataset.mdRenderReady = '1';
</script>
</head>
<body>
<header>
  <h1><iswc-md-render> — render markdown con chips</h1>
  <p>Atributos: <code>value</code> <code>can-edit</code> <code>readonly</code> <code>placeholder</code>. Eventos: <code>iswc-input</code> <code>iswc-change</code>.</p>
</header>
<main></main>
<script>
/* iswc-auto-rereload v2: backoff — polling client agnóstico del static server
 * W17: backoff exponencial + readyState wait + giveup tras MAX_FAILS fallos
 * consecutivos. Evita el loop infinito de reload-pin que vimos con Live
 * Server 5505 cuando el endpoint no responde. */
(function () {
  var tries = [
    'dist/cdn/reload-pin',
    '../dist/cdn/reload-pin',
    '../../dist/cdn/reload-pin',
    '../../../dist/cdn/reload-pin',
    '../../../../dist/cdn/reload-pin'
  ];
  var pinUrl = null;
  var last = null;
  var interval = 1500;          // arranca en 1.5s
  var MAX_INTERVAL = 30000;     // tope: 30s
  var MAX_FAILS = 6;            // tras 6 fallos consecutivos sin dev-server, dar up
  var fails = 0;
  var timer = 0;

  function poll() {
    if (!pinUrl) return;
    fetch(pinUrl, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw 0;
        return r.text();
      })
      .then(function (h) {
        h = h.trim();
        fails = 0;
        if (interval !== 1500) interval = 1500; // reset a 1.5s en éxito
        if (last !== null && last !== h) {
          location.reload();
          return;
        }
        last = h;
        schedule();
      })
      .catch(function () {
        fails++;
        if (fails >= MAX_FAILS) {
          // Sin dev-server o server muerto: dejar de gastar batería.
          if (timer) clearTimeout(timer);
          return;
        }
        // Backoff exponencial: 1.5s → 3s → 6s → 12s → 24s → 30s.
        interval = Math.min(interval * 2, MAX_INTERVAL);
        schedule();
      });
  }
  function schedule() {
    if (timer) clearTimeout(timer);
    timer = setTimeout(poll, interval);
  }
  function probe(i) {
    if (i >= tries.length) return; // sin dev-server activo, no hacer nada
    fetch(tries[i], { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw 0;
        pinUrl = tries[i];
        last = null;
        schedule();
      })
      .catch(function () { probe(i + 1); });
  }
  // Esperar a que la página esté lista antes de empezar (no quemar el
  // primer frame de CPU + red en una página que aún no pintó).
  function start() {
    if (document.readyState === 'complete') probe(0);
    else window.addEventListener('load', function () { probe(0); }, { once: true });
  }
  start();
})();
</script>
</body>
</html>
