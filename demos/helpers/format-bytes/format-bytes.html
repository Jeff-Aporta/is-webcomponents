<!doctype html>
<html lang="es" class="theme-dark" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title><iswc-format-bytes> · is-webcomponents</title>
<meta name="description" content="Demo del helper <iswc-format-bytes>: formatea tamaños de archivo legibles (B/KB/MB/GB) con Intl.NumberFormat unit." />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0c1118; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; }
  header {
    padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.1);
    display: flex; align-items: center; gap: 14px; background: #0f1620;
  }
  header h1 { font-size: 16px; font-weight: 700; margin: 0; }
  header p { font-size: 12px; color: #94a3b8; margin: 0; }
  header code { background: rgba(255,255,255,0.06); padding: 2px 6px; border-radius: 4px; font: 12px ui-monospace, Menlo, Consolas, monospace; }
  main { padding: 16px 20px; display: grid; gap: 10px; align-content: start; }
  .row { display: grid; grid-template-columns: 220px 1fr; gap: 12px; align-items: baseline; }
  .row code { color: #94a3b8; font-size: 12px; }
  .row iswc-format-bytes { font-size: 14px; }
  iswc-format-bytes:not(:defined) { visibility: hidden; }
</style>
<script type="module">
  await import('../../../dist/cdn/helpers/format-bytes.min.js?h=ien3jg');
  await customElements.whenDefined('iswc-format-bytes');

  const cases = [
    { value: '0', display: 'short' },
    { value: '512', display: 'short' },
    { value: '1024', display: 'short' },
    { value: '1536', display: 'short' },
    { value: '1048576', display: 'short' },
    { value: '1073741824', display: 'short' },
    { value: '1048576', unit: 'megabyte', display: 'short' },
    { value: '1048576', display: 'long' },
    { value: '1048576', display: 'long', autofit: true },
    { value: '200000', display: 'short', autofit: true },
    { value: '1500000', display: 'short', autofit: true },
    { value: '-2048', display: 'short' },
    { value: '4096', display: 'short', locale: 'es-CO' },
    { value: '4096', display: 'short', locale: 'en-US' },
  ];
  const main = document.querySelector('main');
  for (const c of cases) {
    const row = document.createElement('div');
    row.className = 'row';
    const label = document.createElement('code');
    const attrs = Object.entries(c).map(([k, v]) => `${k}=${JSON.stringify(v)}`).join(' ');
    label.textContent = `<iswc-format-bytes ${attrs}>`;
    const el = document.createElement('iswc-format-bytes');
    for (const [k, v] of Object.entries(c)) el.setAttribute(k, String(v));
    row.append(label, el);
    main.appendChild(row);
  }

  document.documentElement.dataset.formatBytesReady = '1';
</script>
</head>
<body>
<header>
  <div>
    <h1><iswc-format-bytes> — tamaños de archivo legibles</h1>
    <p>Atributos: <code>value</code> <code>unit</code> <code>display</code> <code>locale</code> <code>autofit</code></p>
  </div>
</header>
<main></main>
<script>
/* iswc-auto-reload: do not remove — polling client agnóstico del static server */
(function () {
  var tries = [
    'dist/cdn/reload-pin',
    '../dist/cdn/reload-pin',
    '../../dist/cdn/reload-pin',
    '../../../dist/cdn/reload-pin',
    '../../../../dist/cdn/reload-pin'
  ];
  var pinUrl = null;
  var last = null;
  function poll() {
    if (!pinUrl) return;
    fetch(pinUrl, { cache: 'no-store' })
      .then(function (r) { return r.text(); })
      .then(function (h) {
        h = h.trim();
        if (last !== null && last !== h) location.reload();
        last = h;
      })
      .catch(function () {});
  }
  function probe(i) {
    if (i >= tries.length) return; // sin dev-server activo, no hacer nada
    fetch(tries[i], { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw 0;
        pinUrl = tries[i];
        setInterval(poll, 1500);
      })
      .catch(function () { probe(i + 1); });
  }
  probe(0);
})();
</script>
</body>
</html>
