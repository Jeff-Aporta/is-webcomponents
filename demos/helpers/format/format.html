<!doctype html>
<html lang="es" class="theme-dark" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title><is-format> · is-webcomponents</title>
<meta name="description" content="Demo del helper <is-format>: switch universal entre date/number/bytes/relative/text con presets Excel-like." />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0c1118; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; }
  header {
    padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.1);
    background: #0f1620;
  }
  header h1 { font-size: 16px; font-weight: 700; margin: 0; }
  header p { font-size: 12px; color: #94a3b8; margin: 6px 0 0; }
  header code { background: rgba(255,255,255,0.06); padding: 2px 6px; border-radius: 4px; font: 12px ui-monospace, Menlo, Consolas, monospace; }
  main { padding: 16px 20px; display: grid; gap: 8px; align-content: start; }
  .row { display: grid; grid-template-columns: 380px 1fr; gap: 12px; align-items: baseline; }
  .row code { color: #94a3b8; font-size: 12px; }
  section { margin-top: 14px; }
  section h2 { font-size: 13px; font-weight: 600; color: #94a3b8; margin: 0 0 6px; text-transform: uppercase; letter-spacing: 0.04em; }
  is-format:not(:defined) { visibility: hidden; }
</style>
<script type="module">
  await import('../../../dist/cdn/helpers/format.min.js');
  await customElements.whenDefined('is-format');

  const main = document.querySelector('main');

  function addSection(title, cases) {
    const sec = document.createElement('section');
    const h2 = document.createElement('h2');
    h2.textContent = title;
    sec.appendChild(h2);
    for (const c of cases) {
      const row = document.createElement('div');
      row.className = 'row';
      const label = document.createElement('code');
      const attrs = Object.entries(c).map(([k, v]) => `${k}=${typeof v === 'string' ? JSON.stringify(v) : ''}`).join(' ');
      label.textContent = `<is-format ${attrs}>`;
      const el = document.createElement('is-format');
      for (const [k, v] of Object.entries(c)) {
        if (v === true) el.setAttribute(k, '');
        else el.setAttribute(k, String(v));
      }
      row.append(label, el);
      sec.appendChild(row);
    }
    main.appendChild(sec);
  }

  addSection('DATE', [
    { type: 'date', value: '2026-08-15' },
    { type: 'date', value: '2026-08-15', pattern: 'yyyy-mm-dd' },
    { type: 'date', value: '2026-08-15', pattern: 'dd/mm/yyyy' },
    { type: 'date', value: '2026-08-15', pattern: 'd-mmm-yyyy' },
    { type: 'date', value: '2026-08-15', pattern: 'dddd, mmmm d, yyyy' },
    { type: 'date', value: '2026-08-15', pattern: 'h:mm am/pm' },
  ]);

  addSection('NUMBER', [
    { type: 'number', value: '1234.5' },
    { type: 'number', value: '1234.5', pattern: '#,##0.00' },
    { type: 'number', value: '1234.5', pattern: '0.00' },
    { type: 'number', value: '0.42', format: 'percent' },
    { type: 'number', value: '99.5', format: 'currency', currency: 'USD' },
    { type: 'number', value: '99.5', format: 'currency', currency: 'EUR' },
    { type: 'number', value: '99.5', pattern: 'accounting' },
    { type: 'number', value: '0.5', pattern: '# ?/?' },
  ]);

  addSection('BYTES', [
    { type: 'bytes', value: '0' },
    { type: 'bytes', value: '1024' },
    { type: 'bytes', value: '1048576' },
    { type: 'bytes', value: '1048576', display: 'long' },
    { type: 'bytes', value: '200000', autofit: true },
  ]);

  addSection('RELATIVE', [
    { type: 'relative', date: '2026-08-15', sync: true }, // futuro
    { type: 'relative', date: '2026-08-14' },             // ayer
    { type: 'relative', date: '2026-08-12', format: 'short' },
    { type: 'relative', date: '2026-08-15', format: 'narrow' },
  ]);

  addSection('TEXT', [
    { type: 'text', value: 'hola mundo' },
    { type: 'text', value: 'hola mundo', case: 'upper' },
    { type: 'text', value: 'HOLA MUNDO', case: 'lower' },
    { type: 'text', value: 'hola mundo', case: 'title' },
    { type: 'text', value: 'este texto se trunca a diez', truncate: '10' },
    { type: 'text', value: '42', 'pad-length': '6', 'pad-start': '0' },
  ]);

  document.documentElement.dataset.formatReady = '1';
</script>
</head>
<body>
<header>
  <h1><is-format> — formateo universal con presets Excel</h1>
  <p>Atributos: <code>type</code> <code>value</code> <code>date</code> <code>pattern</code> <code>format</code> <code>currency</code> <code>locale</code> <code>case</code> <code>truncate</code> <code>pad-start</code>/<code>pad-length</code> <code>sync</code></p>
</header>
<main></main>
</body>
</html>
