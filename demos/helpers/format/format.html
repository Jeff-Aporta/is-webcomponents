<!doctype html>
<html lang="es" class="theme-dark" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title><iswc-format> · is-webcomponents</title>
<meta name="description" content="Demo del helper <iswc-format>: switch universal entre date/number/bytes/relative/text con presets Excel-like." />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0c1118; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; }
  header {
    padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.1);
    background: #0f1620;
  }
  header h1 { font-size: 16px; font-weight: 700; margin: 0; }
  header p { font-size: 12px; color: #94a3b8; margin: 6px 0 0; }
  header code { background: rgba(255,255,255,0.06); padding: 2px 6px; border-radius: 4px; font: 12px ui-monospace, Menlo, Consolas, monospace; }
  main { padding: 16px 20px; display: grid; gap: 8px; align-content: start; }
  .row { display: grid; grid-template-columns: 380px 1fr; gap: 12px; align-items: baseline; }
  .row code { color: #94a3b8; font-size: 12px; }
  section { margin-top: 14px; }
  section h2 { font-size: 13px; font-weight: 600; color: #94a3b8; margin: 0 0 6px; text-transform: uppercase; letter-spacing: 0.04em; }
  iswc-format:not(:defined) { visibility: hidden; }
</style>
<script type="module">
  await import('../../../dist/cdn/helpers/format.min.js?h=k11fp1');
  await customElements.whenDefined('iswc-format');

  const main = document.querySelector('main');

  function addSection(title, cases) {
    const sec = document.createElement('section');
    const h2 = document.createElement('h2');
    h2.textContent = title;
    sec.appendChild(h2);
    for (const c of cases) {
      const row = document.createElement('div');
      row.className = 'row';
      const label = document.createElement('code');
      const attrs = Object.entries(c).map(([k, v]) => `${k}=${typeof v === 'string' ? JSON.stringify(v) : ''}`).join(' ');
      label.textContent = `<iswc-format ${attrs}>`;
      const el = document.createElement('iswc-format');
      for (const [k, v] of Object.entries(c)) {
        if (v === true) el.setAttribute(k, '');
        else el.setAttribute(k, String(v));
      }
      row.append(label, el);
      sec.appendChild(row);
    }
    main.appendChild(sec);
  }

  addSection('DATE', [
    { type: 'date', value: '2026-08-15' },
    { type: 'date', value: '2026-08-15', pattern: 'yyyy-mm-dd' },
    { type: 'date', value: '2026-08-15', pattern: 'dd/mm/yyyy' },
    { type: 'date', value: '2026-08-15', pattern: 'd-mmm-yyyy' },
    { type: 'date', value: '2026-08-15', pattern: 'dddd, mmmm d, yyyy' },
    { type: 'date', value: '2026-08-15', pattern: 'h:mm am/pm' },
  ]);

  addSection('NUMBER', [
    { type: 'number', value: '1234.5' },
    { type: 'number', value: '1234.5', pattern: '#,##0.00' },
    { type: 'number', value: '1234.5', pattern: '0.00' },
    { type: 'number', value: '0.42', format: 'percent' },
    { type: 'number', value: '99.5', format: 'currency', currency: 'USD' },
    { type: 'number', value: '99.5', format: 'currency', currency: 'EUR' },
    { type: 'number', value: '99.5', pattern: 'accounting' },
    { type: 'number', value: '0.5', pattern: '# ?/?' },
  ]);

  addSection('BYTES', [
    { type: 'bytes', value: '0' },
    { type: 'bytes', value: '1024' },
    { type: 'bytes', value: '1048576' },
    { type: 'bytes', value: '1048576', display: 'long' },
    { type: 'bytes', value: '200000', autofit: true },
  ]);

  addSection('RELATIVE', [
    { type: 'relative', date: '2026-08-15', sync: true }, // futuro
    { type: 'relative', date: '2026-08-14' },             // ayer
    { type: 'relative', date: '2026-08-12', format: 'short' },
    { type: 'relative', date: '2026-08-15', format: 'narrow' },
  ]);

  addSection('TEXT', [
    { type: 'text', value: 'hola mundo' },
    { type: 'text', value: 'hola mundo', case: 'upper' },
    { type: 'text', value: 'HOLA MUNDO', case: 'lower' },
    { type: 'text', value: 'hola mundo', case: 'title' },
    { type: 'text', value: 'este texto se trunca a diez', truncate: '10' },
    { type: 'text', value: '42', 'pad-length': '6', 'pad-start': '0' },
  ]);

  document.documentElement.dataset.formatReady = '1';
</script>
</head>
<body>
<header>
  <h1><iswc-format> — formateo universal con presets Excel</h1>
  <p>Atributos: <code>type</code> <code>value</code> <code>date</code> <code>pattern</code> <code>format</code> <code>currency</code> <code>locale</code> <code>case</code> <code>truncate</code> <code>pad-start</code>/<code>pad-length</code> <code>sync</code></p>
</header>
<main></main>
<script>
/* iswc-auto-rereload v2: backoff — polling client agnóstico del static server
 * W17: backoff exponencial + readyState wait + giveup tras MAX_FAILS fallos
 * consecutivos. Evita el loop infinito de reload-pin que vimos con Live
 * Server 5505 cuando el endpoint no responde. */
(function () {
  var tries = [
    'dist/cdn/reload-pin',
    '../dist/cdn/reload-pin',
    '../../dist/cdn/reload-pin',
    '../../../dist/cdn/reload-pin',
    '../../../../dist/cdn/reload-pin'
  ];
  var pinUrl = null;
  var last = null;
  var interval = 1500;          // arranca en 1.5s
  var MAX_INTERVAL = 30000;     // tope: 30s
  var MAX_FAILS = 6;            // tras 6 fallos consecutivos sin dev-server, dar up
  var fails = 0;
  var timer = 0;

  function poll() {
    if (!pinUrl) return;
    fetch(pinUrl, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw 0;
        return r.text();
      })
      .then(function (h) {
        h = h.trim();
        fails = 0;
        if (interval !== 1500) interval = 1500; // reset a 1.5s en éxito
        if (last !== null && last !== h) {
          location.reload();
          return;
        }
        last = h;
        schedule();
      })
      .catch(function () {
        fails++;
        if (fails >= MAX_FAILS) {
          // Sin dev-server o server muerto: dejar de gastar batería.
          if (timer) clearTimeout(timer);
          return;
        }
        // Backoff exponencial: 1.5s → 3s → 6s → 12s → 24s → 30s.
        interval = Math.min(interval * 2, MAX_INTERVAL);
        schedule();
      });
  }
  function schedule() {
    if (timer) clearTimeout(timer);
    timer = setTimeout(poll, interval);
  }
  function probe(i) {
    if (i >= tries.length) return; // sin dev-server activo, no hacer nada
    fetch(tries[i], { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw 0;
        pinUrl = tries[i];
        last = null;
        schedule();
      })
      .catch(function () { probe(i + 1); });
  }
  // Esperar a que la página esté lista antes de empezar (no quemar el
  // primer frame de CPU + red en una página que aún no pintó).
  function start() {
    if (document.readyState === 'complete') probe(0);
    else window.addEventListener('load', function () { probe(0); }, { once: true });
  }
  start();
})();
</script>
</body>
</html>
