<!doctype html>
<html lang="es" class="theme-dark" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>&lt;iswc-pie-chart&gt; · demo</title>
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #0c1118; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; }
  header { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); background: #0f1620; }
  header h1 { font-size: 16px; font-weight: 700; margin: 0; }
  header p { font-size: 12px; color: #94a3b8; margin: 4px 0 0 0; }
  main { display: grid; place-items: center; padding: 20px; min-height: 0; }
  iswc-pie-chart { width: 720px; height: 360px; }
  iswc-pie-chart:not(:defined) { visibility: hidden; }
</style>
<script type="module">
  // Carga el bundle pre-compilado. pie-chart.min.js importa transitivamente
  // chart.min.js + marks-radial.min.js.
  await import('../../../dist/cdn/data-viz/pie-chart.min.js?h=bbdl82');
  await customElements.whenDefined('iswc-pie-chart');

  const chart = document.createElement('iswc-pie-chart');
  chart.setAttribute('label', 'Distribución del tráfico');
  chart.payload = {
    type: 'pie',
    data: {
      labels: ['Orgánico', 'Directo', 'Social', 'Referral', 'Email'],
      datasets: [{
        label: 'Sesiones',
        data: [420, 310, 260, 145, 95],
      }],
    },
  };

  document.querySelector('main').appendChild(chart);
  document.documentElement.dataset.pieChartReady = '1';
</script>
</head>
<body>
<header>
  <h1>&lt;iswc-pie-chart&gt;</h1>
  <p>Wrapper de <code>&lt;iswc-chart&gt;</code> con tipo fijo <code>pie</code>. La leyenda enumera las etiquetas de cada rebanada.</p>
</header>
<main></main>
<script>
/* iswc-auto-reload: do not remove — polling client agnóstico del static server */
(function () {
  var tries = [
    'dist/cdn/reload-pin',
    '../dist/cdn/reload-pin',
    '../../dist/cdn/reload-pin',
    '../../../dist/cdn/reload-pin',
    '../../../../dist/cdn/reload-pin'
  ];
  var pinUrl = null;
  var last = null;
  function poll() {
    if (!pinUrl) return;
    fetch(pinUrl, { cache: 'no-store' })
      .then(function (r) { return r.text(); })
      .then(function (h) {
        h = h.trim();
        if (last !== null && last !== h) location.reload();
        last = h;
      })
      .catch(function () {});
  }
  function probe(i) {
    if (i >= tries.length) return; // sin dev-server activo, no hacer nada
    fetch(tries[i], { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw 0;
        pinUrl = tries[i];
        setInterval(poll, 1500);
      })
      .catch(function () { probe(i + 1); });
  }
  probe(0);
})();
</script>
</body>
</html>
