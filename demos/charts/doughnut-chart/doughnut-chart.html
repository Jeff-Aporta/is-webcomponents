<!doctype html>
<html lang="es" class="theme-dark" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>&lt;iswc-doughnut-chart&gt; · demo</title>
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #0c1118; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; }
  header { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); background: #0f1620; }
  header h1 { font-size: 16px; font-weight: 700; margin: 0; }
  header p { font-size: 12px; color: #94a3b8; margin: 4px 0 0 0; }
  main { display: grid; place-items: center; padding: 20px; min-height: 0; }
  iswc-doughnut-chart { width: 480px; height: 360px; }
  iswc-doughnut-chart:not(:defined) { visibility: hidden; }
</style>
<script type="module">
  import { ISWebComponentsLoader as L } from '../../../dist/cdn/core/loader.min.js?h=0zzltt';
  L.configure({ local: true });
  // Carga el bundle pre-compilado. doughnut-chart.min.js importa transitivamente
  // chart.min.js + marks-radial.min.js.
  await L.load('iswc-doughnut-chart');
  await customElements.whenDefined('iswc-doughnut-chart');

  const chart = document.createElement('iswc-doughnut-chart');
  chart.setAttribute('label', 'Distribución de gastos 2024');
  chart.payload = {
    type: 'doughnut',
    data: {
      labels: ['Operaciones', 'Marketing', 'RRHH', 'I+D', 'Otros'],
      datasets: [{
        label: '2024',
        data: [42, 18, 15, 12, 13],
      }],
    },
    options: {
      cutout: '55',
    },
  };

  document.querySelector('main').appendChild(chart);
  document.documentElement.dataset.doughnutChartReady = '1';
</script>
</head>
<body>
<header>
  <h1>&lt;iswc-doughnut-chart&gt;</h1>
  <p>Wrapper de <code>&lt;iswc-chart&gt;</code> con tipo fijo <code>doughnut</code>. Total al centro.</p>
</header>
<main></main>
<script>
/* iswc-auto-rereload v2: backoff — polling client agnóstico del static server
 * W17: backoff exponencial + readyState wait + giveup tras MAX_FAILS fallos
 * consecutivos. Evita el loop infinito de reload-pin que vimos con Live
 * Server 5505 cuando el endpoint no responde. */
(function () {
  var tries = [
    'dist/cdn/reload-pin',
    '../dist/cdn/reload-pin',
    '../../dist/cdn/reload-pin',
    '../../../dist/cdn/reload-pin',
    '../../../../dist/cdn/reload-pin'
  ];
  var pinUrl = null;
  var last = null;
  var interval = 1500;          // arranca en 1.5s
  var MAX_INTERVAL = 30000;     // tope: 30s
  var MAX_FAILS = 6;            // tras 6 fallos consecutivos sin dev-server, dar up
  var fails = 0;
  var timer = 0;

  function poll() {
    if (!pinUrl) return;
    fetch(pinUrl, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw 0;
        return r.text();
      })
      .then(function (h) {
        h = h.trim();
        fails = 0;
        if (interval !== 1500) interval = 1500; // reset a 1.5s en éxito
        if (last !== null && last !== h) {
          location.reload();
          return;
        }
        last = h;
        schedule();
      })
      .catch(function () {
        fails++;
        if (fails >= MAX_FAILS) {
          // Sin dev-server o server muerto: dejar de gastar batería.
          if (timer) clearTimeout(timer);
          return;
        }
        // Backoff exponencial: 1.5s → 3s → 6s → 12s → 24s → 30s.
        interval = Math.min(interval * 2, MAX_INTERVAL);
        schedule();
      });
  }
  function schedule() {
    if (timer) clearTimeout(timer);
    timer = setTimeout(poll, interval);
  }
  function probe(i) {
    if (i >= tries.length) return; // sin dev-server activo, no hacer nada
    fetch(tries[i], { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw 0;
        pinUrl = tries[i];
        last = null;
        schedule();
      })
      .catch(function () { probe(i + 1); });
  }
  // Esperar a que la página esté lista antes de empezar (no quemar el
  // primer frame de CPU + red en una página que aún no pintó).
  function start() {
    if (document.readyState === 'complete') probe(0);
    else window.addEventListener('load', function () { probe(0); }, { once: true });
  }
  start();
})();
</script>
</body>
</html>
