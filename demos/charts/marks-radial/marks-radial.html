<!doctype html>
<html lang="es" class="theme-dark" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>marks-radial · demo (utility)</title>
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #0c1118; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; }
  header { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); background: #0f1620; }
  header h1 { font-size: 16px; font-weight: 700; margin: 0; }
  header p { font-size: 12px; color: #94a3b8; margin: 4px 0 0 0; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 20px; }
  section { background: #0f1620; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 14px; }
  section h2 { font-size: 11px; text-transform: uppercase; margin: 0 0 8px 0; color: #94a3b8; letter-spacing: 0.05em; }
  iswc-pie-chart, iswc-doughnut-chart, iswc-polar-area-chart, iswc-radar-chart { display: block; width: 100%; height: 240px; }
  pre { background: #06090e; padding: 8px; border-radius: 6px; overflow: auto; font-size: 11px; color: #94a3b8; grid-column: 1 / -1; }
  iswc-pie-chart:not(:defined), iswc-doughnut-chart:not(:defined), iswc-polar-area-chart:not(:defined), iswc-radar-chart:not(:defined) { visibility: hidden; }
</style>
<script type="module">
  import { ISWebComponentsLoader as L } from '../../../dist/cdn/core/loader.min.js?h=tg6647';
  L.configure({ local: true });
  // El bundle marks-radial.min.js exporta las funciones puras.
  const [__base] = await L.listBases();
  const lib = await import(L.assetUrl(new URL('charts/marks-radial.min.js', __base.endsWith('/') ? __base : __base + '/').href));
  document.getElementById('exports').textContent = JSON.stringify(Object.keys(lib).sort(), null, 2);

  // Wrappers tipados vía loader (sin ?h= quemado).
  await L.load(
    'iswc-pie-chart',
    'iswc-doughnut-chart',
    'iswc-polar-area-chart',
    'iswc-radar-chart',
  );
  await Promise.all([
    customElements.whenDefined('iswc-pie-chart'),
    customElements.whenDefined('iswc-doughnut-chart'),
    customElements.whenDefined('iswc-polar-area-chart'),
    customElements.whenDefined('iswc-radar-chart'),
  ]);

  // Pie
  const pie = document.createElement('iswc-pie-chart');
  pie.setAttribute('label', 'drawPieMarks');
  pie.payload = {
    data: { labels: ['Rojo','Azul','Verde'], datasets: [{ label: 'Mix', data: [40, 35, 25] }] },
  };
  document.getElementById('pie-host').appendChild(pie);

  // Doughnut
  const dough = document.createElement('iswc-doughnut-chart');
  dough.setAttribute('label', 'drawDoughnutMarks');
  dough.payload = {
    data: { labels: ['Op','Mkt','RRHH','I+D'], datasets: [{ label: '2024', data: [42, 18, 15, 25] }] },
  };
  document.getElementById('dough-host').appendChild(dough);

  // Polar area
  const pol = document.createElement('iswc-polar-area-chart');
  pol.setAttribute('label', 'drawPolarAreaMarks');
  pol.payload = {
    data: { labels: ['N','NE','E','SE','S','SO','O','NO'], datasets: [{ label: 'Vientos', data: [3, 5, 8, 6, 4, 7, 9, 2] }] },
  };
  document.getElementById('pol-host').appendChild(pol);

  // Radar
  const rad = document.createElement('iswc-radar-chart');
  rad.setAttribute('label', 'drawRadarMarks');
  rad.payload = {
    data: { labels: ['A','B','C','D','E'], datasets: [{ label: 'P1', data: [80, 60, 75, 90, 55] }] },
  };
  document.getElementById('rad-host').appendChild(rad);

  document.documentElement.dataset.marksRadialReady = '1';
</script>
</head>
<body>
<header>
  <h1>marks-radial (utility)</h1>
  <p>Funciones puras <code>drawPieMarks</code>, <code>drawDoughnutMarks</code>, <code>drawPolarAreaMarks</code>, <code>drawRadarMarks</code>.</p>
</header>
<main>
  <section><h2>Pie</h2><div id="pie-host"></div></section>
  <section><h2>Doughnut</h2><div id="dough-host"></div></section>
  <section><h2>Polar area</h2><div id="pol-host"></div></section>
  <section><h2>Radar</h2><div id="rad-host"></div></section>
  <pre id="exports"></pre>
</main>
<script>
/* iswc-auto-rereload v2: backoff — polling client agnóstico del static server
 * W17: backoff exponencial + readyState wait + giveup tras MAX_FAILS fallos
 * consecutivos. Evita el loop infinito de reload-pin que vimos con Live
 * Server 5505 cuando el endpoint no responde. */
(function () {
  var tries = [
    'dist/cdn/reload-pin',
    '../dist/cdn/reload-pin',
    '../../dist/cdn/reload-pin',
    '../../../dist/cdn/reload-pin',
    '../../../../dist/cdn/reload-pin'
  ];
  var pinUrl = null;
  var last = null;
  var interval = 1500;          // arranca en 1.5s
  var MAX_INTERVAL = 30000;     // tope: 30s
  var MAX_FAILS = 6;            // tras 6 fallos consecutivos sin dev-server, dar up
  var fails = 0;
  var timer = 0;

  function poll() {
    if (!pinUrl) return;
    fetch(pinUrl, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw 0;
        return r.text();
      })
      .then(function (h) {
        h = h.trim();
        fails = 0;
        if (interval !== 1500) interval = 1500; // reset a 1.5s en éxito
        if (last !== null && last !== h) {
          location.reload();
          return;
        }
        last = h;
        schedule();
      })
      .catch(function () {
        fails++;
        if (fails >= MAX_FAILS) {
          // Sin dev-server o server muerto: dejar de gastar batería.
          if (timer) clearTimeout(timer);
          return;
        }
        // Backoff exponencial: 1.5s → 3s → 6s → 12s → 24s → 30s.
        interval = Math.min(interval * 2, MAX_INTERVAL);
        schedule();
      });
  }
  function schedule() {
    if (timer) clearTimeout(timer);
    timer = setTimeout(poll, interval);
  }
  function probe(i) {
    if (i >= tries.length) return; // sin dev-server activo, no hacer nada
    fetch(tries[i], { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw 0;
        pinUrl = tries[i];
        last = null;
        schedule();
      })
      .catch(function () { probe(i + 1); });
  }
  // Esperar a que la página esté lista antes de empezar (no quemar el
  // primer frame de CPU + red en una página que aún no pintó).
  function start() {
    if (document.readyState === 'complete') probe(0);
    else window.addEventListener('load', function () { probe(0); }, { once: true });
  }
  start();
})();
</script>
</body>
</html>
