<!doctype html>
<html lang="es" class="theme-dark" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>marks-cartesian · demo (utility)</title>
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #0c1118; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; }
  header { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); background: #0f1620; }
  header h1 { font-size: 16px; font-weight: 700; margin: 0; }
  header p { font-size: 12px; color: #94a3b8; margin: 4px 0 0 0; }
  main { display: grid; gap: 16px; padding: 20px; }
  section { background: #0f1620; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 16px; }
  section h2 { font-size: 12px; text-transform: uppercase; margin: 0 0 10px 0; color: #94a3b8; }
  pre { background: #06090e; padding: 8px; border-radius: 6px; overflow: auto; font-size: 11px; color: #94a3b8; }
  svg { display: block; max-width: 100%; }
</style>
<script type="module">
  import { ISWebComponentsLoader as L } from '../../../dist/cdn/core/loader.min.js?v=1nhlvj';
  L.configure({ local: true });
  // marks-cartesian exports drawBarMarks, drawLineMarks, drawScatterMarks, drawBubbleMarks.
  // No hay custom element: las funciones reciben un `ctx` con plot, scales, colors, etc.
  const [__base] = await L.listBases();
  const lib = await import(L.assetUrl(new URL('charts/marks-cartesian.min.js', __base.endsWith('/') ? __base : __base + '/').href));
  const { drawBarMarks, drawLineMarks } = lib;

  // Construir un ctx mínimo: usamos <iswc-chart> como host para tener ejes/escala reales.
  await L.load('iswc-chart');
  await customElements.whenDefined('iswc-chart');

  // Demo 1: Bar via chart (real ctx)
  const bar = document.createElement('iswc-chart');
  bar.setAttribute('type', 'bar');
  bar.setAttribute('label', 'drawBarMarks vía iswc-chart');
  bar.payload = {
    data: { labels: ['A','B','C'], datasets: [{ label: 'S', data: [10, 25, 15] }] },
  };
  document.getElementById('bar-host').appendChild(bar);

  // Demo 2: Line via chart
  const line = document.createElement('iswc-chart');
  line.setAttribute('type', 'line');
  line.setAttribute('label', 'drawLineMarks vía iswc-chart');
  line.payload = {
    data: { labels: ['Ene','Feb','Mar','Abr'], datasets: [{ label: 'Tendencia', data: [10, 22, 18, 35], tension: 0.4 }] },
  };
  document.getElementById('line-host').appendChild(line);

  // Demo 3: Mostrar exports del bundle
  const exports = Object.keys(lib).sort();
  document.getElementById('exports').textContent = JSON.stringify(exports, null, 2);

  document.documentElement.dataset.marksCartesianReady = '1';
</script>
</head>
<body>
<header>
  <h1>marks-cartesian (utility)</h1>
  <p>Funciones puras <code>drawBarMarks</code>, <code>drawLineMarks</code>, <code>drawScatterMarks</code>, <code>drawBubbleMarks</code>. Se invocan desde el motor <code>&lt;iswc-chart&gt;</code>.</p>
</header>
<main>
  <section><h2>Exports del bundle</h2><pre id="exports"></pre></section>
  <section><h2>drawBarMarks</h2><div id="bar-host" style="height:280px"></div></section>
  <section><h2>drawLineMarks</h2><div id="line-host" style="height:280px"></div></section>
</main>
<script>
/* iswc-auto-rereload v2: backoff — polling client agnóstico del static server
 * W17: backoff exponencial + readyState wait + giveup tras MAX_FAILS fallos
 * consecutivos. Evita el loop infinito de reload-pin que vimos con Live
 * Server 5505 cuando el endpoint no responde. */
(function () {
  var tries = [
    'dist/cdn/reload-pin',
    '../dist/cdn/reload-pin',
    '../../dist/cdn/reload-pin',
    '../../../dist/cdn/reload-pin',
    '../../../../dist/cdn/reload-pin'
  ];
  var pinUrl = null;
  var last = null;
  var interval = 1500;          // arranca en 1.5s
  var MAX_INTERVAL = 30000;     // tope: 30s
  var MAX_FAILS = 6;            // tras 6 fallos consecutivos sin dev-server, dar up
  var fails = 0;
  var timer = 0;

  function poll() {
    if (!pinUrl) return;
    fetch(pinUrl, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw 0;
        return r.text();
      })
      .then(function (h) {
        h = h.trim();
        fails = 0;
        if (interval !== 1500) interval = 1500; // reset a 1.5s en éxito
        if (last !== null && last !== h) {
          location.reload();
          return;
        }
        last = h;
        schedule();
      })
      .catch(function () {
        fails++;
        if (fails >= MAX_FAILS) {
          // Sin dev-server o server muerto: dejar de gastar batería.
          if (timer) clearTimeout(timer);
          return;
        }
        // Backoff exponencial: 1.5s → 3s → 6s → 12s → 24s → 30s.
        interval = Math.min(interval * 2, MAX_INTERVAL);
        schedule();
      });
  }
  function schedule() {
    if (timer) clearTimeout(timer);
    timer = setTimeout(poll, interval);
  }
  function probe(i) {
    if (i >= tries.length) return; // sin dev-server activo, no hacer nada
    fetch(tries[i], { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw 0;
        pinUrl = tries[i];
        last = null;
        schedule();
      })
      .catch(function () { probe(i + 1); });
  }
  // Esperar a que la página esté lista antes de empezar (no quemar el
  // primer frame de CPU + red en una página que aún no pintó).
  function start() {
    if (document.readyState === 'complete') probe(0);
    else window.addEventListener('load', function () { probe(0); }, { once: true });
  }
  start();
})();
</script>
</body>
</html>
