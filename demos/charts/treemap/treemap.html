<!doctype html>
<html lang="es" class="theme-dark" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>&lt;iswc-treemap&gt; · demo</title>
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #0c1118; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; }
  header { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); background: #0f1620; }
  header h1 { font-size: 16px; font-weight: 700; margin: 0; }
  header p { font-size: 12px; color: #94a3b8; margin: 4px 0 0 0; }
  main { display: grid; place-items: center; padding: 20px; min-height: 0; }
  iswc-treemap { width: 800px; height: 480px; display: block; }
  iswc-treemap:not(:defined) { visibility: hidden; }
</style>
<script type="module">
  await import('../../../dist/cdn/data-viz/treemap.min.js?h=6cmpuq');
  await customElements.whenDefined('iswc-treemap');

  const tm = document.createElement('iswc-treemap');
  tm.payload = {
      treemap: {
        title: 'Inventario por categoría',
        nodes: [
          { id: 'electronica', label: 'Electrónica', value: 3500 },
          { id: 'hogar', label: 'Hogar', value: 2200 },
          { id: 'ropa', label: 'Ropa', value: 1800 },
          { id: 'deportes', label: 'Deportes', value: 900 },
          { id: 'libros', label: 'Libros', value: 600 },
          // Sub-categorías de electrónica
          { id: 'tv', parent: 'electronica', label: 'TVs', value: 1500 },
          { id: 'audio', parent: 'electronica', label: 'Audio', value: 1200 },
          { id: 'moviles', parent: 'electronica', label: 'Móviles', value: 800 },
        ],
      },
    };

  document.querySelector('main').appendChild(tm);
  document.documentElement.dataset.treemapReady = '1';
</script>
</head>
<body>
<header>
  <h1>&lt;iswc-treemap&gt;</h1>
  <p>Teselado squarified anidado. Payload vía propiedad <code>payload</code> o <code>&lt;script type="application/json"&gt;</code>.</p>
</header>
<main></main>
<script>
/* iswc-auto-reload: do not remove — polling client agnóstico del static server */
(function () {
  var tries = [
    'dist/cdn/reload-pin',
    '../dist/cdn/reload-pin',
    '../../dist/cdn/reload-pin',
    '../../../dist/cdn/reload-pin',
    '../../../../dist/cdn/reload-pin'
  ];
  var pinUrl = null;
  var last = null;
  function poll() {
    if (!pinUrl) return;
    fetch(pinUrl, { cache: 'no-store' })
      .then(function (r) { return r.text(); })
      .then(function (h) {
        h = h.trim();
        if (last !== null && last !== h) location.reload();
        last = h;
      })
      .catch(function () {});
  }
  function probe(i) {
    if (i >= tries.length) return; // sin dev-server activo, no hacer nada
    fetch(tries[i], { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw 0;
        pinUrl = tries[i];
        setInterval(poll, 1500);
      })
      .catch(function () { probe(i + 1); });
  }
  probe(0);
})();
</script>
</body>
</html>
