<!doctype html>
<html lang="es" class="theme-dark" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>&lt;iswc-bubble-chart&gt; · demo</title>
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #0c1118; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; }
  header { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); background: #0f1620; }
  header h1 { font-size: 16px; font-weight: 700; margin: 0; }
  header p { font-size: 12px; color: #94a3b8; margin: 4px 0 0 0; }
  main { display: grid; place-items: center; padding: 20px; min-height: 0; }
  iswc-bubble-chart { width: 720px; height: 360px; }
  iswc-bubble-chart:not(:defined) { visibility: hidden; }
</style>
<script type="module">
  await import('../../../dist/cdn/data-viz/bubble-chart.min.js?h=1c2zdu');
  await customElements.whenDefined('iswc-bubble-chart');

  const chart = document.createElement('iswc-bubble-chart');
  chart.setAttribute('label', 'Ciudades');
  chart.setAttribute('x-label', 'Población (M)');
  chart.setAttribute('y-label', 'PIB per cápita (k$)');
  chart.payload = {
    type: 'bubble',
    data: {
      datasets: [{
        label: 'Ciudades',
        data: [
          { x: 1.2, y: 18, r: 12 },
          { x: 2.5, y: 28, r: 18 },
          { x: 4.0, y: 35, r: 24 },
          { x: 6.5, y: 42, r: 30 },
          { x: 8.8, y: 55, r: 36 },
          { x: 12.0, y: 62, r: 42 },
          { x: 15.5, y: 48, r: 28 },
          { x: 18.0, y: 72, r: 38 },
        ],
      }],
    },
  };

  document.querySelector('main').appendChild(chart);
  document.documentElement.dataset.bubbleChartReady = '1';
</script>
</head>
<body>
<header>
  <h1>&lt;iswc-bubble-chart&gt;</h1>
  <p>Wrapper de <code>&lt;iswc-chart&gt;</code> con tipo fijo <code>bubble</code>. Datos <code>{x, y, r}</code>.</p>
</header>
<main></main>
<script>
/* iswc-auto-reload: do not remove — polling client agnóstico del static server */
(function () {
  var tries = [
    'dist/cdn/reload-pin',
    '../dist/cdn/reload-pin',
    '../../dist/cdn/reload-pin',
    '../../../dist/cdn/reload-pin',
    '../../../../dist/cdn/reload-pin'
  ];
  var pinUrl = null;
  var last = null;
  function poll() {
    if (!pinUrl) return;
    fetch(pinUrl, { cache: 'no-store' })
      .then(function (r) { return r.text(); })
      .then(function (h) {
        h = h.trim();
        if (last !== null && last !== h) location.reload();
        last = h;
      })
      .catch(function () {});
  }
  function probe(i) {
    if (i >= tries.length) return; // sin dev-server activo, no hacer nada
    fetch(tries[i], { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw 0;
        pinUrl = tries[i];
        setInterval(poll, 1500);
      })
      .catch(function () { probe(i + 1); });
  }
  probe(0);
})();
</script>
</body>
</html>
