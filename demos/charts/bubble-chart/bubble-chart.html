<!doctype html>
<html lang="es" class="theme-dark" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>&lt;is-bubble-chart&gt; · demo</title>
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #0c1118; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; }
  header { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); background: #0f1620; }
  header h1 { font-size: 16px; font-weight: 700; margin: 0; }
  header p { font-size: 12px; color: #94a3b8; margin: 4px 0 0 0; }
  main { display: grid; place-items: center; padding: 20px; min-height: 0; }
  is-bubble-chart { width: 720px; height: 360px; }
  is-bubble-chart:not(:defined) { visibility: hidden; }
</style>
<script type="module">
  await import('../../../dist/cdn/data-viz/bubble-chart.min.js');
  await customElements.whenDefined('is-bubble-chart');

  const chart = document.createElement('is-bubble-chart');
  chart.setAttribute('label', 'Ciudades');
  chart.setAttribute('x-label', 'Población (M)');
  chart.setAttribute('y-label', 'PIB per cápita (k$)');
  chart.payload = {
    type: 'bubble',
    data: {
      datasets: [{
        label: 'Ciudades',
        data: [
          { x: 1.2, y: 18, r: 12 },
          { x: 2.5, y: 28, r: 18 },
          { x: 4.0, y: 35, r: 24 },
          { x: 6.5, y: 42, r: 30 },
          { x: 8.8, y: 55, r: 36 },
          { x: 12.0, y: 62, r: 42 },
          { x: 15.5, y: 48, r: 28 },
          { x: 18.0, y: 72, r: 38 },
        ],
      }],
    },
  };

  document.querySelector('main').appendChild(chart);
  document.documentElement.dataset.bubbleChartReady = '1';
</script>
</head>
<body>
<header>
  <h1>&lt;is-bubble-chart&gt;</h1>
  <p>Wrapper de <code>&lt;is-chart&gt;</code> con tipo fijo <code>bubble</code>. Datos <code>{x, y, r}</code>.</p>
</header>
<main></main>
</body>
</html>
