<!doctype html>
<html lang="es" class="theme-dark" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>marks-funnel · demo (utility)</title>
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #0c1118; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; }
  header { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); background: #0f1620; }
  header h1 { font-size: 16px; font-weight: 700; margin: 0; }
  header p { font-size: 12px; color: #94a3b8; margin: 4px 0 0 0; }
  main { display: grid; gap: 16px; padding: 20px; }
  section { background: #0f1620; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 16px; }
  section h2 { font-size: 12px; text-transform: uppercase; margin: 0 0 10px 0; color: #94a3b8; }
  pre { background: #06090e; padding: 8px; border-radius: 6px; overflow: auto; font-size: 11px; color: #94a3b8; }
</style>
<script type="module">
  const lib = await import('../../../dist/cdn/charts/marks-funnel.min.js');
  const { funnelBands, drawFunnelMarks } = lib;

  // Calcular bands de un funnel puro
  const values = [4200, 1800, 640, 210];
  const bands = funnelBands(values);
  document.getElementById('bands').textContent = JSON.stringify(bands, null, 2);

  // Demo 2: usar drawFunnelMarks vía <is-chart> con type=funnel
  await import('../../../dist/cdn/data-viz/funnel-chart.min.js');
  await customElements.whenDefined('is-funnel-chart');

  const fc = document.createElement('is-funnel-chart');
  fc.setAttribute('label', 'Embudo de conversión');
  fc.payload = {
    data: {
      labels: ['Visitantes', 'Sign-ups', 'Trial', 'Pago'],
      datasets: [{ label: 'Conversión', data: values }],
    },
  };
  document.getElementById('funnel-host').appendChild(fc);

  // Exports
  document.getElementById('exports').textContent = JSON.stringify(Object.keys(lib).sort(), null, 2);

  document.documentElement.dataset.marksFunnelReady = '1';
</script>
</head>
<body>
<header>
  <h1>marks-funnel (utility)</h1>
  <p><code>funnelBands(values)</code> calcula ratios y dropPct; <code>drawFunnelMarks(ctx)</code> pinta el embudo.</p>
</header>
<main>
  <section><h2>Exports</h2><pre id="exports"></pre></section>
  <section><h2>funnelBands([4200, 1800, 640, 210])</h2><pre id="bands"></pre></section>
  <section><h2>drawFunnelMarks vía &lt;is-funnel-chart&gt;</h2><div id="funnel-host" style="height:320px"></div></section>
</main>
</body>
</html>
