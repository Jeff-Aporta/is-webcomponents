<!doctype html>
<html lang="es" class="theme-dark" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>&lt;iswc-sparkline&gt; · demo</title>
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #0c1118; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; }
  header { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); background: #0f1620; }
  header h1 { font-size: 16px; font-weight: 700; margin: 0; }
  header p { font-size: 12px; color: #94a3b8; margin: 4px 0 0 0; }
  main { display: grid; grid-template-rows: auto 1fr auto; gap: 16px; padding: 20px; }
  section { background: #0f1620; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 16px; }
  section h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; margin: 0 0 10px 0; color: #94a3b8; }
  iswc-sparkline { display: block; width: 100%; height: 60px; }
  iswc-sparkline:not(:defined) { visibility: hidden; }
</style>
<script type="module">
  import { ISWebComponentsLoader as L } from '../../../dist/cdn/core/loader.min.js?v=y1jvrk';
  L.configure({ local: true });
  await L.load('iswc-sparkline');
  await customElements.whenDefined('iswc-sparkline');

  // Demo 1: line sparkline via attribute
  const s1 = document.createElement('iswc-sparkline');
  s1.setAttribute('values', '12,18,15,22,30,28,35,40,38,42');
  s1.setAttribute('line-color', '#22d3ee');

  // Demo 2: bar sparkline via data property
  const s2 = document.createElement('iswc-sparkline');
  s2.setAttribute('type', 'bar');
  s2.setAttribute('line-color', '#a78bfa');
  s2.data = [5, 12, 8, 18, 22, 15, 28];

  // Demo 3: gradient area
  const s3 = document.createElement('iswc-sparkline');
  s3.setAttribute('values', '40,38,42,35,30,33,28,25,28,32,38');
  s3.setAttribute('variant', 'gradient');
  s3.setAttribute('line-color', '#22c55e');

  document.getElementById('s1').appendChild(s1);
  document.getElementById('s2').appendChild(s2);
  document.getElementById('s3').appendChild(s3);
  document.documentElement.dataset.sparklineReady = '1';
</script>
</head>
<body>
<header>
  <h1>&lt;iswc-sparkline&gt;</h1>
  <p>Mini-gráfico inline. Acepta atributo <code>values</code> o propiedad <code>data</code>. Tipos: <code>line</code>, <code>bar</code>.</p>
</header>
<main>
  <section><h2>Line (atributo values)</h2><div id="s1"></div></section>
  <section><h2>Bar (propiedad data)</h2><div id="s2"></div></section>
  <section><h2>Gradient area</h2><div id="s3"></div></section>
</main>
<script>
/* iswc-auto-rereload v2: backoff — polling client agnóstico del static server
 * W17: backoff exponencial + readyState wait + giveup tras MAX_FAILS fallos
 * consecutivos. Evita el loop infinito de reload-pin que vimos con Live
 * Server 5505 cuando el endpoint no responde. */
(function () {
  var tries = [
    'dist/cdn/reload-pin',
    '../dist/cdn/reload-pin',
    '../../dist/cdn/reload-pin',
    '../../../dist/cdn/reload-pin',
    '../../../../dist/cdn/reload-pin'
  ];
  var pinUrl = null;
  var last = null;
  var interval = 1500;          // arranca en 1.5s
  var MAX_INTERVAL = 30000;     // tope: 30s
  var MAX_FAILS = 6;            // tras 6 fallos consecutivos sin dev-server, dar up
  var fails = 0;
  var timer = 0;

  function poll() {
    if (!pinUrl) return;
    fetch(pinUrl, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw 0;
        return r.text();
      })
      .then(function (h) {
        h = h.trim();
        fails = 0;
        if (interval !== 1500) interval = 1500; // reset a 1.5s en éxito
        if (last !== null && last !== h) {
          location.reload();
          return;
        }
        last = h;
        schedule();
      })
      .catch(function () {
        fails++;
        if (fails >= MAX_FAILS) {
          // Sin dev-server o server muerto: dejar de gastar batería.
          if (timer) clearTimeout(timer);
          return;
        }
        // Backoff exponencial: 1.5s → 3s → 6s → 12s → 24s → 30s.
        interval = Math.min(interval * 2, MAX_INTERVAL);
        schedule();
      });
  }
  function schedule() {
    if (timer) clearTimeout(timer);
    timer = setTimeout(poll, interval);
  }
  function probe(i) {
    if (i >= tries.length) return; // sin dev-server activo, no hacer nada
    fetch(tries[i], { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw 0;
        pinUrl = tries[i];
        last = null;
        schedule();
      })
      .catch(function () { probe(i + 1); });
  }
  // Esperar a que la página esté lista antes de empezar (no quemar el
  // primer frame de CPU + red en una página que aún no pintó).
  function start() {
    if (document.readyState === 'complete') probe(0);
    else window.addEventListener('load', function () { probe(0); }, { once: true });
  }
  start();
})();
</script>
</body>
</html>
