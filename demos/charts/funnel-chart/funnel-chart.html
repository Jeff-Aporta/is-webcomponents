<!doctype html>
<html lang="es" class="theme-dark" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>&lt;is-funnel-chart&gt; · demo</title>
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #0c1118; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; }
  header { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); background: #0f1620; }
  header h1 { font-size: 16px; font-weight: 700; margin: 0; }
  header p { font-size: 12px; color: #94a3b8; margin: 4px 0 0 0; }
  main { display: grid; place-items: center; padding: 20px; min-height: 0; }
  is-funnel-chart { width: 720px; height: 420px; }
  is-funnel-chart:not(:defined) { visibility: hidden; }
</style>
<script type="module">
  // Carga el bundle pre-compilado. funnel-chart.min.js importa transitivamente
  // chart.min.js + marks-funnel.min.js.
  await import('../../../dist/cdn/data-viz/funnel-chart.min.js');
  await customElements.whenDefined('is-funnel-chart');

  const chart = document.createElement('is-funnel-chart');
  chart.setAttribute('label', 'Embudo de conversión Q4');
  chart.payload = {
    type: 'funnel',
    data: {
      labels: ['Visitantes', 'Leads', 'Cualificados', 'Demo', 'Cierre'],
      datasets: [{
        label: 'Conversión',
        data: [12000, 4800, 2100, 760, 184],
      }],
    },
  };

  document.querySelector('main').appendChild(chart);
  document.documentElement.dataset.funnelChartReady = '1';
</script>
</head>
<body>
<header>
  <h1>&lt;is-funnel-chart&gt;</h1>
  <p>Wrapper de <code>&lt;is-chart&gt;</code> con tipo fijo <code>funnel</code>. <code>dropPct</code> entre pasos.</p>
</header>
<main></main>
</body>
</html>
