<!doctype html>
<html lang="es" class="theme-dark" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>marks-waterfall · demo (utility)</title>
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #0c1118; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; }
  header { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); background: #0f1620; }
  header h1 { font-size: 16px; font-weight: 700; margin: 0; }
  header p { font-size: 12px; color: #94a3b8; margin: 4px 0 0 0; }
  main { display: grid; gap: 16px; padding: 20px; }
  section { background: #0f1620; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 16px; }
  section h2 { font-size: 12px; text-transform: uppercase; margin: 0 0 10px 0; color: #94a3b8; }
  pre { background: #06090e; padding: 8px; border-radius: 6px; overflow: auto; font-size: 11px; color: #94a3b8; }
  is-waterfall-chart { display: block; width: 100%; height: 360px; }
  is-waterfall-chart:not(:defined) { visibility: hidden; }
</style>
<script type="module">
  const lib = await import('../../../dist/cdn/charts/marks-waterfall.min.js');
  const { waterfallBars, drawWaterfallMarks } = lib;
  document.getElementById('exports').textContent = JSON.stringify(Object.keys(lib).sort(), null, 2);

  // Función pura: waterfallBars([1200, 850, -420, -180, null], [0, 4])
  const bars = waterfallBars([1200, 850, -420, -180, null], [0, 4]);
  document.getElementById('bars').textContent = JSON.stringify(bars, null, 2);

  // Demo en vivo vía <is-waterfall-chart>
  await import('../../../dist/cdn/data-viz/waterfall-chart.min.js');
  await customElements.whenDefined('is-waterfall-chart');

  const wf = document.createElement('is-waterfall-chart');
  wf.setAttribute('label', 'EBITDA waterfall');
  wf.payload = {
    data: {
      labels: ['Ingresos', 'COGS', 'OpEx', 'Tax', 'Neto'],
      datasets: [{
        label: 'Flujo',
        data: [1200, 850, -420, -180, null],
        totals: [0, 4],
      }],
    },
  };
  document.getElementById('waterfall-host').appendChild(wf);

  document.documentElement.dataset.marksWaterfallReady = '1';
</script>
</head>
<body>
<header>
  <h1>marks-waterfall (utility)</h1>
  <p><code>waterfallBars(values, totals)</code> calcula rangos; <code>drawWaterfallMarks(ctx)</code> pinta la cascada.</p>
</header>
<main>
  <section><h2>Exports</h2><pre id="exports"></pre></section>
  <section><h2>waterfallBars([1200, 850, -420, -180, null], [0, 4])</h2><pre id="bars"></pre></section>
  <section><h2>drawWaterfallMarks vía &lt;is-waterfall-chart&gt;</h2><div id="waterfall-host"></div></section>
</main>
</body>
</html>
