<!doctype html>
<html lang="es" class="theme-dark" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Demo — <is-timeline> · is-webcomponents</title>
<meta name="description" content="Línea de tiempo con eventos datados y agrupación por color/grupo." />
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #0c1118; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; }
  header { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); background: #0f1620; }
  header h1 { font-size: 16px; font-weight: 700; margin: 0; }
  header p { font-size: 12px; color: #94a3b8; margin: 4px 0 0 0; }
  main { display: grid; place-items: stretch; min-height: 0; padding: 12px; }
  is-timeline { width: 100%; height: 100%; min-height: 480px; display: block; }
  is-timeline:not(:defined) { visibility: hidden; }
</style>
<script type="module">
  await import('../../../dist/cdn/diagrams/timeline.min.js');
  await customElements.whenDefined('is-timeline');

  const el = document.createElement('is-timeline');
  el.payload = {
    timeline: {
      title: 'Historia del proyecto',
      subtitle: '5 eventos · 2 grupos · 2024..2025',
      dateFormat: 'YYYY-MM-DD',
      groups: [
        { id: 'producto', name: 'Producto' },
        { id: 'equipo', name: 'Equipo' },
      ],
      events: [
        { id: 'e1', label: 'MVP', date: '2024-02-15', group: 'producto' },
        { id: 'e2', label: 'Primeros clientes', date: '2024-06-01', group: 'producto' },
        { id: 'e3', label: 'Contratar CTO', date: '2024-08-10', group: 'equipo' },
        { id: 'e4', label: 'Lanzamiento v2', date: '2024-12-01', group: 'producto' },
        { id: 'e5', label: 'Seed 2M€', date: '2025-03-20', group: 'equipo' },
      ],
    },
  };
  document.querySelector('main').appendChild(el);

  document.documentElement.dataset.timelineReady = '1';
</script>
</head>
<body>
  <header>
  <h1>Demo — <code>&lt;is-timeline&gt;</code></h1>
  <p>Línea de tiempo horizontal: eventos datados, agrupados por color y ordenados cronológicamente.</p>
</header>
<main></main>
</body>
</html>
