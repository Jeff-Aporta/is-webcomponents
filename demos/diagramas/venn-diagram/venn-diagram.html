<!doctype html>
<html lang="es" class="theme-dark" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Demo — <is-venn-diagram> · is-webcomponents</title>
<meta name="description" content="Diagrama de Venn con 2 o 3 conjuntos y etiquetas por región." />
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #0c1118; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; }
  header { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); background: #0f1620; }
  header h1 { font-size: 16px; font-weight: 700; margin: 0; }
  header p { font-size: 12px; color: #94a3b8; margin: 4px 0 0 0; }
  main { display: grid; place-items: stretch; min-height: 0; padding: 12px; }
  is-venn-diagram { width: 100%; height: 100%; min-height: 480px; display: block; }
  is-venn-diagram:not(:defined) { visibility: hidden; }
</style>
<script type="module">
  await import('../../../dist/cdn/diagrams/venn-diagram.min.js');
  await customElements.whenDefined('is-venn-diagram');

  const el = document.createElement('is-venn-diagram');
  el.payload = {
    venn: {
      title: 'Habilidades',
      subtitle: '3 conjuntos · 5 regiones etiquetadas',
      sets: [
        { id: 'frontend', label: 'Frontend' },
        { id: 'backend', label: 'Backend' },
        { id: 'devops', label: 'DevOps' },
      ],
      regions: [
        { id: 'r-fe', sets: ['frontend'], label: 'Solo FE' },
        { id: 'r-be', sets: ['backend'], label: 'Solo BE' },
        { id: 'r-do', sets: ['devops'], label: 'Solo DO' },
        { id: 'r-fe-be', sets: ['frontend', 'backend'], label: 'FullStack' },
        { id: 'r-all', sets: ['frontend', 'backend', 'devops'], label: 'All-rounder' },
      ],
    },
  };
  document.querySelector('main').appendChild(el);

  document.documentElement.dataset.vennReady = '1';
</script>
</head>
<body>
  <header>
    <h1>Demo — <code>&lt;is-venn-diagram&gt;</code></h1>
    <p>Diagrama de Venn: 3 círculos en triángulo equilátero con etiquetas por región (intersección, exclusivo, all-rounder).</p>
  </header>
  <main></main>
</body>
</html>
