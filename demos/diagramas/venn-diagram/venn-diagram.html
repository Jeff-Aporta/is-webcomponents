<!doctype html>
<html lang="es" class="theme-dark" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Demo — <iswc-venn-diagram> · is-webcomponents</title>
<meta name="description" content="Diagrama de Venn con 2 o 3 conjuntos y etiquetas por región." />
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #0c1118; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; }
  header { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); background: #0f1620; }
  header h1 { font-size: 16px; font-weight: 700; margin: 0; }
  header p { font-size: 12px; color: #94a3b8; margin: 4px 0 0 0; }
  main { display: grid; place-items: stretch; min-height: 0; padding: 12px; }
  iswc-venn-diagram { width: 100%; height: 100%; min-height: 480px; display: block; }
  iswc-venn-diagram:not(:defined) { visibility: hidden; }
</style>
<script type="module">
  await import('../../../dist/cdn/diagrams/venn-diagram.min.js?h=2urq1v');
  await customElements.whenDefined('iswc-venn-diagram');

  const el = document.createElement('iswc-venn-diagram');
  el.payload = {
    venn: {
      title: 'Habilidades',
      subtitle: '3 conjuntos · 5 regiones etiquetadas',
      sets: [
        { id: 'frontend', label: 'Frontend' },
        { id: 'backend', label: 'Backend' },
        { id: 'devops', label: 'DevOps' },
      ],
      regions: [
        { id: 'r-fe', sets: ['frontend'], label: 'Solo FE' },
        { id: 'r-be', sets: ['backend'], label: 'Solo BE' },
        { id: 'r-do', sets: ['devops'], label: 'Solo DO' },
        { id: 'r-fe-be', sets: ['frontend', 'backend'], label: 'FullStack' },
        { id: 'r-all', sets: ['frontend', 'backend', 'devops'], label: 'All-rounder' },
      ],
    },
  };
  document.querySelector('main').appendChild(el);

  document.documentElement.dataset.vennReady = '1';
</script>
</head>
<body>
  <header>
    <h1>Demo — <code>&lt;iswc-venn-diagram&gt;</code></h1>
    <p>Diagrama de Venn: 3 círculos en triángulo equilátero con etiquetas por región (intersección, exclusivo, all-rounder).</p>
  </header>
  <main></main>
<script>
/* iswc-auto-reload: do not remove — polling client agnóstico del static server */
(function () {
  var tries = [
    'dist/cdn/reload-pin',
    '../dist/cdn/reload-pin',
    '../../dist/cdn/reload-pin',
    '../../../dist/cdn/reload-pin',
    '../../../../dist/cdn/reload-pin'
  ];
  var pinUrl = null;
  var last = null;
  function poll() {
    if (!pinUrl) return;
    fetch(pinUrl, { cache: 'no-store' })
      .then(function (r) { return r.text(); })
      .then(function (h) {
        h = h.trim();
        if (last !== null && last !== h) location.reload();
        last = h;
      })
      .catch(function () {});
  }
  function probe(i) {
    if (i >= tries.length) return; // sin dev-server activo, no hacer nada
    fetch(tries[i], { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw 0;
        pinUrl = tries[i];
        setInterval(poll, 1500);
      })
      .catch(function () { probe(i + 1); });
  }
  probe(0);
})();
</script>
</body>
</html>
