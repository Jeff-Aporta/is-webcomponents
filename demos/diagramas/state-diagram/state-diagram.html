<!doctype html>
<html lang="es" class="theme-dark" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Demo — <iswc-state-diagram> · is-webcomponents</title>
<meta name="description" content="Diagrama de estados UML: estados (inicial, final, decisión, acción), transiciones con label." />
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #0c1118; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; }
  header { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); background: #0f1620; }
  header h1 { font-size: 16px; font-weight: 700; margin: 0; }
  header p { font-size: 12px; color: #94a3b8; margin: 4px 0 0 0; }
  main { display: grid; place-items: stretch; min-height: 0; padding: 12px; }
  iswc-state-diagram { width: 100%; height: 100%; min-height: 480px; display: block; }
  iswc-state-diagram:not(:defined) { visibility: hidden; }
</style>
<script type="module">
  await import('../../../dist/cdn/diagrams/state-diagram.min.js?h=lhoknt');
  await customElements.whenDefined('iswc-state-diagram');

  const el = document.createElement('iswc-state-diagram');
  el.payload = {
    stateDiagram: {
      title: 'Pedido',
      subtitle: '5 estados · 6 transiciones · dirección TB',
      direction: 'TB',
      states: [
        { id: 'init', label: '', kind: 'start' },
        { id: 'pending', label: 'Pendiente' },
        { id: 'paid', label: 'Pagado' },
        { id: 'shipped', label: 'Enviado' },
        { id: 'cancelled', label: 'Cancelado' },
        { id: 'end', label: '', kind: 'end' },
      ],
      transitions: [
        { id: 'e1', from: 'init', to: 'pending' },
        { id: 'e2', from: 'pending', to: 'paid', label: 'pago OK' },
        { id: 'e3', from: 'paid', to: 'shipped', label: 'enviar' },
        { id: 'e4', from: 'shipped', to: 'end' },
        { id: 'e5', from: 'pending', to: 'cancelled', label: 'cancelar' },
        { id: 'e6', from: 'cancelled', to: 'end' },
      ],
    },
  };
  document.querySelector('main').appendChild(el);

  document.documentElement.dataset.stateReady = '1';
</script>
</head>
<body>
  <header>
    <h1>Demo — <code>&lt;iswc-state-diagram&gt;</code></h1>
    <p>Diagrama de estados UML: estados inicial/final con relleno negro, transiciones etiquetadas.</p>
  </header>
  <main></main>
<script>
/* iswc-auto-reload: do not remove — polling client agnóstico del static server */
(function () {
  var tries = [
    'dist/cdn/reload-pin',
    '../dist/cdn/reload-pin',
    '../../dist/cdn/reload-pin',
    '../../../dist/cdn/reload-pin',
    '../../../../dist/cdn/reload-pin'
  ];
  var pinUrl = null;
  var last = null;
  function poll() {
    if (!pinUrl) return;
    fetch(pinUrl, { cache: 'no-store' })
      .then(function (r) { return r.text(); })
      .then(function (h) {
        h = h.trim();
        if (last !== null && last !== h) location.reload();
        last = h;
      })
      .catch(function () {});
  }
  function probe(i) {
    if (i >= tries.length) return; // sin dev-server activo, no hacer nada
    fetch(tries[i], { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw 0;
        pinUrl = tries[i];
        setInterval(poll, 1500);
      })
      .catch(function () { probe(i + 1); });
  }
  probe(0);
})();
</script>
</body>
</html>
