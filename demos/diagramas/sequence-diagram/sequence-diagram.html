<!doctype html>
<html lang="es" class="theme-dark" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Demo — <iswc-sequence-diagram> · iswc-root</title>
<meta name="description" content="Diagrama de secuencia con actores, lifelines, mensajes sync/async/return y ramas alt." />
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #0c1118; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; }
  header { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); background: #0f1620; }
  header h1 { font-size: 16px; font-weight: 700; margin: 0; }
  header p { font-size: 12px; color: #94a3b8; margin: 4px 0 0 0; }
  main { display: grid; place-items: stretch; min-height: 0; padding: 12px; }
  iswc-sequence-diagram { width: 100%; height: 100%; min-height: 480px; display: block; }
  iswc-sequence-diagram:not(:defined) { visibility: hidden; }
</style>
<script type="module">
  await import('../../../dist/cdn/diagrams/sequence-diagram.min.js?v=e0zfpd');
  await customElements.whenDefined('iswc-sequence-diagram');

  const el = document.createElement('iswc-sequence-diagram');
  el.payload = {
    sequence: {
      title: 'Login de usuario',
      subtitle: '4 actores · 5 mensajes · 1 rama alt',
      actors: [
        { id: 'u', label: 'Usuario' },
        { id: 'a', label: 'AuthAPI' },
        { id: 'db', label: 'DB' },
        { id: 'mail', label: 'Mailer' },
      ],
      messages: [
        { id: 'm1', from: 'u', to: 'a', label: 'login(email, pwd)' },
        { id: 'm2', from: 'a', to: 'db', label: 'buscarUsuario(email)' },
        { id: 'm3', from: 'db', to: 'a', label: 'row', kind: 'return' },
      ],
      alt: {
        branches: [
          {
            condition: 'pwd OK',
            messages: [
              { id: 'm4', from: 'a', to: 'u', label: 'session = JWT(...)', kind: 'return' },
            ],
          },
          {
            condition: 'pwd FAIL',
            messages: [
              { id: 'm5', from: 'a', to: 'mail', label: 'enviarAlerta()', kind: 'async' },
            ],
          },
        ],
      },
    },
  };
  document.querySelector('main').appendChild(el);

  document.documentElement.dataset.sequenceReady = '1';
</script>
</head>
<body>
  <header>
    <h1>Demo — <code>&lt;iswc-sequence-diagram&gt;</code></h1>
    <p>Diagrama de secuencia: lifelines verticales, mensajes sync/async/return, ramas <code>alt</code>.</p>
  </header>
  <main></main>
<script>
/* iswc-auto-rereload v2: backoff — polling client agnóstico del static server
 * W17: backoff exponencial + readyState wait + giveup tras MAX_FAILS fallos
 * consecutivos. Evita el loop infinito de reload-pin que vimos con Live
 * Server 5505 cuando el endpoint no responde. */
(function () {
  var tries = [
    'dist/cdn/reload-pin',
    '../dist/cdn/reload-pin',
    '../../dist/cdn/reload-pin',
    '../../../dist/cdn/reload-pin',
    '../../../../dist/cdn/reload-pin'
  ];
  var pinUrl = null;
  var last = null;
  var interval = 1500;          // arranca en 1.5s
  var MAX_INTERVAL = 30000;     // tope: 30s
  var MAX_FAILS = 6;            // tras 6 fallos consecutivos sin dev-server, dar up
  var fails = 0;
  var timer = 0;

  function poll() {
    if (!pinUrl) return;
    fetch(pinUrl, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw 0;
        return r.text();
      })
      .then(function (h) {
        h = h.trim();
        fails = 0;
        if (interval !== 1500) interval = 1500; // reset a 1.5s en éxito
        if (last !== null && last !== h) {
          location.reload();
          return;
        }
        last = h;
        schedule();
      })
      .catch(function () {
        fails++;
        if (fails >= MAX_FAILS) {
          // Sin dev-server o server muerto: dejar de gastar batería.
          if (timer) clearTimeout(timer);
          return;
        }
        // Backoff exponencial: 1.5s → 3s → 6s → 12s → 24s → 30s.
        interval = Math.min(interval * 2, MAX_INTERVAL);
        schedule();
      });
  }
  function schedule() {
    if (timer) clearTimeout(timer);
    timer = setTimeout(poll, interval);
  }
  function probe(i) {
    if (i >= tries.length) return; // sin dev-server activo, no hacer nada
    fetch(tries[i], { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw 0;
        pinUrl = tries[i];
        last = null;
        schedule();
      })
      .catch(function () { probe(i + 1); });
  }
  // Esperar a que la página esté lista antes de empezar (no quemar el
  // primer frame de CPU + red en una página que aún no pintó).
  function start() {
    if (document.readyState === 'complete') probe(0);
    else window.addEventListener('load', function () { probe(0); }, { once: true });
  }
  start();
})();
</script>
</body>
</html>
