<!doctype html>
<html lang="es" class="theme-dark" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Demo — <is-sequence-diagram> · is-webcomponents</title>
<meta name="description" content="Diagrama de secuencia con actores, lifelines, mensajes sync/async/return y ramas alt." />
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #0c1118; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; }
  header { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); background: #0f1620; }
  header h1 { font-size: 16px; font-weight: 700; margin: 0; }
  header p { font-size: 12px; color: #94a3b8; margin: 4px 0 0 0; }
  main { display: grid; place-items: stretch; min-height: 0; padding: 12px; }
  is-sequence-diagram { width: 100%; height: 100%; min-height: 480px; display: block; }
  is-sequence-diagram:not(:defined) { visibility: hidden; }
</style>
<script type="module">
  await import('../../../dist/cdn/diagrams/sequence-diagram.min.js');
  await customElements.whenDefined('is-sequence-diagram');

  const el = document.createElement('is-sequence-diagram');
  el.payload = {
    sequence: {
      title: 'Login de usuario',
      subtitle: '4 actores · 5 mensajes · 1 rama alt',
      actors: [
        { id: 'u', label: 'Usuario' },
        { id: 'a', label: 'AuthAPI' },
        { id: 'db', label: 'DB' },
        { id: 'mail', label: 'Mailer' },
      ],
      messages: [
        { id: 'm1', from: 'u', to: 'a', label: 'login(email, pwd)' },
        { id: 'm2', from: 'a', to: 'db', label: 'buscarUsuario(email)' },
        { id: 'm3', from: 'db', to: 'a', label: 'row', kind: 'return' },
      ],
      alt: {
        branches: [
          {
            condition: 'pwd OK',
            messages: [
              { id: 'm4', from: 'a', to: 'u', label: 'session = JWT(...)', kind: 'return' },
            ],
          },
          {
            condition: 'pwd FAIL',
            messages: [
              { id: 'm5', from: 'a', to: 'mail', label: 'enviarAlerta()', kind: 'async' },
            ],
          },
        ],
      },
    },
  };
  document.querySelector('main').appendChild(el);

  document.documentElement.dataset.sequenceReady = '1';
</script>
</head>
<body>
  <header>
    <h1>Demo — <code>&lt;is-sequence-diagram&gt;</code></h1>
    <p>Diagrama de secuencia: lifelines verticales, mensajes sync/async/return, ramas <code>alt</code>.</p>
  </header>
  <main></main>
</body>
</html>
