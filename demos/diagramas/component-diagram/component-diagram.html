<!doctype html>
<html lang="es" class="theme-dark" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Demo — <is-component-diagram> · is-webcomponents</title>
<meta name="description" content="Diagrama de componentes UML (paquetes, componentes, interfaces lollipop, aristas)." />
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #0c1118; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; }
  header { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); background: #0f1620; }
  header h1 { font-size: 16px; font-weight: 700; margin: 0; }
  header p { font-size: 12px; color: #94a3b8; margin: 4px 0 0 0; }
  main { display: grid; place-items: stretch; min-height: 0; padding: 12px; }
  is-component-diagram { width: 100%; height: 100%; min-height: 480px; display: block; }
  is-component-diagram:not(:defined) { visibility: hidden; }
</style>
<script type="module">
  await import('../../../dist/cdn/diagrams/component-diagram.min.js');
  await customElements.whenDefined('is-component-diagram');

  const el = document.createElement('is-component-diagram');
  el.payload = {
    componentDiagram: {
      title: 'Servicio de autenticación',
      subtitle: '3 componentes · 2 interfaces · 2 aristas',
      // Sin package: layout plano en columnas (más espacio para aristas).
      components: [
        { id: 'api', name: 'AuthAPI', stereotype: 'component', x: 80, y: 60, w: 180, h: 70 },
        { id: 'svc', name: 'AuthService', stereotype: 'component', x: 320, y: 200, w: 180, h: 70 },
        { id: 'db', name: 'UserDB', stereotype: 'component', x: 580, y: 60, w: 120, h: 70 },
      ],
      interfaces: [
        { id: 'if1', component: 'svc', side: 'top', offset: 90, kind: 'provided', name: 'ILogin' },
        { id: 'if2', component: 'svc', side: 'top', offset: 90, kind: 'required', name: 'IStore' },
      ],
      edges: [
        // api depende de svc (diagonal)
        { id: 'e1', from: 'api', to: 'svc', kind: 'dependency' },
        // svc depende de db (diagonal)
        { id: 'e2', from: 'svc', to: 'db', kind: 'dependency' },
      ],
    },
  };
  document.querySelector('main').appendChild(el);

  document.documentElement.dataset.componentDiagramReady = '1';
</script>
</head>
<body>
  <header>
    <h1>Demo — <code>&lt;is-component-diagram&gt;</code></h1>
    <p>Diagrama de componentes UML: paquetes con pestaña, estereotipos y lollipops de interfaz.</p>
  </header>
  <main></main>
</body>
</html>
