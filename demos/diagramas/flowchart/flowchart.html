<!doctype html>
<html lang="es" class="theme-dark" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Demo — <is-flowchart> · is-webcomponents</title>
<meta name="description" content="Diagrama de flujo (sin Mermaid): nodos con shape, aristas con label y kind, layout node-link." />
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #0c1118; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; }
  header { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); background: #0f1620; }
  header h1 { font-size: 16px; font-weight: 700; margin: 0; }
  header p { font-size: 12px; color: #94a3b8; margin: 4px 0 0 0; }
  main { display: grid; place-items: stretch; min-height: 0; padding: 12px; }
  is-flowchart { width: 100%; height: 100%; min-height: 480px; display: block; }
  is-flowchart:not(:defined) { visibility: hidden; }
</style>
<script type="module">
  await import('../../../dist/cdn/diagrams/flowchart.min.js');
  await customElements.whenDefined('is-flowchart');

  const el = document.createElement('is-flowchart');
  el.setAttribute('animation', 'flow');
  el.payload = {
    flowchart: {
      title: 'Onboarding de usuario',
      subtitle: '4 nodos · 4 aristas · dirección LR',
      direction: 'LR',
      nodes: [
        { id: 'start', label: 'Inicio', shape: 'stadium' },
        { id: 'verify', label: '¿Email válido?', shape: 'diamond' },
        { id: 'create', label: 'Crear cuenta', shape: 'rect' },
        { id: 'done', label: 'Listo', shape: 'stadium' },
      ],
      edges: [
        { id: 'e1', from: 'start', to: 'verify' },
        { id: 'e2', from: 'verify', to: 'create', label: 'sí' },
        { id: 'e3', from: 'create', to: 'done' },
        { id: 'e4', from: 'verify', to: 'done', label: 'no', kind: 'dashed' },
      ],
    },
  };
  document.querySelector('main').appendChild(el);

  document.documentElement.dataset.flowchartReady = '1';
</script>
</head>
<body>
  <header>
    <h1>Demo — <code>&lt;is-flowchart&gt;</code></h1>
    <p>Layout node-link con capas + baricentro; aristas ruteadas con A*. Atributo <code>animation="flow"</code> activa aristas dashed brand.</p>
  </header>
  <main></main>
</body>
</html>
