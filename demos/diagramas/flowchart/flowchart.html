<!doctype html>
<html lang="es" class="theme-dark" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Demo — <is-flowchart></title>
<meta name="description" content="Demo de is-flowchart con varias formas (rect, diamond, stadium)." />
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #0c1118; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr auto; }
  header { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); background: #0f1620; }
  header h1 { font-size: 16px; font-weight: 700; margin: 0; }
  header p { font-size: 12px; color: #94a3b8; margin: 4px 0 0 0; }
  main { display: grid; padding: 20px; min-height: 420px; }
  is-flowchart { width: 100%; min-height: 400px; }
  is-flowchart:not(:defined) { visibility: hidden; }
  footer { padding: 12px 20px; border-top: 1px solid rgba(255,255,255,0.1); background: #0f1620; font-size: 11px; color: #94a3b8; }
  footer code { background: rgba(255,255,255,0.06); padding: 1px 5px; border-radius: 3px; font: 11px ui-monospace, Menlo, Consolas, monospace; }
</style>
<script type="module">
  await import('../../../dist/cdn/diagrams/flowchart.min.js');
  await customElements.whenDefined('is-flowchart');

  const el = document.createElement('is-flowchart');
  el.payload = {
    flowchart: {
      title: 'Login flow',
      subtitle: 'rect · diamond · stadium',
      direction: 'TB',
      nodes: [
        { id: 'start', shape: 'stadium', label: 'inicio' },
        { id: 'form', shape: 'rect', label: 'form login' },
        { id: 'valid', shape: 'diamond', label: 'credenciales OK?' },
        { id: 'home', shape: 'rect', label: 'home' },
        { id: 'error', shape: 'rect', label: 'muestra error' },
        { id: 'retry', shape: 'rect', label: 'reintentar' },
      ],
      edges: [
        { from: 'start', to: 'form' },
        { from: 'form', to: 'valid' },
        { from: 'valid', to: 'home', label: 'sí' },
        { from: 'valid', to: 'error', label: 'no' },
        { from: 'error', to: 'retry' },
        { from: 'retry', to: 'form' },
      ],
    },
  };
  document.getElementById('host').appendChild(el);

  document.documentElement.dataset.flowchartReady = '1';
</script>
</head>
<body>
<header>
  <h1>Demo <code>&lt;is-flowchart&gt;</code></h1>
  <p>Smoke: monta el componente, renderiza el SVG desde la spec JSON.</p>
</header>
<main><div id="host"></div></main>
<footer>Componente: <code>is-flowchart</code> · Spec: <code>flowchart-spec</code></footer>
</body>
</html>
