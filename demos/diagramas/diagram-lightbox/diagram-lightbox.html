<!doctype html>
<html lang="es" class="theme-dark" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Demo — <iswc-diagram-lightbox> · iswc-root</title>
<meta name="description" content="Visor a pantalla completa para diagramas (hereda de <iswc-lightbox> + barra tortuga + share)." />
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #0c1118; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; }
  header { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); background: #0f1620; }
  header h1 { font-size: 16px; font-weight: 700; margin: 0; }
  header p { font-size: 12px; color: #94a3b8; margin: 4px 0 0 0; }
  main { display: grid; place-items: center; gap: 16px; padding: 24px; }
  .controls { display: flex; gap: 12px; flex-wrap: wrap; }
  button { background: #1e293b; color: #e2e8f0; border: 1px solid rgba(255,255,255,0.18); border-radius: 6px; padding: 8px 14px; font: inherit; cursor: pointer; }
  button:hover { background: #334155; }
  .preview { max-width: 560px; padding: 12px; border: 1px solid rgba(255,255,255,0.18); border-radius: 8px; background: #0f1620; }
  .preview h3 { margin: 0 0 8px 0; font-size: 13px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.06em; }
  iswc-diagram-lightbox:not(:defined) { visibility: hidden; }
</style>
<script type="module">
  // Cargamos la luz base y el diagrama de secuencia para tener payload.
  await import('../../../dist/cdn/diagrams/diagram-lightbox.min.js?v=shrur4');
  await import('../../../dist/cdn/diagrams/sequence-diagram.min.js?v=h02w5m');
  await customElements.whenDefined('iswc-diagram-lightbox');

  const samplePayload = {
    sequence: {
      title: 'Login de usuario',
      actors: [
        { id: 'u', label: 'Usuario' },
        { id: 'a', label: 'AuthAPI' },
        { id: 'db', label: 'DB' },
      ],
      messages: [
        { from: 'u', to: 'a', label: 'login()' },
        { from: 'a', to: 'db', label: 'buscar()' },
        { from: 'db', to: 'a', label: 'rows' },
        { from: 'a', to: 'u', label: 'session' },
      ],
    },
  };

  // Crear el lightbox UNA vez, attached al body para que esté fuera del flujo.
  const lb = document.createElement('iswc-diagram-lightbox');
  lb.setAttribute('kind', 'sequence');
  lb.payload = samplePayload;
  lb.open = false; // empieza cerrado
  document.body.appendChild(lb);

  // Botones para abrir/cerrar manualmente — útil para el test.
  const open = document.getElementById('btn-open');
  const close = document.getElementById('btn-close');
  open.addEventListener('click', () => { lb.payload = samplePayload; lb.open = true; });
  close.addEventListener('click', () => { lb.open = false; });

  // Marcar ready cuando el lightbox ya está conectado.
  document.documentElement.dataset.diagramLightboxReady = '1';
</script>
</head>
<body>
  <header>
    <h1>Demo — <code>&lt;iswc-diagram-lightbox&gt;</code></h1>
    <p>Visor a pantalla completa con barra tortuga (play/pause/stop), share y código JSON.</p>
  </header>
  <main>
    <div class="controls">
      <button title="Abrir visor" id="btn-open" type="button">Abrir visor</button>
      <button title="Cerrar visor" id="btn-close" type="button">Cerrar visor</button>
    </div>
    <div class="preview">
      <h3>Estado</h3>
      <p>El lightbox se monta en <code>document.body</code>. Pulsa "Abrir visor" para verlo en pantalla completa.</p>
    </div>
  </main>
<script>
/* iswc-auto-rereload v2: backoff — polling client agnóstico del static server
 * W17: backoff exponencial + readyState wait + giveup tras MAX_FAILS fallos
 * consecutivos. Evita el loop infinito de reload-pin que vimos con Live
 * Server 5505 cuando el endpoint no responde. */
(function () {
  var tries = [
    'dist/cdn/reload-pin',
    '../dist/cdn/reload-pin',
    '../../dist/cdn/reload-pin',
    '../../../dist/cdn/reload-pin',
    '../../../../dist/cdn/reload-pin'
  ];
  var pinUrl = null;
  var last = null;
  var interval = 1500;          // arranca en 1.5s
  var MAX_INTERVAL = 30000;     // tope: 30s
  var MAX_FAILS = 6;            // tras 6 fallos consecutivos sin dev-server, dar up
  var fails = 0;
  var timer = 0;

  function poll() {
    if (!pinUrl) return;
    fetch(pinUrl, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw 0;
        return r.text();
      })
      .then(function (h) {
        h = h.trim();
        fails = 0;
        if (interval !== 1500) interval = 1500; // reset a 1.5s en éxito
        if (last !== null && last !== h) {
          location.reload();
          return;
        }
        last = h;
        schedule();
      })
      .catch(function () {
        fails++;
        if (fails >= MAX_FAILS) {
          // Sin dev-server o server muerto: dejar de gastar batería.
          if (timer) clearTimeout(timer);
          return;
        }
        // Backoff exponencial: 1.5s → 3s → 6s → 12s → 24s → 30s.
        interval = Math.min(interval * 2, MAX_INTERVAL);
        schedule();
      });
  }
  function schedule() {
    if (timer) clearTimeout(timer);
    timer = setTimeout(poll, interval);
  }
  function probe(i) {
    if (i >= tries.length) return; // sin dev-server activo, no hacer nada
    fetch(tries[i], { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw 0;
        pinUrl = tries[i];
        last = null;
        schedule();
      })
      .catch(function () { probe(i + 1); });
  }
  // Esperar a que la página esté lista antes de empezar (no quemar el
  // primer frame de CPU + red en una página que aún no pintó).
  function start() {
    if (document.readyState === 'complete') probe(0);
    else window.addEventListener('load', function () { probe(0); }, { once: true });
  }
  start();
})();
</script>
</body>
</html>
