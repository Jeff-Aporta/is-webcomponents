<!doctype html>
<html lang="es" class="theme-dark" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Demo — <iswc-sankey-diagram> · is-webcomponents</title>
<meta name="description" content="Diagrama Sankey: flujos entre nodos con grosor proporcional al valor." />
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #0c1118; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; }
  header { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); background: #0f1620; }
  header h1 { font-size: 16px; font-weight: 700; margin: 0; }
  header p { font-size: 12px; color: #94a3b8; margin: 4px 0 0 0; }
  main { display: grid; place-items: stretch; min-height: 0; padding: 12px; }
  iswc-sankey-diagram { width: 100%; height: 100%; min-height: 480px; display: block; }
  iswc-sankey-diagram:not(:defined) { visibility: hidden; }
</style>
<script type="module">
  await import('../../../dist/cdn/diagrams/sankey-diagram.min.js?h=1g2qv2');
  await customElements.whenDefined('iswc-sankey-diagram');

  const el = document.createElement('iswc-sankey-diagram');
  el.payload = {
    sankey: {
      title: 'Flujo de energía',
      subtitle: '4 nodos · 3 enlaces · total 100',
      nodes: [
        { id: 'src', label: 'Generación' },
        { id: 'grid', label: 'Red' },
        { id: 'home', label: 'Hogares' },
        { id: 'loss', label: 'Pérdidas' },
      ],
      links: [
        { id: 'l1', from: 'src', to: 'grid', value: 100 },
        { id: 'l2', from: 'grid', to: 'home', value: 70 },
        { id: 'l3', from: 'grid', to: 'loss', value: 30 },
      ],
    },
  };
  document.querySelector('main').appendChild(el);

  document.documentElement.dataset.sankeyReady = '1';
</script>
</head>
<body>
  <header>
    <h1>Demo — <code>&lt;iswc-sankey-diagram&gt;</code></h1>
    <p>Diagrama Sankey: el grosor del enlace codifica el valor. Sin auto-layout: las posiciones son la semilla.</p>
  </header>
  <main></main>
<script>
/* iswc-auto-reload: do not remove — polling client agnóstico del static server */
(function () {
  var tries = [
    'dist/cdn/reload-pin',
    '../dist/cdn/reload-pin',
    '../../dist/cdn/reload-pin',
    '../../../dist/cdn/reload-pin',
    '../../../../dist/cdn/reload-pin'
  ];
  var pinUrl = null;
  var last = null;
  function poll() {
    if (!pinUrl) return;
    fetch(pinUrl, { cache: 'no-store' })
      .then(function (r) { return r.text(); })
      .then(function (h) {
        h = h.trim();
        if (last !== null && last !== h) location.reload();
        last = h;
      })
      .catch(function () {});
  }
  function probe(i) {
    if (i >= tries.length) return; // sin dev-server activo, no hacer nada
    fetch(tries[i], { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw 0;
        pinUrl = tries[i];
        setInterval(poll, 1500);
      })
      .catch(function () { probe(i + 1); });
  }
  probe(0);
})();
</script>
</body>
</html>
