<!doctype html>
<html lang="es" class="theme-dark" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Demo — <iswc-journey-map> onboarding</title>
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #0c1118; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr auto; }
  header { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); background: #0f1620; }
  header h1 { font-size: 16px; font-weight: 700; margin: 0; }
  header p { font-size: 12px; color: #94a3b8; margin: 4px 0 0 0; }
  main { padding: 20px; display: grid; place-items: center; }
  iswc-journey-map { width: 100%; max-width: 1080px; height: 520px; display: block; }
  iswc-journey-map:not(:defined) { visibility: hidden; }
  footer { padding: 12px 20px; border-top: 1px solid rgba(255,255,255,0.1); background: #0f1620; font-size: 11px; color: #94a3b8; }
</style>
<script type="module">
  await import('../../../src/components/diagrams/journey-map.ts');
  await customElements.whenDefined('iswc-journey-map');

  const el = document.createElement('iswc-journey-map');
  el.payload = {
    title: 'Onboarding de nuevo cliente',
    subtitle: 'Satisfacción por paso (1–5)',
    scale: { min: 1, max: 5 },
    phases: [
      { id: 'discover', name: 'Descubrir' },
      { id: 'signup', name: 'Registro' },
      { id: 'first-use', name: 'Primer uso' },
    ],
    steps: [
      { id: 's1', phase: 'discover', label: 'Buscar solución', score: 4, actor: 'Visitante' },
      { id: 's2', phase: 'discover', label: 'Comparar opciones', score: 3, actor: 'Visitante' },
      { id: 's3', phase: 'signup', label: 'Crear cuenta', score: 4, actor: 'Visitante → Cliente' },
      { id: 's4', phase: 'signup', label: 'Verificar email', score: 2, actor: 'Cliente' },
      { id: 's5', phase: 'first-use', label: 'Tutorial', score: 5, actor: 'Cliente' },
      { id: 's6', phase: 'first-use', label: 'Crear primer proyecto', score: 5, actor: 'Cliente' },
    ],
  };
  document.getElementById('host').appendChild(el);

  document.documentElement.dataset.journeyReady = '1';
</script>
</head>
<body>
<header>
  <h1>Demo funcional — <code>&lt;iswc-journey-map&gt;</code></h1>
  <p>3 fases, 6 pasos con score 1–5 y responsable por paso.</p>
</header>
<main>
  <div id="host"></div>
</main>
<footer>
  Estado: curva une solo pasos con <code>score</code>; bandas de fase agrupadas contiguamente.
</footer>
<script>
/* iswc-auto-rereload v2: backoff — polling client agnóstico del static server
 * W17: backoff exponencial + readyState wait + giveup tras MAX_FAILS fallos
 * consecutivos. Evita el loop infinito de reload-pin que vimos con Live
 * Server 5505 cuando el endpoint no responde. */
(function () {
  var tries = [
    'dist/cdn/reload-pin',
    '../dist/cdn/reload-pin',
    '../../dist/cdn/reload-pin',
    '../../../dist/cdn/reload-pin',
    '../../../../dist/cdn/reload-pin'
  ];
  var pinUrl = null;
  var last = null;
  var interval = 1500;          // arranca en 1.5s
  var MAX_INTERVAL = 30000;     // tope: 30s
  var MAX_FAILS = 6;            // tras 6 fallos consecutivos sin dev-server, dar up
  var fails = 0;
  var timer = 0;

  function poll() {
    if (!pinUrl) return;
    fetch(pinUrl, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw 0;
        return r.text();
      })
      .then(function (h) {
        h = h.trim();
        fails = 0;
        if (interval !== 1500) interval = 1500; // reset a 1.5s en éxito
        if (last !== null && last !== h) {
          location.reload();
          return;
        }
        last = h;
        schedule();
      })
      .catch(function () {
        fails++;
        if (fails >= MAX_FAILS) {
          // Sin dev-server o server muerto: dejar de gastar batería.
          if (timer) clearTimeout(timer);
          return;
        }
        // Backoff exponencial: 1.5s → 3s → 6s → 12s → 24s → 30s.
        interval = Math.min(interval * 2, MAX_INTERVAL);
        schedule();
      });
  }
  function schedule() {
    if (timer) clearTimeout(timer);
    timer = setTimeout(poll, interval);
  }
  function probe(i) {
    if (i >= tries.length) return; // sin dev-server activo, no hacer nada
    fetch(tries[i], { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw 0;
        pinUrl = tries[i];
        last = null;
        schedule();
      })
      .catch(function () { probe(i + 1); });
  }
  // Esperar a que la página esté lista antes de empezar (no quemar el
  // primer frame de CPU + red en una página que aún no pintó).
  function start() {
    if (document.readyState === 'complete') probe(0);
    else window.addEventListener('load', function () { probe(0); }, { once: true });
  }
  start();
})();
</script>
</body>
</html>
