<!doctype html>
<html lang="es" class="theme-dark" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Demo — <iswc-swimlane-diagram></title>
<meta name="description" content="Demo de iswc-swimlane-diagram con 3 carriles y 5 pasos incl. decisión." />
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #0c1118; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr auto; }
  header { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); background: #0f1620; }
  header h1 { font-size: 16px; font-weight: 700; margin: 0; }
  header p { font-size: 12px; color: #94a3b8; margin: 4px 0 0 0; }
  main { display: grid; padding: 20px; min-height: 420px; }
  iswc-swimlane-diagram { width: 100%; min-height: 400px; }
  iswc-swimlane-diagram:not(:defined) { visibility: hidden; }
  footer { padding: 12px 20px; border-top: 1px solid rgba(255,255,255,0.1); background: #0f1620; font-size: 11px; color: #94a3b8; }
  footer code { background: rgba(255,255,255,0.06); padding: 1px 5px; border-radius: 3px; font: 11px ui-monospace, Menlo, Consolas, monospace; }
</style>
<script type="module">
  await import('../../../dist/cdn/diagrams/swimlane-diagram.min.js?h=8hpe9m');
  await customElements.whenDefined('iswc-swimlane-diagram');

  const el = document.createElement('iswc-swimlane-diagram');
  el.payload = {
    swimlane: {
      title: 'Proceso de pedido',
      subtitle: 'carriles cliente · ops · envío',
      lanes: [
        { id: 'cli', name: 'Cliente', hue: 210 },
        { id: 'ops', name: 'Operaciones', hue: 38 },
        { id: 'env', name: 'Envío', hue: 160 },
      ],
      steps: [
        { id: 's1', lane: 'cli', kind: 'start', label: 'inicio' },
        { id: 's2', lane: 'cli', kind: 'process', label: 'hace pedido' },
        { id: 's3', lane: 'ops', kind: 'process', label: 'valida stock' },
        { id: 's4', lane: 'ops', kind: 'decision', label: 'hay stock?' },
        { id: 's5', lane: 'env', kind: 'process', label: 'prepara envío' },
        { id: 's6', lane: 'env', kind: 'end', label: 'entregado' },
      ],
      links: [
        { from: 's1', to: 's2' },
        { from: 's2', to: 's3' },
        { from: 's3', to: 's4' },
        { from: 's4', to: 's5', label: 'sí' },
        { from: 's5', to: 's6' },
        { from: 's4', to: 's2', label: 'no · repetir' },
      ],
    },
  };
  document.getElementById('host').appendChild(el);

  document.documentElement.dataset.swimlaneReady = '1';
</script>
</head>
<body>
<header>
  <h1>Demo <code>&lt;iswc-swimlane-diagram&gt;</code></h1>
  <p>Smoke: monta el componente, renderiza el SVG desde la spec JSON.</p>
</header>
<main><div id="host"></div></main>
<footer>Componente: <code>iswc-swimlane-diagram</code> · Spec: <code>swimlane-spec</code></footer>
<script>
/* iswc-auto-reload: do not remove — polling client agnóstico del static server */
(function () {
  var tries = [
    'dist/cdn/reload-pin',
    '../dist/cdn/reload-pin',
    '../../dist/cdn/reload-pin',
    '../../../dist/cdn/reload-pin',
    '../../../../dist/cdn/reload-pin'
  ];
  var pinUrl = null;
  var last = null;
  function poll() {
    if (!pinUrl) return;
    fetch(pinUrl, { cache: 'no-store' })
      .then(function (r) { return r.text(); })
      .then(function (h) {
        h = h.trim();
        if (last !== null && last !== h) location.reload();
        last = h;
      })
      .catch(function () {});
  }
  function probe(i) {
    if (i >= tries.length) return; // sin dev-server activo, no hacer nada
    fetch(tries[i], { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw 0;
        pinUrl = tries[i];
        setInterval(poll, 1500);
      })
      .catch(function () { probe(i + 1); });
  }
  probe(0);
})();
</script>
</body>
</html>
