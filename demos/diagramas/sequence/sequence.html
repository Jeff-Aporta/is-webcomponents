<!doctype html>
<html lang="es" class="theme-dark" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Demo — <iswc-sequence-diagram></title>
<meta name="description" content="Demo de iswc-sequence-diagram con 3 actores y 5 mensajes incl. self-loop." />
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #0c1118; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr auto; }
  header { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); background: #0f1620; }
  header h1 { font-size: 16px; font-weight: 700; margin: 0; }
  header p { font-size: 12px; color: #94a3b8; margin: 4px 0 0 0; }
  main { display: grid; padding: 20px; min-height: 420px; }
  iswc-sequence-diagram { width: 100%; min-height: 400px; }
  iswc-sequence-diagram:not(:defined) { visibility: hidden; }
  footer { padding: 12px 20px; border-top: 1px solid rgba(255,255,255,0.1); background: #0f1620; font-size: 11px; color: #94a3b8; }
  footer code { background: rgba(255,255,255,0.06); padding: 1px 5px; border-radius: 3px; font: 11px ui-monospace, Menlo, Consolas, monospace; }
</style>
<script type="module">
  await import('../../../dist/cdn/diagrams/sequence-diagram.min.js?h=nrcpdz');
  await customElements.whenDefined('iswc-sequence-diagram');

  const el = document.createElement('iswc-sequence-diagram');
  el.payload = {
    sequence: {
      title: 'Demo secuencia',
      subtitle: '3 actores · 1 self-loop',
      actors: [
        { id: 'U', label: '{{iconify: {icon: "mdi:account", hue: 239}}} Usuario', kind: 'actor' },
        { id: 'A', label: '{{iconify: {icon: "mdi:robot-outline", hue: 199}}} Paty', kind: 'participant' },
        { id: 'D', label: '{{iconify: {icon: "mdi:database", hue: 210}}} BD', kind: 'participant' },
      ],
      messages: [
        { id: 'm1', from: 'U', to: 'A', label: 'saluda', log: 'usuario saluda', step: 1 },
        { id: 'm2', from: 'A', to: 'A', label: 'log turno', kind: 'self', log: 'autopersistencia', step: 2 },
        { id: 'm3', from: 'A', to: 'D', label: 'query SELECT', log: 'consulta BD', step: 3 },
        { id: 'm4', from: 'D', to: 'A', label: 'filas[]', kind: 'async', log: 'resultados', step: 4 },
        { id: 'm5', from: 'A', to: 'U', label: 'responde', log: 'respuesta al usuario', step: 5 },
      ],
    },
  };
  document.getElementById('host').appendChild(el);

  document.documentElement.dataset.sequenceReady = '1';
</script>
</head>
<body>
<header>
  <h1>Demo <code>&lt;iswc-sequence-diagram&gt;</code></h1>
  <p>Smoke: monta el componente, renderiza el SVG desde la spec JSON.</p>
</header>
<main><div id="host"></div></main>
<footer>Componente: <code>iswc-sequence-diagram</code> · Spec: <code>sequence-spec</code></footer>
<script>
/* iswc-auto-rereload v2: backoff — polling client agnóstico del static server
 * W17: backoff exponencial + readyState wait + giveup tras MAX_FAILS fallos
 * consecutivos. Evita el loop infinito de reload-pin que vimos con Live
 * Server 5505 cuando el endpoint no responde. */
(function () {
  var tries = [
    'dist/cdn/reload-pin',
    '../dist/cdn/reload-pin',
    '../../dist/cdn/reload-pin',
    '../../../dist/cdn/reload-pin',
    '../../../../dist/cdn/reload-pin'
  ];
  var pinUrl = null;
  var last = null;
  var interval = 1500;          // arranca en 1.5s
  var MAX_INTERVAL = 30000;     // tope: 30s
  var MAX_FAILS = 6;            // tras 6 fallos consecutivos sin dev-server, dar up
  var fails = 0;
  var timer = 0;

  function poll() {
    if (!pinUrl) return;
    fetch(pinUrl, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw 0;
        return r.text();
      })
      .then(function (h) {
        h = h.trim();
        fails = 0;
        if (interval !== 1500) interval = 1500; // reset a 1.5s en éxito
        if (last !== null && last !== h) {
          location.reload();
          return;
        }
        last = h;
        schedule();
      })
      .catch(function () {
        fails++;
        if (fails >= MAX_FAILS) {
          // Sin dev-server o server muerto: dejar de gastar batería.
          if (timer) clearTimeout(timer);
          return;
        }
        // Backoff exponencial: 1.5s → 3s → 6s → 12s → 24s → 30s.
        interval = Math.min(interval * 2, MAX_INTERVAL);
        schedule();
      });
  }
  function schedule() {
    if (timer) clearTimeout(timer);
    timer = setTimeout(poll, interval);
  }
  function probe(i) {
    if (i >= tries.length) return; // sin dev-server activo, no hacer nada
    fetch(tries[i], { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw 0;
        pinUrl = tries[i];
        last = null;
        schedule();
      })
      .catch(function () { probe(i + 1); });
  }
  // Esperar a que la página esté lista antes de empezar (no quemar el
  // primer frame de CPU + red en una página que aún no pintó).
  function start() {
    if (document.readyState === 'complete') probe(0);
    else window.addEventListener('load', function () { probe(0); }, { once: true });
  }
  start();
})();
</script>
</body>
</html>
