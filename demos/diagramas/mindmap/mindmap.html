<!doctype html>
<html lang="es" class="theme-dark" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Demo — <iswc-mindmap> · iswc-root</title>
<meta name="description" content="Mapa mental en SVG (sin Mermaid) con layout radial." />
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #0c1118; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; }
  header { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); background: #0f1620; }
  header h1 { font-size: 16px; font-weight: 700; margin: 0; }
  header p { font-size: 12px; color: #94a3b8; margin: 4px 0 0 0; }
  main { display: grid; place-items: stretch; min-height: 0; padding: 12px; }
  iswc-mindmap { width: 100%; height: 100%; min-height: 480px; display: block; }
  iswc-mindmap:not(:defined) { visibility: hidden; }
</style>
<script type="module">
  await import('../../../dist/cdn/diagrams/mindmap.min.js?v=6n4kzu');
  await customElements.whenDefined('iswc-mindmap');

  const el = document.createElement('iswc-mindmap');
  el.payload = {
    mindmap: {
      title: 'Plan de lanzamiento',
      subtitle: '1 raíz · 3 ramas · 6 hojas',
      layout: 'radial',
      nodes: [
        { id: 'root', label: 'Lanzamiento', kind: 'root' },
        { id: 'mkt', label: 'Marketing', kind: 'branch', parent: 'root' },
        { id: 'prod', label: 'Producto', kind: 'branch', parent: 'root' },
        { id: 'ops', label: 'Operaciones', kind: 'branch', parent: 'root' },
        { id: 'mkt-1', label: 'Blog post', kind: 'leaf', parent: 'mkt' },
        { id: 'mkt-2', label: 'Redes', kind: 'leaf', parent: 'mkt' },
        { id: 'prod-1', label: 'Beta cerrada', kind: 'leaf', parent: 'prod' },
        { id: 'prod-2', label: 'Pricing', kind: 'leaf', parent: 'prod' },
        { id: 'ops-1', label: 'Infraestructura', kind: 'leaf', parent: 'ops' },
        { id: 'ops-2', label: 'Soporte', kind: 'leaf', parent: 'ops' },
      ],
    },
  };
  document.querySelector('main').appendChild(el);

  document.documentElement.dataset.mindmapReady = '1';
</script>
</head>
<body>
  <header>
    <h1>Demo — <code>&lt;iswc-mindmap&gt;</code></h1>
    <p>Layout radial: raíz central con ramas (pill) y hojas (subrayado). Hover resalta el subárbol.</p>
  </header>
  <main></main>
<script>
/* iswc-auto-rereload v2: backoff — polling client agnóstico del static server
 * W17: backoff exponencial + readyState wait + giveup tras MAX_FAILS fallos
 * consecutivos. Evita el loop infinito de reload-pin que vimos con Live
 * Server 5505 cuando el endpoint no responde. */
(function () {
  var tries = [
    'dist/cdn/reload-pin',
    '../dist/cdn/reload-pin',
    '../../dist/cdn/reload-pin',
    '../../../dist/cdn/reload-pin',
    '../../../../dist/cdn/reload-pin'
  ];
  var pinUrl = null;
  var last = null;
  var interval = 1500;          // arranca en 1.5s
  var MAX_INTERVAL = 30000;     // tope: 30s
  var MAX_FAILS = 6;            // tras 6 fallos consecutivos sin dev-server, dar up
  var fails = 0;
  var timer = 0;

  function poll() {
    if (!pinUrl) return;
    fetch(pinUrl, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw 0;
        return r.text();
      })
      .then(function (h) {
        h = h.trim();
        fails = 0;
        if (interval !== 1500) interval = 1500; // reset a 1.5s en éxito
        if (last !== null && last !== h) {
          location.reload();
          return;
        }
        last = h;
        schedule();
      })
      .catch(function () {
        fails++;
        if (fails >= MAX_FAILS) {
          // Sin dev-server o server muerto: dejar de gastar batería.
          if (timer) clearTimeout(timer);
          return;
        }
        // Backoff exponencial: 1.5s → 3s → 6s → 12s → 24s → 30s.
        interval = Math.min(interval * 2, MAX_INTERVAL);
        schedule();
      });
  }
  function schedule() {
    if (timer) clearTimeout(timer);
    timer = setTimeout(poll, interval);
  }
  function probe(i) {
    if (i >= tries.length) return; // sin dev-server activo, no hacer nada
    fetch(tries[i], { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw 0;
        pinUrl = tries[i];
        last = null;
        schedule();
      })
      .catch(function () { probe(i + 1); });
  }
  // Esperar a que la página esté lista antes de empezar (no quemar el
  // primer frame de CPU + red en una página que aún no pintó).
  function start() {
    if (document.readyState === 'complete') probe(0);
    else window.addEventListener('load', function () { probe(0); }, { once: true });
  }
  start();
})();
</script>
</body>
</html>
