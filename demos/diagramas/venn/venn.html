<!doctype html>
<html lang="es" class="theme-dark" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Demo — <iswc-venn-diagram> 2 conjuntos</title>
<meta name="description" content="Demo funcional del componente iswc-venn-diagram con dos conjuntos y una región compartida." />
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #0c1118; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr auto; }
  header { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); background: #0f1620; }
  header h1 { font-size: 16px; font-weight: 700; margin: 0; }
  header p { font-size: 12px; color: #94a3b8; margin: 4px 0 0 0; }
  main { padding: 20px; display: grid; place-items: center; }
  iswc-venn-diagram { width: 720px; height: 480px; display: block; }
  iswc-venn-diagram:not(:defined) { visibility: hidden; }
  footer { padding: 12px 20px; border-top: 1px solid rgba(255,255,255,0.1); background: #0f1620; font-size: 11px; color: #94a3b8; }
</style>
<script type="module">
  await import('../../../src/components/diagrams/venn-diagram.ts');
  await customElements.whenDefined('iswc-venn-diagram');

  const el = document.createElement('iswc-venn-diagram');
  el.payload = {
    title: 'Back-end vs Front-end',
    subtitle: 'Lenguajes comunes en cada lado',
    sets: [
      { id: 'fe', label: 'Front-end' },
      { id: 'be', label: 'Back-end' },
    ],
    regions: [
      { sets: ['fe'], label: 'JS / TS / HTML' },
      { sets: ['be'], label: 'Go / Java / Rust' },
      { sets: ['fe', 'be'], label: 'TypeScript' },
    ],
  };
  document.getElementById('host').appendChild(el);

  document.documentElement.dataset.vennReady = '1';
</script>
</head>
<body>
<header>
  <h1>Demo funcional — <code>&lt;iswc-venn-diagram&gt;</code></h1>
  <p>Dos conjuntos (Front-end / Back-end) con regiones exclusivas e intersección.</p>
</header>
<main>
  <div id="host"></div>
</main>
<footer>
  Estado: spec normalizada vía <code>resolveVennSpec</code>; layout vía <code>computeVennLayout</code>.
</footer>
<script>
/* iswc-auto-rereload v2: backoff — polling client agnóstico del static server
 * W17: backoff exponencial + readyState wait + giveup tras MAX_FAILS fallos
 * consecutivos. Evita el loop infinito de reload-pin que vimos con Live
 * Server 5505 cuando el endpoint no responde. */
(function () {
  var tries = [
    'dist/cdn/reload-pin',
    '../dist/cdn/reload-pin',
    '../../dist/cdn/reload-pin',
    '../../../dist/cdn/reload-pin',
    '../../../../dist/cdn/reload-pin'
  ];
  var pinUrl = null;
  var last = null;
  var interval = 1500;          // arranca en 1.5s
  var MAX_INTERVAL = 30000;     // tope: 30s
  var MAX_FAILS = 6;            // tras 6 fallos consecutivos sin dev-server, dar up
  var fails = 0;
  var timer = 0;

  function poll() {
    if (!pinUrl) return;
    fetch(pinUrl, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw 0;
        return r.text();
      })
      .then(function (h) {
        h = h.trim();
        fails = 0;
        if (interval !== 1500) interval = 1500; // reset a 1.5s en éxito
        if (last !== null && last !== h) {
          location.reload();
          return;
        }
        last = h;
        schedule();
      })
      .catch(function () {
        fails++;
        if (fails >= MAX_FAILS) {
          // Sin dev-server o server muerto: dejar de gastar batería.
          if (timer) clearTimeout(timer);
          return;
        }
        // Backoff exponencial: 1.5s → 3s → 6s → 12s → 24s → 30s.
        interval = Math.min(interval * 2, MAX_INTERVAL);
        schedule();
      });
  }
  function schedule() {
    if (timer) clearTimeout(timer);
    timer = setTimeout(poll, interval);
  }
  function probe(i) {
    if (i >= tries.length) return; // sin dev-server activo, no hacer nada
    fetch(tries[i], { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw 0;
        pinUrl = tries[i];
        last = null;
        schedule();
      })
      .catch(function () { probe(i + 1); });
  }
  // Esperar a que la página esté lista antes de empezar (no quemar el
  // primer frame de CPU + red en una página que aún no pintó).
  function start() {
    if (document.readyState === 'complete') probe(0);
    else window.addEventListener('load', function () { probe(0); }, { once: true });
  }
  start();
})();
</script>
</body>
</html>
