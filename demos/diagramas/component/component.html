<!doctype html>
<html lang="es" class="theme-light" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Demo — <iswc-component-diagram> arquitectura Azure</title>
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #ffffff; color: #1f2937; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr auto; }
  header { padding: 16px 20px; border-bottom: 1px solid rgba(0,0,0,0.08); background: #f9fafb; }
  header h1 { font-size: 16px; font-weight: 700; margin: 0; }
  header p { font-size: 12px; color: #6b7280; margin: 4px 0 0 0; }
  main { padding: 20px; }
  iswc-component-diagram { width: 100%; height: 600px; display: block; }
  iswc-component-diagram:not(:defined) { visibility: hidden; }
  footer { padding: 12px 20px; border-top: 1px solid rgba(0,0,0,0.08); background: #f9fafb; font-size: 11px; color: #6b7280; }
</style>
<script type="module">
  await import('../../../src/components/diagrams/component-diagram.ts');
  await customElements.whenDefined('iswc-component-diagram');

  const el = document.createElement('iswc-component-diagram');
  el.payload = {
    title: 'Arquitectura Azure',
    packages: [
      { id: 'azure', name: 'Azure', x: 320, y: 30, w: 460, h: 380 },
    ],
    components: [
      { id: 'cliente', name: 'Cliente Web', package: 'azure', stereotype: 'component', x: 360, y: 70, w: 180, h: 56 },
      { id: 'api', name: 'API', package: 'azure', stereotype: 'component', x: 360, y: 160, w: 180, h: 56, provides: ['IBilling', 'IAuth'], requires: ['IData'] },
      { id: 'billing', name: 'Billing Service', package: 'azure', stereotype: 'component', x: 360, y: 260, w: 180, h: 56, provides: ['IBilling'] },
      { id: 'auth', name: 'Auth Service', package: 'azure', stereotype: 'component', x: 580, y: 160, w: 160, h: 56, provides: ['IAuth'] },
      { id: 'db', name: 'Azure SQL', package: 'azure', stereotype: 'component', x: 360, y: 350, w: 180, h: 56, provides: ['IData'] },
    ],
    edges: [
      { from: 'cliente', to: 'api', kind: 'dependency' },
      { from: 'billing', to: 'api' },
      { from: 'auth', to: 'api' },
    ],
  };
  document.getElementById('host').appendChild(el);

  document.documentElement.dataset.componentReady = '1';
</script>
</head>
<body>
<header>
  <h1>Demo funcional — <code>&lt;iswc-component-diagram&gt;</code></h1>
  <p>Diagrama UML con 5 componentes, paquete contenedor y lollipops provided/required.</p>
</header>
<main>
  <div id="host"></div>
</main>
<footer>
  Estado: pack automático; interfaces generadas desde <code>provides/requires</code>.
</footer>
<script>
/* iswc-auto-reload: do not remove — polling client agnóstico del static server */
(function () {
  var tries = [
    'dist/cdn/reload-pin',
    '../dist/cdn/reload-pin',
    '../../dist/cdn/reload-pin',
    '../../../dist/cdn/reload-pin',
    '../../../../dist/cdn/reload-pin'
  ];
  var pinUrl = null;
  var last = null;
  function poll() {
    if (!pinUrl) return;
    fetch(pinUrl, { cache: 'no-store' })
      .then(function (r) { return r.text(); })
      .then(function (h) {
        h = h.trim();
        if (last !== null && last !== h) location.reload();
        last = h;
      })
      .catch(function () {});
  }
  function probe(i) {
    if (i >= tries.length) return; // sin dev-server activo, no hacer nada
    fetch(tries[i], { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw 0;
        pinUrl = tries[i];
        setInterval(poll, 1500);
      })
      .catch(function () { probe(i + 1); });
  }
  probe(0);
})();
</script>
</body>
</html>
