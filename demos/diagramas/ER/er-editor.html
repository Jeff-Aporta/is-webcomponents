<!doctype html>
<html lang="es" class="theme-dark" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Editor visual de <iswc-er-diagram> · iswc-root</title>
<meta name="description" content="Editor visual completo (drag, click-to-connect, multi-select, undo/redo, panel de estilos, export JSON/SVG) para diagramas entidad-relación." />
<link rel="stylesheet" href="../../../dist/cdn/is-base.min.css?v=lzjggg" />
<link rel="stylesheet" href="../../../dist/cdn/palettes.min.css?v=o3iv67" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: var(--iswc-bg); color: var(--iswc-text); font-family: var(--iswc-ui, ui-sans-serif, system-ui, sans-serif); }
  body { display: grid; grid-template-rows: auto 1fr; }
  header {
    padding: 12px 20px; border-bottom: 1px solid var(--iswc-border);
    display: flex; align-items: center; gap: 14px; background: var(--iswc-bg-elev);
  }
  header h1 { font-size: 15px; font-weight: 700; margin: 0; }
  header p { font-size: 12px; color: var(--iswc-text-soft); margin: 0; }
  header .spacer { flex: 1; }
  header kbd { background: var(--iswc-control-bg); border: 1px solid var(--iswc-border); padding: 1px 5px; border-radius: 4px; font: 11px var(--iswc-mono, ui-monospace, Menlo, Consolas, monospace); }
  main { display: grid; place-items: stretch; min-height: 0; padding: 12px; }
  iswc-er-editor { width: 100%; height: 100%; }
  /* Anti-FOUC */
  iswc-er-editor:not(:defined) { visibility: hidden; }
  iswc-er-diagram:not(:defined) { visibility: hidden; }
</style>
<script type="module">
  // Cargar solo los tags que necesitamos, desde los bundles pre-construidos en
  // dist/cdn/. Esto hace funcionar los demos con cualquier servidor estático
  // (incluido VS Code Live Server), no solo con el dev server que transpila TS.
  await import('../../../dist/cdn/diagrams/er-diagram.min.js?v=ptc1i7');
  await import('../../../dist/cdn/feedback/theme-toggle.min.js?v=h1xfip');
  await import('../../../dist/cdn/diagrams/er-editor.min.js?v=slq8kt');

  // Definir un payload inicial para que el editor tenga algo que mostrar.
  const initial = {
    entities: [
      { id: 'user', name: 'Usuario', attributes: [
        { name: 'id', key: 'PK', type: 'uuid' },
        { name: 'email', key: 'UK', type: 'string' },
        { name: 'created_at', type: 'datetime' },
      ], pos: [120, 80] },
      { id: 'order', name: 'Pedido', attributes: [
        { name: 'id', key: 'PK', type: 'uuid' },
        { name: 'total', type: 'decimal' },
        { name: 'user_id', key: 'FK', type: 'uuid' },
      ], pos: [440, 80] },
      { id: 'product', name: 'Producto', attributes: [
        { name: 'id', key: 'PK', type: 'uuid' },
        { name: 'sku', key: 'UK', type: 'string' },
        { name: 'price', type: 'decimal' },
      ], pos: [120, 320] },
    ],
    relations: [
      { id: 'r1', from: 'user', to: 'order', label: 'places', fromCard: 'one', toCard: 'many', identifying: true },
      { id: 'r2', from: 'order', to: 'product', label: 'contains', fromCard: 'many', toCard: 'many', identifying: false, dashStyle: 'dashed' },
    ],
  };

  // Esperar a que el custom element se defina
  await customElements.whenDefined('iswc-er-editor');

  // Crear el editor y asignar payload
  const editor = document.createElement('iswc-er-editor');
  editor.setAttribute('animation', 'trace');
  editor.payload = initial;

  // Escuchar cambios de estado para logging (útil en tests)
  editor.addEventListener('iswc-state-change', (e) => {
    console.log('[er-editor] state changed', e.detail);
  });

  document.querySelector('main').appendChild(editor);
  document.documentElement.dataset.erEditorReady = '1';
</script>
</head>
<body>
<header>
  <div>
    <h1>Editor visual — Diagrama Entidad-Relación</h1>
    <p>Arrastra para mover · <kbd>Shift</kbd>+clic selección múltiple · doble clic edita el texto · <kbd>Ctrl</kbd>+<kbd>Z</kbd> deshace</p>
  </div>
  <div class="spacer"></div>
  <iswc-theme-toggle aria-label="Cambiar tema claro/oscuro"></iswc-theme-toggle>
</header>
<main></main>
<script>
/* iswc-auto-rereload v2: backoff — polling client agnóstico del static server
 * W17: backoff exponencial + readyState wait + giveup tras MAX_FAILS fallos
 * consecutivos. Evita el loop infinito de reload-pin que vimos con Live
 * Server 5505 cuando el endpoint no responde. */
(function () {
  var tries = [
    'dist/cdn/reload-pin',
    '../dist/cdn/reload-pin',
    '../../dist/cdn/reload-pin',
    '../../../dist/cdn/reload-pin',
    '../../../../dist/cdn/reload-pin'
  ];
  var pinUrl = null;
  var last = null;
  var interval = 1500;          // arranca en 1.5s
  var MAX_INTERVAL = 30000;     // tope: 30s
  var MAX_FAILS = 6;            // tras 6 fallos consecutivos sin dev-server, dar up
  var fails = 0;
  var timer = 0;

  function poll() {
    if (!pinUrl) return;
    fetch(pinUrl, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw 0;
        return r.text();
      })
      .then(function (h) {
        h = h.trim();
        fails = 0;
        if (interval !== 1500) interval = 1500; // reset a 1.5s en éxito
        if (last !== null && last !== h) {
          location.reload();
          return;
        }
        last = h;
        schedule();
      })
      .catch(function () {
        fails++;
        if (fails >= MAX_FAILS) {
          // Sin dev-server o server muerto: dejar de gastar batería.
          if (timer) clearTimeout(timer);
          return;
        }
        // Backoff exponencial: 1.5s → 3s → 6s → 12s → 24s → 30s.
        interval = Math.min(interval * 2, MAX_INTERVAL);
        schedule();
      });
  }
  function schedule() {
    if (timer) clearTimeout(timer);
    timer = setTimeout(poll, interval);
  }
  function probe(i) {
    if (i >= tries.length) return; // sin dev-server activo, no hacer nada
    fetch(tries[i], { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw 0;
        pinUrl = tries[i];
        last = null;
        schedule();
      })
      .catch(function () { probe(i + 1); });
  }
  // Esperar a que la página esté lista antes de empezar (no quemar el
  // primer frame de CPU + red en una página que aún no pintó).
  function start() {
    if (document.readyState === 'complete') probe(0);
    else window.addEventListener('load', function () { probe(0); }, { once: true });
  }
  start();
})();
</script>
</body>
</html>
