<!doctype html>
<html lang="es" class="theme-dark" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Demo &lt;iswc-avatar&gt; · is-webcomponents</title>
<meta name="description" content="Avatares con imagen, iniciales o icono fallback. Tres variantes (image/initials/icon), formas (circle/rounded/square) y estados de carga y error." />
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #0c1118; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr auto; }
  header { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); background: #0f1620; }
  header h1 { font-size: 16px; font-weight: 700; margin: 0; }
  header p { font-size: 12px; color: #94a3b8; margin: 4px 0 0 0; }
  main { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 20px; align-content: start; }
  section { background: #0f1620; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 16px; min-height: 160px; }
  section h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; margin: 0 0 12px 0; color: #94a3b8; font-weight: 600; }
  .row { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .row > * { font-size: 3rem; line-height: 1; }
  footer { padding: 12px 20px; border-top: 1px solid rgba(255,255,255,0.1); background: #0f1620; font-size: 11px; color: #94a3b8; }
  footer code { background: rgba(255,255,255,0.06); padding: 1px 5px; border-radius: 3px; font: 11px ui-monospace, Menlo, Consolas, monospace; }
  /* Anti-FOUC */
  iswc-avatar:not(:defined) { visibility: hidden; }
</style>
<script type="module">
  // Cargar solo los tags que necesitamos, desde los bundles pre-construidos
  // en dist/cdn/. Esto hace funcionar los demos con cualquier servidor
  // estático, no solo con el dev server que transpila TS.
  await import('../../../dist/cdn/media/icon.min.js?h=nfimcf');
  await import('../../../dist/cdn/media/avatar.min.js?h=upgh8n');
  await customElements.whenDefined('iswc-avatar');

  // Suscribirse a iswc-error para surfacing en consola (útil para tests)
  document.querySelectorAll('iswc-avatar').forEach((el) => {
    el.addEventListener('iswc-error', (e) => {
      console.log('[avatar] iswc-error', e.detail);
      document.documentElement.dataset.avatarErrorFired = '1';
    });
  });

  document.documentElement.dataset.avatarReady = '1';
</script>
</head>
<body>
<header>
  <h1>Demo — <code>&lt;iswc-avatar&gt;</code></h1>
  <p>Tres estados: imagen, iniciales, icono. Caja = <code>1em × 1em</code> (escala con font-size).</p>
</header>
<main>
  <section>
    <h2>Iniciales</h2>
    <div class="row">
      <iswc-avatar initials="JD" label="Jane Doe"></iswc-avatar>
      <iswc-avatar initials="AB" shape="rounded" label="AB"></iswc-avatar>
      <iswc-avatar initials="MX" shape="square" label="MX"></iswc-avatar>
    </div>
  </section>
  <section>
    <h2>Imagen (URL rota → fallback)</h2>
    <div class="row">
      <iswc-avatar image="https://invalid.invalid/missing.png" initials="!!" label="Sin imagen"></iswc-avatar>
      <iswc-avatar label="Sin nada"></iswc-avatar>
    </div>
  </section>
  <section>
    <h2>Slot icon (custom)</h2>
    <div class="row">
      <iswc-avatar label="Robot">
        <iswc-icon slot="icon" icon="mdi:robot"></iswc-icon>
      </iswc-avatar>
      <iswc-avatar shape="rounded" label="Estrella">
        <iswc-icon slot="icon" icon="mdi:star"></iswc-icon>
      </iswc-avatar>
    </div>
  </section>
</main>
<footer>
  Atributos: <code>image</code> <code>initials</code> <code>label</code> <code>shape</code> <code>loading</code>.
  Eventos: <code>iswc-error</code> cuando la imagen falla.
</footer>
<script>
/* iswc-auto-rereload v2: backoff — polling client agnóstico del static server
 * W17: backoff exponencial + readyState wait + giveup tras MAX_FAILS fallos
 * consecutivos. Evita el loop infinito de reload-pin que vimos con Live
 * Server 5505 cuando el endpoint no responde. */
(function () {
  var tries = [
    'dist/cdn/reload-pin',
    '../dist/cdn/reload-pin',
    '../../dist/cdn/reload-pin',
    '../../../dist/cdn/reload-pin',
    '../../../../dist/cdn/reload-pin'
  ];
  var pinUrl = null;
  var last = null;
  var interval = 1500;          // arranca en 1.5s
  var MAX_INTERVAL = 30000;     // tope: 30s
  var MAX_FAILS = 6;            // tras 6 fallos consecutivos sin dev-server, dar up
  var fails = 0;
  var timer = 0;

  function poll() {
    if (!pinUrl) return;
    fetch(pinUrl, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw 0;
        return r.text();
      })
      .then(function (h) {
        h = h.trim();
        fails = 0;
        if (interval !== 1500) interval = 1500; // reset a 1.5s en éxito
        if (last !== null && last !== h) {
          location.reload();
          return;
        }
        last = h;
        schedule();
      })
      .catch(function () {
        fails++;
        if (fails >= MAX_FAILS) {
          // Sin dev-server o server muerto: dejar de gastar batería.
          if (timer) clearTimeout(timer);
          return;
        }
        // Backoff exponencial: 1.5s → 3s → 6s → 12s → 24s → 30s.
        interval = Math.min(interval * 2, MAX_INTERVAL);
        schedule();
      });
  }
  function schedule() {
    if (timer) clearTimeout(timer);
    timer = setTimeout(poll, interval);
  }
  function probe(i) {
    if (i >= tries.length) return; // sin dev-server activo, no hacer nada
    fetch(tries[i], { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw 0;
        pinUrl = tries[i];
        last = null;
        schedule();
      })
      .catch(function () { probe(i + 1); });
  }
  // Esperar a que la página esté lista antes de empezar (no quemar el
  // primer frame de CPU + red en una página que aún no pintó).
  function start() {
    if (document.readyState === 'complete') probe(0);
    else window.addEventListener('load', function () { probe(0); }, { once: true });
  }
  start();
})();
</script>
</body>
</html>
