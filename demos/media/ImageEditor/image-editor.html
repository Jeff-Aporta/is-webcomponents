<!doctype html>
<html lang="es" class="theme-dark" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Demo &lt;iswc-image-editor&gt; · is-webcomponents</title>
<meta name="description" content="Editor de imagen con crop, zoom, rotación y aspect-ratio lock. Canvas + selection overlay; emite iswc-load, iswc-change, iswc-crop." />
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #0c1118; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr auto; }
  header { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); background: #0f1620; }
  header h1 { font-size: 16px; font-weight: 700; margin: 0; }
  header p { font-size: 12px; color: #94a3b8; margin: 4px 0 0 0; }
  main { display: grid; grid-template-columns: 1fr; gap: 16px; padding: 20px; align-content: start; }
  section { background: #0f1620; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 16px; min-height: 360px; }
  section h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; margin: 0 0 12px 0; color: #94a3b8; font-weight: 600; }
  iswc-image-editor { display: block; width: 100%; height: 400px; max-width: 720px; }
  .toolbar-row { display: flex; gap: 8px; margin-top: 12px; }
  button.tool { padding: 6px 12px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.06); color: inherit; cursor: pointer; font-size: 12px; }
  button.tool:hover { background: rgba(255,255,255,0.12); }
  footer { padding: 12px 20px; border-top: 1px solid rgba(255,255,255,0.1); background: #0f1620; font-size: 11px; color: #94a3b8; }
  footer code { background: rgba(255,255,255,0.06); padding: 1px 5px; border-radius: 3px; font: 11px ui-monospace, Menlo, Consolas, monospace; }
  /* Anti-FOUC */
  iswc-image-editor:not(:defined) { visibility: hidden; }
</style>
<script type="module">
  // Cargar solo el bundle desde dist/cdn/.
  await import('../../../dist/cdn/media/image-editor.min.js?h=kouqhe');
  await customElements.whenDefined('iswc-image-editor');

  // Suscribirse a iswc-load, iswc-change, iswc-crop para logging (útil para tests).
  const editor = document.querySelector('iswc-image-editor');
  editor.addEventListener('iswc-load', (e) => {
    console.log('[image-editor] iswc-load', e.detail);
    document.documentElement.dataset.imageEditorLoaded = '1';
  });
  editor.addEventListener('iswc-change', (e) => {
    console.log('[image-editor] iswc-change', e.detail);
    document.documentElement.dataset.imageEditorChanged = '1';
  });
  editor.addEventListener('iswc-crop', (e) => {
    console.log('[image-editor] iswc-crop', e.detail);
    document.documentElement.dataset.imageEditorCropped = '1';
  });

  document.documentElement.dataset.imageEditorReady = '1';
</script>
</head>
<body>
<header>
  <h1>Demo — <code>&lt;iswc-image-editor&gt;</code></h1>
  <p>Crop, zoom, rotación. Toolbar por slot (zoom-in/out, rotate, reset, crop).</p>
</header>
<main>
  <section>
    <h2>Editor con imagen de muestra</h2>
    <!-- Imagen SVG inline (data URL) — funciona offline, sin CORS. -->
    <iswc-image-editor
      src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 500'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' x2='1' y1='0' y2='1'%3E%3Cstop offset='0' stop-color='%2322d3ee'/%3E%3Cstop offset='1' stop-color='%23a78bfa'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='800' height='500' fill='url(%23g)'/%3E%3Ccircle cx='200' cy='250' r='80' fill='white' opacity='0.9'/%3E%3Crect x='350' y='150' width='300' height='200' fill='%23fbbf24' rx='12'/%3E%3Ctext x='400' y='430' font-family='sans-serif' font-size='40' fill='white' text-anchor='middle'%3EDemo%20image%3C/text%3E%3C/svg%3E"
      zoom="1"
      rotation="0"
      aspect="1"
    >
      <div slot="toolbar" class="toolbar-row">
        <button title="+ Zoom" class="tool" data-action="zoom-in">+ Zoom</button>
        <button title="− Zoom" class="tool" data-action="zoom-out">− Zoom</button>
        <button title="↻ Rotar" class="tool" data-action="rotate">↻ Rotar</button>
        <button title="Reset" class="tool" data-action="reset">Reset</button>
        <button title="Crop" class="tool" data-action="crop">Crop</button>
      </div>
    </iswc-image-editor>
  </section>
</main>
<footer>
  Atributos: <code>src</code> <code>zoom</code> <code>rotation</code> <code>aspect</code>.
  Eventos: <code>iswc-load</code>, <code>iswc-change</code>, <code>iswc-crop</code>.
</footer>
<script>
/* iswc-auto-rereload v2: backoff — polling client agnóstico del static server
 * W17: backoff exponencial + readyState wait + giveup tras MAX_FAILS fallos
 * consecutivos. Evita el loop infinito de reload-pin que vimos con Live
 * Server 5505 cuando el endpoint no responde. */
(function () {
  var tries = [
    'dist/cdn/reload-pin',
    '../dist/cdn/reload-pin',
    '../../dist/cdn/reload-pin',
    '../../../dist/cdn/reload-pin',
    '../../../../dist/cdn/reload-pin'
  ];
  var pinUrl = null;
  var last = null;
  var interval = 1500;          // arranca en 1.5s
  var MAX_INTERVAL = 30000;     // tope: 30s
  var MAX_FAILS = 6;            // tras 6 fallos consecutivos sin dev-server, dar up
  var fails = 0;
  var timer = 0;

  function poll() {
    if (!pinUrl) return;
    fetch(pinUrl, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw 0;
        return r.text();
      })
      .then(function (h) {
        h = h.trim();
        fails = 0;
        if (interval !== 1500) interval = 1500; // reset a 1.5s en éxito
        if (last !== null && last !== h) {
          location.reload();
          return;
        }
        last = h;
        schedule();
      })
      .catch(function () {
        fails++;
        if (fails >= MAX_FAILS) {
          // Sin dev-server o server muerto: dejar de gastar batería.
          if (timer) clearTimeout(timer);
          return;
        }
        // Backoff exponencial: 1.5s → 3s → 6s → 12s → 24s → 30s.
        interval = Math.min(interval * 2, MAX_INTERVAL);
        schedule();
      });
  }
  function schedule() {
    if (timer) clearTimeout(timer);
    timer = setTimeout(poll, interval);
  }
  function probe(i) {
    if (i >= tries.length) return; // sin dev-server activo, no hacer nada
    fetch(tries[i], { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw 0;
        pinUrl = tries[i];
        last = null;
        schedule();
      })
      .catch(function () { probe(i + 1); });
  }
  // Esperar a que la página esté lista antes de empezar (no quemar el
  // primer frame de CPU + red en una página que aún no pintó).
  function start() {
    if (document.readyState === 'complete') probe(0);
    else window.addEventListener('load', function () { probe(0); }, { once: true });
  }
  start();
})();
</script>
</body>
</html>
