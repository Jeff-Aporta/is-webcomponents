<!doctype html>
<html lang="es" class="theme-dark" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Demo &lt;iswc-barcode&gt; · is-webcomponents</title>
<meta name="description" content="Generador de códigos de barras en SVG (Code128 y EAN-13). Renderiza barras a partir de un atributo value, con soporte para color fg/bg, altura y texto opcional." />
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #0c1118; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr auto; }
  header { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); background: #0f1620; }
  header h1 { font-size: 16px; font-weight: 700; margin: 0; }
  header p { font-size: 12px; color: #94a3b8; margin: 4px 0 0 0; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 20px; align-content: start; }
  section { background: #0f1620; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 16px; min-height: 160px; }
  section h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; margin: 0 0 12px 0; color: #94a3b8; font-weight: 600; }
  iswc-barcode { display: block; max-width: 360px; height: auto; }
  footer { padding: 12px 20px; border-top: 1px solid rgba(255,255,255,0.1); background: #0f1620; font-size: 11px; color: #94a3b8; }
  footer code { background: rgba(255,255,255,0.06); padding: 1px 5px; border-radius: 3px; font: 11px ui-monospace, Menlo, Consolas, monospace; }
  /* Anti-FOUC */
  iswc-barcode:not(:defined) { visibility: hidden; }
</style>
<script type="module">
  // Cargar solo el bundle que necesitamos desde dist/cdn/.
  await import('../../../dist/cdn/media/barcode.min.js?h=mdevgh');
  await customElements.whenDefined('iswc-barcode');

  // Suscribirse a iswc-render para logging (útil en tests)
  document.querySelectorAll('iswc-barcode').forEach((el) => {
    el.addEventListener('iswc-render', (e) => {
      console.log('[barcode] iswc-render', { value: el.getAttribute('value'), type: el.getAttribute('type') || 'code128' });
      document.documentElement.dataset.barcodeRenderFired = '1';
    });
  });

  document.documentElement.dataset.barcodeReady = '1';
</script>
</head>
<body>
<header>
  <h1>Demo — <code>&lt;iswc-barcode&gt;</code></h1>
  <p>Code128 (ASCII) y EAN-13 (12 dígitos + checksum). Renderiza en SVG inline.</p>
</header>
<main>
  <section>
    <h2>Code128 (texto libre)</h2>
    <iswc-barcode value="HELLO-WORLD-2026" type="code128" height="80" show-text></iswc-barcode>
  </section>
  <section>
    <h2>EAN-13 (con checksum auto)</h2>
    <iswc-barcode value="7790070410027" type="ean13" height="100"></iswc-barcode>
  </section>
  <section>
    <h2>Colores fg / bg</h2>
    <iswc-barcode value="SKU-12345" type="code128" height="60" bg="#0f1620" fg="#22d3ee" show-text></iswc-barcode>
  </section>
  <section>
    <h2>Sin texto (modo minimal)</h2>
    <iswc-barcode value="ABC-9876" type="code128" height="40"></iswc-barcode>
  </section>
</main>
<footer>
  Atributos: <code>value</code> <code>type</code> (code128|ean13) <code>height</code> <code>fg</code> <code>bg</code> <code>show-text</code>.
  Evento: <code>iswc-render</code> tras cada cambio.
</footer>
<script>
/* iswc-auto-rereload v2: backoff — polling client agnóstico del static server
 * W17: backoff exponencial + readyState wait + giveup tras MAX_FAILS fallos
 * consecutivos. Evita el loop infinito de reload-pin que vimos con Live
 * Server 5505 cuando el endpoint no responde. */
(function () {
  var tries = [
    'dist/cdn/reload-pin',
    '../dist/cdn/reload-pin',
    '../../dist/cdn/reload-pin',
    '../../../dist/cdn/reload-pin',
    '../../../../dist/cdn/reload-pin'
  ];
  var pinUrl = null;
  var last = null;
  var interval = 1500;          // arranca en 1.5s
  var MAX_INTERVAL = 30000;     // tope: 30s
  var MAX_FAILS = 6;            // tras 6 fallos consecutivos sin dev-server, dar up
  var fails = 0;
  var timer = 0;

  function poll() {
    if (!pinUrl) return;
    fetch(pinUrl, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw 0;
        return r.text();
      })
      .then(function (h) {
        h = h.trim();
        fails = 0;
        if (interval !== 1500) interval = 1500; // reset a 1.5s en éxito
        if (last !== null && last !== h) {
          location.reload();
          return;
        }
        last = h;
        schedule();
      })
      .catch(function () {
        fails++;
        if (fails >= MAX_FAILS) {
          // Sin dev-server o server muerto: dejar de gastar batería.
          if (timer) clearTimeout(timer);
          return;
        }
        // Backoff exponencial: 1.5s → 3s → 6s → 12s → 24s → 30s.
        interval = Math.min(interval * 2, MAX_INTERVAL);
        schedule();
      });
  }
  function schedule() {
    if (timer) clearTimeout(timer);
    timer = setTimeout(poll, interval);
  }
  function probe(i) {
    if (i >= tries.length) return; // sin dev-server activo, no hacer nada
    fetch(tries[i], { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw 0;
        pinUrl = tries[i];
        last = null;
        schedule();
      })
      .catch(function () { probe(i + 1); });
  }
  // Esperar a que la página esté lista antes de empezar (no quemar el
  // primer frame de CPU + red en una página que aún no pintó).
  function start() {
    if (document.readyState === 'complete') probe(0);
    else window.addEventListener('load', function () { probe(0); }, { once: true });
  }
  start();
})();
</script>
</body>
</html>
