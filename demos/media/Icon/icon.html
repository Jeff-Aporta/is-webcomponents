<!doctype html>
<html lang="es" class="theme-dark" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Demo &lt;iswc-icon&gt; · iswc-root</title>
<meta name="description" content="Sistema de iconos unificado. Carga SVG inline desde el bundle propio (sin iconify-icon). Soporta currentColor, themes dark/light, iconos multicolor (banderas) y atributo src para SVG custom." />
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #0c1118; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr auto; }
  header { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); background: #0f1620; }
  header h1 { font-size: 16px; font-weight: 700; margin: 0; }
  header p { font-size: 12px; color: #94a3b8; margin: 4px 0 0 0; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 20px; align-content: start; }
  section { background: #0f1620; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 16px; min-height: 160px; }
  section h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; margin: 0 0 12px 0; color: #94a3b8; font-weight: 600; }
  .row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; font-size: 1.6rem; color: #e2e8f0; }
  .row.lg { font-size: 2.6rem; }
  .swatch-light { background: #e2e8f0; color: #142033; padding: 8px 10px; border-radius: 6px; }
  footer { padding: 12px 20px; border-top: 1px solid rgba(255,255,255,0.1); background: #0f1620; font-size: 11px; color: #94a3b8; }
  footer code { background: rgba(255,255,255,0.06); padding: 1px 5px; border-radius: 3px; font: 11px ui-monospace, Menlo, Consolas, monospace; }
  /* Anti-FOUC */
  iswc-icon:not(:defined) { visibility: hidden; }
</style>
<script type="module">
  // Cargar solo el bundle de icon desde dist/cdn/. El icono se trae por
  // fetch desde el sistema de iconos propio (assets/icons → dist/assets/icons).
  await import('../../../dist/cdn/media/icon.min.js?v=86w69z');
  await customElements.whenDefined('iswc-icon');

  // Esperar a que se resuelvan algunos iconos (puede ser async)
  await new Promise((r) => setTimeout(r, 300));

  document.documentElement.dataset.iconReady = '1';
</script>
</head>
<body>
<header>
  <h1>Demo — <code>&lt;iswc-icon&gt;</code></h1>
  <p>Iconografía unificada (sin <code>iconify-icon</code>). Carga SVG inline; respeta <code>currentColor</code>.</p>
</header>
<main>
  <section>
    <h2>Monocromáticos (currentColor)</h2>
    <div class="row lg">
      <iswc-icon icon="mdi:home" label="Inicio"></iswc-icon>
      <iswc-icon icon="mdi:account" label="Cuenta"></iswc-icon>
      <iswc-icon icon="mdi:cog-outline" label="Ajustes"></iswc-icon>
      <iswc-icon icon="mdi:star" label="Favorito"></iswc-icon>
      <iswc-icon icon="mdi:bell-outline" label="Notificaciones"></iswc-icon>
      <iswc-icon icon="mdi:magnify" label="Buscar"></iswc-icon>
    </div>
  </section>
  <section>
    <h2>Con label (accesible)</h2>
    <div class="row lg">
      <iswc-icon icon="mdi:play" label="Reproducir"></iswc-icon>
      <iswc-icon icon="mdi:pause" label="Pausar"></iswc-icon>
      <iswc-icon icon="mdi:skip-next" label="Siguiente"></iswc-icon>
    </div>
  </section>
  <section>
    <h2>Sobre fondo claro (legibilidad)</h2>
    <div class="row lg swatch-light">
      <iswc-icon icon="mdi:home"></iswc-icon>
      <iswc-icon icon="mdi:cog-outline"></iswc-icon>
      <iswc-icon icon="mdi:star"></iswc-icon>
    </div>
  </section>
  <section>
    <h2>Compat name + library</h2>
    <div class="row lg">
      <iswc-icon name="github" library="mdi" label="GitHub"></iswc-icon>
      <iswc-icon name="robot" library="mdi"></iswc-icon>
      <iswc-icon name="cloud" library="mdi"></iswc-icon>
    </div>
  </section>
</main>
<footer>
  Atributos: <code>icon</code> ("grupo:nombre"), <code>name</code>+<code>library</code>, <code>label</code> (a11y), <code>src</code> (SVG custom).
</footer>
<script>
/* iswc-auto-rereload v2: backoff — polling client agnóstico del static server
 * W17: backoff exponencial + readyState wait + giveup tras MAX_FAILS fallos
 * consecutivos. Evita el loop infinito de reload-pin que vimos con Live
 * Server 5505 cuando el endpoint no responde. */
(function () {
  var tries = [
    'dist/cdn/reload-pin',
    '../dist/cdn/reload-pin',
    '../../dist/cdn/reload-pin',
    '../../../dist/cdn/reload-pin',
    '../../../../dist/cdn/reload-pin'
  ];
  var pinUrl = null;
  var last = null;
  var interval = 1500;          // arranca en 1.5s
  var MAX_INTERVAL = 30000;     // tope: 30s
  var MAX_FAILS = 6;            // tras 6 fallos consecutivos sin dev-server, dar up
  var fails = 0;
  var timer = 0;

  function poll() {
    if (!pinUrl) return;
    fetch(pinUrl, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw 0;
        return r.text();
      })
      .then(function (h) {
        h = h.trim();
        fails = 0;
        if (interval !== 1500) interval = 1500; // reset a 1.5s en éxito
        if (last !== null && last !== h) {
          location.reload();
          return;
        }
        last = h;
        schedule();
      })
      .catch(function () {
        fails++;
        if (fails >= MAX_FAILS) {
          // Sin dev-server o server muerto: dejar de gastar batería.
          if (timer) clearTimeout(timer);
          return;
        }
        // Backoff exponencial: 1.5s → 3s → 6s → 12s → 24s → 30s.
        interval = Math.min(interval * 2, MAX_INTERVAL);
        schedule();
      });
  }
  function schedule() {
    if (timer) clearTimeout(timer);
    timer = setTimeout(poll, interval);
  }
  function probe(i) {
    if (i >= tries.length) return; // sin dev-server activo, no hacer nada
    fetch(tries[i], { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw 0;
        pinUrl = tries[i];
        last = null;
        schedule();
      })
      .catch(function () { probe(i + 1); });
  }
  // Esperar a que la página esté lista antes de empezar (no quemar el
  // primer frame de CPU + red en una página que aún no pintó).
  function start() {
    if (document.readyState === 'complete') probe(0);
    else window.addEventListener('load', function () { probe(0); }, { once: true });
  }
  start();
})();
</script>
</body>
</html>
