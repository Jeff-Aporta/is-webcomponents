<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demo: <iswc-context-menu> · iswc-root</title>
  <meta name="description" content="Demo de <iswc-context-menu>: menú emergente anclado al clic derecho del ratón sobre un target." />
  <style>
    html, body {
      margin: 0; padding: 24px; min-height: 100%;
      background: #0c1118; color: #e2e8f0;
      font-family: ui-sans-serif, system-ui, sans-serif;
    }
    body { display: grid; gap: 24px; }
    header h1 { margin: 0 0 4px 0; font-size: 18px; }
    header p { margin: 0; color: #94a3b8; font-size: 12px; }
    section { background: #131a24; border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 16px; }
    section h2 { margin: 0 0 12px 0; font-size: 13px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.06em; }
    .target {
      background: #0a0f17; border: 1px dashed rgba(255,255,255,0.2); border-radius: 8px;
      padding: 30px; min-height: 80px; text-align: center; color: #cbd5e1;
      user-select: none;
    }
    pre { background: #0a0f17; padding: 10px; border-radius: 6px; font: 12px ui-monospace, Menlo, Consolas, monospace; color: #cbd5e1; overflow: auto; }
    /* Anti-FOUC */
    iswc-context-menu:not(:defined) { visibility: hidden; }
  </style>
</head>
<body>
  <header>
    <h1>Demo: <code>&lt;iswc-context-menu&gt;</code></h1>
    <p>Menú emergente en clic derecho. Uso: <code>&lt;iswc-context-menu for="#target"&gt;…items…&lt;/iswc-context-menu&gt;</code></p>
  </header>

  <section>
    <h2>Target con menú</h2>
    <div class="target" id="target">Haz clic derecho aquí</div>
    <iswc-context-menu for="#target" id="cm" placement="bottom-start" distance="4">
      <button title="Cortar" class="item" data-value="cut">Cortar</button>
      <button title="Copiar" class="item" data-value="copy">Copiar</button>
      <button title="Pegar" class="item" data-value="paste">Pegar</button>
      <hr />
      <button title="Eliminar" class="item" data-value="delete">Eliminar</button>
    </iswc-context-menu>
    <pre id="log">log: []</pre>
  </section>

  <script type="module">
    await import('../../../dist/cdn/actions/context-menu.min.js?h=80w36x');
    await customElements.whenDefined('iswc-context-menu');

    const log = document.getElementById('log');
    const events = [];
    const record = (label, detail) => {
      events.push({ ev: label, ...detail });
      log.textContent = JSON.stringify(events, null, 2);
    };

    const cm = document.getElementById('cm');
    cm.addEventListener('iswc-open', (e) => record('open', { x: e.detail.x, y: e.detail.y }));
    cm.addEventListener('iswc-close', () => record('close', {}));
    cm.addEventListener('iswc-select', (e) => record('select', { value: e.detail.value }));

    // API pública
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') cm.close();
    });

    document.documentElement.dataset.contextMenuReady = '1';
  </script>
<script>
/* iswc-auto-rereload v2: backoff — polling client agnóstico del static server
 * W17: backoff exponencial + readyState wait + giveup tras MAX_FAILS fallos
 * consecutivos. Evita el loop infinito de reload-pin que vimos con Live
 * Server 5505 cuando el endpoint no responde. */
(function () {
  var tries = [
    'dist/cdn/reload-pin',
    '../dist/cdn/reload-pin',
    '../../dist/cdn/reload-pin',
    '../../../dist/cdn/reload-pin',
    '../../../../dist/cdn/reload-pin'
  ];
  var pinUrl = null;
  var last = null;
  var interval = 1500;          // arranca en 1.5s
  var MAX_INTERVAL = 30000;     // tope: 30s
  var MAX_FAILS = 6;            // tras 6 fallos consecutivos sin dev-server, dar up
  var fails = 0;
  var timer = 0;

  function poll() {
    if (!pinUrl) return;
    fetch(pinUrl, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw 0;
        return r.text();
      })
      .then(function (h) {
        h = h.trim();
        fails = 0;
        if (interval !== 1500) interval = 1500; // reset a 1.5s en éxito
        if (last !== null && last !== h) {
          location.reload();
          return;
        }
        last = h;
        schedule();
      })
      .catch(function () {
        fails++;
        if (fails >= MAX_FAILS) {
          // Sin dev-server o server muerto: dejar de gastar batería.
          if (timer) clearTimeout(timer);
          return;
        }
        // Backoff exponencial: 1.5s → 3s → 6s → 12s → 24s → 30s.
        interval = Math.min(interval * 2, MAX_INTERVAL);
        schedule();
      });
  }
  function schedule() {
    if (timer) clearTimeout(timer);
    timer = setTimeout(poll, interval);
  }
  function probe(i) {
    if (i >= tries.length) return; // sin dev-server activo, no hacer nada
    fetch(tries[i], { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw 0;
        pinUrl = tries[i];
        last = null;
        schedule();
      })
      .catch(function () { probe(i + 1); });
  }
  // Esperar a que la página esté lista antes de empezar (no quemar el
  // primer frame de CPU + red en una página que aún no pintó).
  function start() {
    if (document.readyState === 'complete') probe(0);
    else window.addEventListener('load', function () { probe(0); }, { once: true });
  }
  start();
})();
</script>
</body>
</html>
