<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demo: <iswc-check-icon-button> · is-webcomponents</title>
  <meta name="description" content="Demo de <iswc-check-icon-button>: botón icon-only con estado checked, switch entre iconos, keyboard (Enter/Space)." />
  <style>
    html, body {
      margin: 0; padding: 24px; min-height: 100%;
      background: #0c1118; color: #e2e8f0;
      font-family: ui-sans-serif, system-ui, sans-serif;
    }
    body { display: grid; gap: 24px; }
    header h1 { margin: 0 0 4px 0; font-size: 18px; }
    header p { margin: 0; color: #94a3b8; font-size: 12px; }
    section { background: #131a24; border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 16px; }
    section h2 { margin: 0 0 12px 0; font-size: 13px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.06em; }
    .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
    .frame {
      background: #0a0f17; border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px; padding: 12px; min-width: 140px;
      display: grid; gap: 6px; justify-items: center;
    }
    .frame span { font-size: 11px; color: #94a3b8; font-family: ui-monospace, Menlo, Consolas, monospace; }
    pre { background: #0a0f17; padding: 10px; border-radius: 6px; font: 12px ui-monospace, Menlo, Consolas, monospace; color: #cbd5e1; overflow: auto; }
    /* Anti-FOUC */
    iswc-check-icon-button:not(:defined) { visibility: hidden; }
  </style>
</head>
<body>
  <header>
    <h1>Demo: <code>&lt;iswc-check-icon-button&gt;</code></h1>
    <p>Botón icon-only con dos estados. Toggle via click o Enter/Space. <code>aria-pressed</code> refleja el estado para AT.</p>
  </header>

  <section>
    <h2>Play / Pause</h2>
    <div class="row">
      <div class="frame">
        <iswc-check-icon-button title="Reproducir" id="play" icon="mdi:play" checked-icon="mdi:pause" label="Reproducir" checked-label="Pausar"></iswc-check-icon-button>
        <span>Reproducir / Pausar</span>
      </div>
      <div class="frame">
        <iswc-check-icon-button title="Silenciar" id="mute" icon="mdi:volume-high" checked-icon="mdi:volume-off" label="Silenciar" checked-label="Activar sonido"></iswc-check-icon-button>
        <span>Sonido</span>
      </div>
      <div class="frame">
        <iswc-check-icon-button title="Marcar favorito" id="star" icon="mdi:star-outline" checked-icon="mdi:star" color="#fbbf24" label="Marcar favorito" checked-label="Quitar de favoritos"></iswc-check-icon-button>
        <span>Favorito (color custom)</span>
      </div>
      <div class="frame">
        <iswc-check-icon-button title="Deshabilitado" disabled icon="mdi:cursor-default-click-outline" label="Deshabilitado"></iswc-check-icon-button>
        <span>Disabled</span>
      </div>
    </div>
  </section>

  <section>
    <h2>Eventos</h2>
    <pre id="evlog">[]</pre>
  </section>

  <script type="module">
    await import('../../../dist/cdn/actions/check-icon-button.min.js?h=agsxb0');
    await import('../../../dist/cdn/actions/button.min.js?h=gi9oba');
    await customElements.whenDefined('iswc-check-icon-button');

    const log = document.getElementById('evlog');
    const events = [];
    const record = (e) => {
      const target = e.target;
      events.push({
        id: target.id || target.tagName.toLowerCase(),
        checked: target.checked,
        ariaPressed: target.getAttribute('aria-pressed'),
      });
      log.textContent = JSON.stringify(events, null, 2);
    };
    for (const id of ['play', 'mute', 'star']) {
      document.getElementById(id).addEventListener('iswc-change', record);
    }
    document.documentElement.dataset.checkIconButtonReady = '1';
  </script>
<script>
/* iswc-auto-rereload v2: backoff — polling client agnóstico del static server
 * W17: backoff exponencial + readyState wait + giveup tras MAX_FAILS fallos
 * consecutivos. Evita el loop infinito de reload-pin que vimos con Live
 * Server 5505 cuando el endpoint no responde. */
(function () {
  var tries = [
    'dist/cdn/reload-pin',
    '../dist/cdn/reload-pin',
    '../../dist/cdn/reload-pin',
    '../../../dist/cdn/reload-pin',
    '../../../../dist/cdn/reload-pin'
  ];
  var pinUrl = null;
  var last = null;
  var interval = 1500;          // arranca en 1.5s
  var MAX_INTERVAL = 30000;     // tope: 30s
  var MAX_FAILS = 6;            // tras 6 fallos consecutivos sin dev-server, dar up
  var fails = 0;
  var timer = 0;

  function poll() {
    if (!pinUrl) return;
    fetch(pinUrl, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw 0;
        return r.text();
      })
      .then(function (h) {
        h = h.trim();
        fails = 0;
        if (interval !== 1500) interval = 1500; // reset a 1.5s en éxito
        if (last !== null && last !== h) {
          location.reload();
          return;
        }
        last = h;
        schedule();
      })
      .catch(function () {
        fails++;
        if (fails >= MAX_FAILS) {
          // Sin dev-server o server muerto: dejar de gastar batería.
          if (timer) clearTimeout(timer);
          return;
        }
        // Backoff exponencial: 1.5s → 3s → 6s → 12s → 24s → 30s.
        interval = Math.min(interval * 2, MAX_INTERVAL);
        schedule();
      });
  }
  function schedule() {
    if (timer) clearTimeout(timer);
    timer = setTimeout(poll, interval);
  }
  function probe(i) {
    if (i >= tries.length) return; // sin dev-server activo, no hacer nada
    fetch(tries[i], { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw 0;
        pinUrl = tries[i];
        last = null;
        schedule();
      })
      .catch(function () { probe(i + 1); });
  }
  // Esperar a que la página esté lista antes de empezar (no quemar el
  // primer frame de CPU + red en una página que aún no pintó).
  function start() {
    if (document.readyState === 'complete') probe(0);
    else window.addEventListener('load', function () { probe(0); }, { once: true });
  }
  start();
})();
</script>
</body>
</html>
