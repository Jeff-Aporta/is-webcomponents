<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demo: <iswc-speed-dial> · iswc-root</title>
  <meta name="description" content="Demo de <iswc-speed-dial>: FAB que despliega un abanico de acciones. Direcciones: up/down/left/right/radial." />
  <style>
    html, body {
      margin: 0; padding: 0; min-height: 100%;
      background: #0c1118; color: #e2e8f0;
      font-family: ui-sans-serif, system-ui, sans-serif;
    }
    body { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; padding: 24px; }
    @media (max-width: 720px) { body { grid-template-columns: 1fr; } }
    header { grid-column: 1 / -1; }
    header h1 { margin: 0 0 4px 0; font-size: 18px; }
    header p { margin: 0; color: #94a3b8; font-size: 12px; }
    section { background: #131a24; border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 16px; min-height: 360px; position: relative; }
    section h2 { margin: 0 0 8px 0; font-size: 13px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.06em; }
    .corner-trigger { position: absolute; right: 24px; bottom: 24px; }
    .inline-trigger { display: inline-block; margin: 16px; }
    pre { background: #0a0f17; padding: 10px; border-radius: 6px; font: 12px ui-monospace, Menlo, Consolas, monospace; color: #cbd5e1; overflow: auto; }
    /* Anti-FOUC */
    iswc-speed-dial:not(:defined) { visibility: hidden; }
    iswc-speed-dial-action:not(:defined) { visibility: hidden; }
  </style>
</head>
<body>
  <header>
    <h1>Demo: <code>&lt;iswc-speed-dial&gt;</code></h1>
    <p>FAB que despliega acciones. El trigger abre/cierra el dial; click en una acción emite <code>iswc-select</code>.</p>
  </header>

  <section>
    <h2>direction="up" (default)</h2>
    <iswc-speed-dial id="sd-up" label="Acciones rápidas" direction="up">
      <iswc-speed-dial-action title="Copiar" icon="mdi:content-copy" label="Copiar"></iswc-speed-dial-action>
      <iswc-speed-dial-action title="Compartir" icon="mdi:share-variant" label="Compartir"></iswc-speed-dial-action>
      <iswc-speed-dial-action title="Copiar enlace" icon="mdi:link-variant" label="Copiar enlace"></iswc-speed-dial-action>
    </iswc-speed-dial>
  </section>

  <section>
    <h2>direction="radial"</h2>
    <iswc-speed-dial id="sd-rad" label="Más acciones" direction="radial">
      <iswc-speed-dial-action title="Editar" icon="mdi:pencil" label="Editar"></iswc-speed-dial-action>
      <iswc-speed-dial-action title="Ver" icon="mdi:eye" label="Ver"></iswc-speed-dial-action>
      <iswc-speed-dial-action title="Archivar" icon="mdi:archive" label="Archivar"></iswc-speed-dial-action>
      <iswc-speed-dial-action title="Eliminar" icon="mdi:trash-can" color="danger" label="Eliminar"></iswc-speed-dial-action>
    </iswc-speed-dial>
  </section>

  <section>
    <h2>Eventos</h2>
    <pre id="log">[]</pre>
  </section>

  <script type="module">
    await import('../../../dist/cdn/actions/speed-dial.min.js?v=kd0zm7');
    await import('../../../dist/cdn/actions/check-icon-button.min.js?v=7i67bd');
    await customElements.whenDefined('iswc-speed-dial');

    const log = document.getElementById('log');
    const events = [];
    const record = (label, detail) => {
      events.push({ ev: label, ...detail });
      log.textContent = JSON.stringify(events, null, 2);
    };

    document.querySelectorAll('iswc-speed-dial').forEach((sd) => {
      sd.addEventListener('iswc-toggle', (e) => record('toggle', { open: e.detail.open }));
      sd.addEventListener('iswc-select', (e) => record('select', { label: e.detail.action.getAttribute('label') }));
    });

    document.documentElement.dataset.speedDialReady = '1';
  </script>
<script>
/* iswc-auto-rereload v2: backoff — polling client agnóstico del static server
 * W17: backoff exponencial + readyState wait + giveup tras MAX_FAILS fallos
 * consecutivos. Evita el loop infinito de reload-pin que vimos con Live
 * Server 5505 cuando el endpoint no responde. */
(function () {
  var tries = [
    'dist/cdn/reload-pin',
    '../dist/cdn/reload-pin',
    '../../dist/cdn/reload-pin',
    '../../../dist/cdn/reload-pin',
    '../../../../dist/cdn/reload-pin'
  ];
  var pinUrl = null;
  var last = null;
  var interval = 1500;          // arranca en 1.5s
  var MAX_INTERVAL = 30000;     // tope: 30s
  var MAX_FAILS = 6;            // tras 6 fallos consecutivos sin dev-server, dar up
  var fails = 0;
  var timer = 0;

  function poll() {
    if (!pinUrl) return;
    fetch(pinUrl, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw 0;
        return r.text();
      })
      .then(function (h) {
        h = h.trim();
        fails = 0;
        if (interval !== 1500) interval = 1500; // reset a 1.5s en éxito
        if (last !== null && last !== h) {
          location.reload();
          return;
        }
        last = h;
        schedule();
      })
      .catch(function () {
        fails++;
        if (fails >= MAX_FAILS) {
          // Sin dev-server o server muerto: dejar de gastar batería.
          if (timer) clearTimeout(timer);
          return;
        }
        // Backoff exponencial: 1.5s → 3s → 6s → 12s → 24s → 30s.
        interval = Math.min(interval * 2, MAX_INTERVAL);
        schedule();
      });
  }
  function schedule() {
    if (timer) clearTimeout(timer);
    timer = setTimeout(poll, interval);
  }
  function probe(i) {
    if (i >= tries.length) return; // sin dev-server activo, no hacer nada
    fetch(tries[i], { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw 0;
        pinUrl = tries[i];
        last = null;
        schedule();
      })
      .catch(function () { probe(i + 1); });
  }
  // Esperar a que la página esté lista antes de empezar (no quemar el
  // primer frame de CPU + red en una página que aún no pintó).
  function start() {
    if (document.readyState === 'complete') probe(0);
    else window.addEventListener('load', function () { probe(0); }, { once: true });
  }
  start();
})();
</script>
</body>
</html>
