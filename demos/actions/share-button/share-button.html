<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demo: <iswc-share-button> · is-webcomponents</title>
  <meta name="description" content="Demo de <iswc-share-button>: usa Web Share API y cae a clipboard si no está disponible." />
  <style>
    html, body {
      margin: 0; padding: 24px; min-height: 100%;
      background: #0c1118; color: #e2e8f0;
      font-family: ui-sans-serif, system-ui, sans-serif;
    }
    body { display: grid; gap: 24px; }
    header h1 { margin: 0 0 4px 0; font-size: 18px; }
    header p { margin: 0; color: #94a3b8; font-size: 12px; }
    section { background: #131a24; border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 16px; }
    section h2 { margin: 0 0 12px 0; font-size: 13px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.06em; }
    pre { background: #0a0f17; padding: 10px; border-radius: 6px; font: 12px ui-monospace, Menlo, Consolas, monospace; color: #cbd5e1; overflow: auto; }
    /* Anti-FOUC */
    iswc-share-button:not(:defined) { visibility: hidden; }
  </style>
</head>
<body>
  <header>
    <h1>Demo: <code>&lt;iswc-share-button&gt;</code></h1>
    <p>Invoca la Web Share API. Si el navegador no la soporta, copia al portapapeles. Emite <code>iswc-share</code> con <code>{ how: 'shared' | 'copied' }</code>.</p>
  </header>

  <section>
    <h2>Por defecto (title + url de la página)</h2>
    <iswc-share-button id="s1"></iswc-share-button>
  </section>

  <section>
    <h2>Con datos custom</h2>
    <iswc-share-button id="s2" share-title="Mi artículo" text="Te recomiendo este post" url="https://example.com/post/123"></iswc-share-button>
  </section>

  <section>
    <h2>Disabled</h2>
    <iswc-share-button id="s3" disabled></iswc-share-button>
  </section>

  <section>
    <h2>Eventos</h2>
    <pre id="log">[]</pre>
  </section>

  <script type="module">
    await import('../../../dist/cdn/actions/share-button.min.js?h=ecz5qv');
    await import('../../../dist/cdn/actions/button.min.js?h=gi9oba');
    await customElements.whenDefined('iswc-share-button');

    const log = document.getElementById('log');
    const events = [];
    const record = (label, detail) => {
      events.push({ ev: label, ...detail });
      log.textContent = JSON.stringify(events, null, 2);
    };

    document.querySelectorAll('iswc-share-button').forEach((s) => {
      s.addEventListener('iswc-share', (e) => record('share', e.detail));
      s.addEventListener('iswc-error', () => record('error', {}));
    });

    document.documentElement.dataset.shareButtonReady = '1';
  </script>
<script>
/* iswc-auto-reload: do not remove — polling client agnóstico del static server */
(function () {
  var tries = [
    'dist/cdn/reload-pin',
    '../dist/cdn/reload-pin',
    '../../dist/cdn/reload-pin',
    '../../../dist/cdn/reload-pin',
    '../../../../dist/cdn/reload-pin'
  ];
  var pinUrl = null;
  var last = null;
  function poll() {
    if (!pinUrl) return;
    fetch(pinUrl, { cache: 'no-store' })
      .then(function (r) { return r.text(); })
      .then(function (h) {
        h = h.trim();
        if (last !== null && last !== h) location.reload();
        last = h;
      })
      .catch(function () {});
  }
  function probe(i) {
    if (i >= tries.length) return; // sin dev-server activo, no hacer nada
    fetch(tries[i], { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw 0;
        pinUrl = tries[i];
        setInterval(poll, 1500);
      })
      .catch(function () { probe(i + 1); });
  }
  probe(0);
})();
</script>
</body>
</html>
