name: CDN · deploy a Cloudflare Pages

# Publica dist/cdn en Cloudflare Pages en cada push a main y refresca
# dist/cdn/versions.json con el mapeo commit -> URL inmutable del deployment.
# Ese mapeo no se puede calcular: Pages asigna un id propio a cada deploy.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'dist/cdn/versions.json'
  workflow_dispatch:

concurrency:
  group: cdn-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - name: Build dist/cdn
        run: npm run build

      # Pages admite 20.000 archivos por deployment y assets/icons trae ~317k
      # SVGs. Se publica solo el código; icon-loader.js ya cae en cascada a
      # GitHub Pages / jsDelivr para los iconos.
      # El build hace rm -rf de dist/cdn, así que versions.json se regenera
      # ANTES de publicar: si no, el bundle sale sin el mapeo y la URL queda
      # en 404 hasta el siguiente push. Aquí trae el histórico hasta el deploy
      # anterior; el paso posterior añade el de este run.
      - name: Sembrar versions.json (histórico previo)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/sync-cf-versions.mjs

      - name: Preparar carpeta de publicación (sin assets/icons)
        run: |
          mkdir -p .cf-publish
          rsync -a --exclude 'assets/' dist/cdn/ .cf-publish/
          echo "archivos: $(find .cf-publish -type f | wc -l)"

      - name: Deploy a Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@4 pages deploy .cf-publish \
            --project-name is-webcomponents \
            --branch main \
            --commit-hash "$GITHUB_SHA"

      # Segunda pasada: añade el deployment recién creado, que se commitea al
      # repo y viaja al bundle publicado en el push siguiente.
      - name: Refrescar versions.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/sync-cf-versions.mjs

      - name: Commit de dist/cdn + versions.json
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add dist/cdn
          if git diff --cached --quiet; then
            echo 'sin cambios que commitear'
          else
            git commit -m 'chore(cdn): build + versions.json [skip ci]'
            git push
          fi
