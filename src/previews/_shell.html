<!DOCTYPE html>
<html lang="es" class="theme-dark" data-theme="dark" data-palette="contapyme">
<head>
  <meta charset="UTF-8" />
  <script src="../../scripts/preview-boot.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Preview · IS Web Components</title>
  <script type="module">
    import { ISWebComponentsLoader as L } from '../../dist/cdn/loader.min.js';
    import { GALLERY_CHROME_TAGS } from '../../src/cdn/collect-is-tags.js';
    L.configure({ preferSelf: true, mirrors: ['jsdelivr', 'pages'] });
    await L.loadCSSBase();
    await L.loadCSSPalettesDefault();
    await L.loadPageStyles([
      '../styles/presentation.css',
      '../components/layout/preview-component.css',
    ]);
    await L.load(...GALLERY_CHROME_TAGS);
    await L.loadPageModules([
      '../../scripts/highlight-pre.js',
      '../../scripts/demo-code.js',
      '../../scripts/docs-chrome.js',
      '../../scripts/cdn-panel.js',
      '../../scripts/view-sources.js',
      '../../scripts/demo-file-meta.js',
      '../../scripts/preview-chrome.js',
    ]);
  </script>
  <style>
    html, body { height: 100%; margin: 0; }
    is-preview-component { height: 100%; }
  </style>
</head>
<body>
  <is-preview-component id="host"></is-preview-component>
  <script type="module">
    import { loadPreview } from './registry.js';
    import { collectIsTags } from '../../src/cdn/collect-is-tags.js';

    const params = new URLSearchParams(location.search);
    const tag = params.get('tag');
    if (!tag) {
      document.body.innerHTML = '<p class="lede" style="padding:2rem">Falta ?tag=…</p>';
      throw new Error('missing tag');
    }
    document.title = `${tag} · IS Web Components`;
    const preview = await loadPreview(tag);
    if (!preview) {
      document.body.innerHTML = `<p class="lede" style="padding:2rem">Sin preview controlado para <code>${tag}</code>.</p>`;
      throw new Error(`no controlled preview: ${tag}`);
    }
    const L = globalThis.ISWebComponentsLoader;
    if (L) await L.load(...collectIsTags(preview.definition ?? preview));
    document.getElementById('host').preview = preview;
  </script>
</body>
</html>
