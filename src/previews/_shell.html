<!DOCTYPE html>
<html lang="es" class="theme-dark" data-theme="dark" data-palette="contapyme">
<head>
  <meta charset="UTF-8" />
  <script src="../../scripts/preview-boot.js"></script>
  <script type="module" src="../../dist/cdn/all.min.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Preview · IS Web Components</title>
  <link rel="stylesheet" href="../styles/is-base.css" />
  <link rel="stylesheet" href="../styles/palettes.css" />
  <link rel="stylesheet" href="../styles/presentation.css" />
  <script type="module" src="../../scripts/highlight-pre.js"></script>
  <script type="module" src="../../scripts/demo-code.js"></script>
  <script type="module" src="../../scripts/docs-chrome.js"></script>
  <script type="module" src="../../scripts/cdn-panel.js"></script>
  <script type="module" src="../../scripts/preview-chrome.js"></script>
  <style>
    html, body { height: 100%; margin: 0; }
    is-preview-component { height: 100%; }
  </style>
</head>
<body>
  <is-preview-component id="host"></is-preview-component>
  <script type="module">
    import { loadPreview } from './registry.js';

    const params = new URLSearchParams(location.search);
    const tag = params.get('tag');
    if (!tag) {
      document.body.innerHTML = '<p class="lede" style="padding:2rem">Falta ?tag=…</p>';
      throw new Error('missing tag');
    }
    document.title = `${tag} · IS Web Components`;
    const preview = await loadPreview(tag);
    if (!preview) {
      document.body.innerHTML = `<p class="lede" style="padding:2rem">Sin preview controlado para <code>${tag}</code>.</p>`;
      throw new Error(`no controlled preview: ${tag}`);
    }
    document.getElementById('host').preview = preview;
  </script>
</body>
</html>
