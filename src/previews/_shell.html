<!DOCTYPE html>
<html lang="es" class="theme-dark" data-theme="dark" data-palette="delfin">
<head>
  <meta charset="UTF-8" />
  <script src="../../scripts/preview-boot.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Preview · ISWC</title>
  <script type="module">
    import { iswcLoader as L } from '../../dist/cdn/core/loader.min.mjs';
    import { GALLERY_CHROME_TAGS } from '../../src/cdn/collect-iswc-tags.js';
    L.configure({ preferSelf: true, mirrors: ['jsdelivr', 'pages'] });
    await L.loadPageStyles([
      'iswc-palettes-default',
      '../styles/presentation.css',
      '../components/layout/preview-component.css',
    ]);
    await L.load(...GALLERY_CHROME_TAGS);
    // Módulos ES con extensión `.js` (fuente servida por serve.mjs): `module:` fuerza el tipo (D2: `.js` = clásico).
    await L.loadPageModules([
      'module:../../scripts/highlight-pre.js',
      'module:../../scripts/demo-code.js',
      'module:../../scripts/docs-chrome.js',
      'module:../../scripts/cdn-panel.js',
      'module:../../scripts/view-sources.js',
      'module:../../scripts/demo-file-meta.js',
      'module:../../scripts/preview-chrome.js',
    ]);
  </script>
  <style>
    html, body { height: 100%; margin: 0; }
    iswc-preview-component { height: 100%; }
  </style>
</head>
<body>
  <iswc-preview-component id="host"></iswc-preview-component>
  <script type="module">
    import { loadPreview } from './registry.js';
    import { collectIsTags } from '../../src/cdn/collect-iswc-tags.js';

    const params = new URLSearchParams(location.search);
    const tag = params.get('tag');
    if (!tag) {
      document.body.innerHTML = '<p class="lede" style="padding:2rem">Falta ?tag=…</p>';
      throw new Error('missing tag');
    }
    document.title = `${tag} · ISWC`;
    const preview = await loadPreview(tag);
    if (!preview) {
      document.body.innerHTML = `<p class="lede" style="padding:2rem">Sin preview controlado para <code>${tag}</code>.</p>`;
      throw new Error(`no controlled preview: ${tag}`);
    }
    const L = globalThis.iswcLoader;
    if (L) await L.load(...collectIsTags(preview.definition ?? preview));
    document.getElementById('host').preview = preview;
  </script>
</body>
</html>
